<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>PhiLearn Leeratelier</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600&family=Lexend:wght@400;500&display=swap" rel="stylesheet">
<style>
/* PhiLearn huisstijl v0.1 — één visuele taal voor alle trainingen.
   Lichte, rustige ondergrond; violet is het merk; groen = gelukt; honing = tussenstap. Geen rood. */
:root{
  --pl-paper:#F7F5FD;      /* achtergrond: licht lavendelwit */
  --pl-surface:#FFFFFF;    /* kaarten en panelen */
  --pl-ink:#2B2540;        /* tekst: diep aubergine */
  --pl-ink-soft:#5E5876;   /* rustige tekst */
  --pl-line:#E4DEF3;       /* lijnen en randen */
  --pl-mist:#D9D3EA;       /* neutraal: 'dit is een ander land' */
  --pl-violet:#6F55D9;     /* merk, knoppen, focus */
  --pl-violet-deep:#5640B8;
  --pl-violet-soft:#ECE7FC;
  --pl-lilac:#B9A8F2;      /* bloemblad, tweede kleur in de tienstrook */
  --pl-leaf:#2F8F5E;       /* gelukt */
  --pl-leaf-soft:#E2F3E9;
  --pl-honey:#B9790F;      /* tussenstap */
  --pl-honey-soft:#FBF1DC;
  --pl-sea:#DCE6F4;        /* zee op de kaart */
  --pl-land:#EFEBF7;       /* land buiten de training */
  --pl-display:"Fredoka","Trebuchet MS",system-ui,sans-serif;
  --pl-body:"Lexend",system-ui,-apple-system,"Segoe UI",sans-serif;
  --pl-r-card:18px; --pl-r-pill:999px;
  color-scheme:light;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%}
body{margin:0;background:var(--pl-paper);color:var(--pl-ink);font-family:var(--pl-body);font-size:17px;line-height:1.5}
button{font:inherit;color:inherit}
button:focus-visible,input:focus-visible,textarea:focus-visible{outline:3px solid var(--pl-violet);outline-offset:2px}
.pl-app{min-height:100%;max-width:980px;margin:0 auto;padding-inline:16px;padding-block:14px 28px;display:flex;flex-direction:column;gap:14px}

/* kop */
.pl-top{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.pl-logo{width:44px;height:44px;border:0;background:none;padding:0;cursor:default;flex:none;-webkit-touch-callout:none;user-select:none;-webkit-user-select:none}
.pl-title{min-width:0;flex:1}
.pl-title h1{font-family:var(--pl-display);font-weight:600;font-size:1.6rem;line-height:1.1;margin:0}
.pl-helps{margin:2px 0 0;font-size:.85rem;color:var(--pl-ink-soft)}
.pl-garden-btn{border:1.5px solid var(--pl-line);background:var(--pl-surface);border-radius:var(--pl-r-pill);min-height:44px;padding:8px 16px;font-weight:500;cursor:pointer}
.pl-garden-btn:hover{border-color:var(--pl-violet)}

/* schermen */
.pl-screen{display:flex;flex-direction:column;gap:14px}
.pl-card{background:var(--pl-surface);border-radius:var(--pl-r-card);padding:20px;border:1px solid var(--pl-line)}
.pl-h2{font-family:var(--pl-display);font-weight:600;font-size:1.5rem;line-height:1.15;margin:0 0 6px;text-wrap:balance}
.pl-lead{margin:0;color:var(--pl-ink-soft);max-width:60ch}
.pl-forms{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px;margin-top:14px}
.pl-form{text-align:left;border:2px solid var(--pl-line);background:var(--pl-paper);border-radius:var(--pl-r-card);padding:14px 16px;cursor:pointer;display:grid;gap:4px}
.pl-form b{font-family:var(--pl-display);font-weight:600;font-size:1.15rem}
.pl-form span{font-size:.9rem;color:var(--pl-ink-soft)}
.pl-form[aria-pressed="true"]{border-color:var(--pl-violet);background:var(--pl-violet-soft)}
.pl-row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}

/* knoppen: één vorm per rol */
.pl-btn{border:0;border-radius:var(--pl-r-pill);padding:12px 22px;min-height:48px;font-family:var(--pl-display);font-weight:600;font-size:1.15rem;cursor:pointer;background:var(--pl-violet);color:#fff}
.pl-btn:hover{background:var(--pl-violet-deep)}
.pl-btn.big{font-size:1.35rem;padding:14px 30px}
.pl-btn.quiet{background:var(--pl-surface);color:var(--pl-ink);border:2px solid var(--pl-line)}
.pl-btn.quiet:hover{border-color:var(--pl-violet)}
.pl-btn[disabled]{opacity:.5;cursor:default}

/* vraag */
.pl-ask{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.pl-ask-lead{font-family:var(--pl-display);font-size:1.15rem;color:var(--pl-ink-soft)}
.pl-ask-main{font-family:var(--pl-display);font-weight:600;font-size:clamp(1.8rem,5vw,2.5rem);line-height:1.05}
.pl-dots{display:flex;gap:6px;align-items:center}
/* stippen: nog = open rondje, nu = gevuld met ring, gedaan = gevuld (vorm én kleur) */
.pl-dot{width:12px;height:12px;border-radius:50%;background:var(--pl-surface);border:2px solid var(--pl-ink-soft);box-sizing:border-box}
.pl-dot.done{background:var(--pl-violet);border-color:var(--pl-violet)}
.pl-dot.now{background:var(--pl-violet);border-color:var(--pl-violet);box-shadow:0 0 0 3px var(--pl-surface),0 0 0 5px var(--pl-violet)}

/* feedback: drie vaste vormen */
.pl-fb{min-height:0}
.pl-fb:empty{display:none}
.pl-ok{background:var(--pl-leaf-soft);border:2px solid var(--pl-leaf);border-radius:var(--pl-r-card);padding:12px 16px;color:var(--pl-ink)}
.pl-ok b{color:#1F6B45;font-family:var(--pl-display);font-weight:600;margin-right:6px}
.pl-step{background:var(--pl-honey-soft);border:2px dashed var(--pl-honey);border-radius:var(--pl-r-card);padding:12px 16px;color:var(--pl-ink)}
.pl-step b{color:#8A5A0B;font-family:var(--pl-display);font-weight:600;margin-right:6px}
.pl-cheer{background:var(--pl-violet-soft);border-radius:var(--pl-r-card);padding:16px 18px;font-family:var(--pl-display);font-size:1.25rem;line-height:1.35}
.pl-note{font-size:.9rem;color:var(--pl-ink-soft)}
.pl-fact{border-top:1px solid var(--pl-line);padding-top:12px;font-size:.95rem;color:var(--pl-ink-soft)}
.pl-fact b{color:var(--pl-ink)}

/* tuin (laat zien) */
.pl-garden{display:flex;flex-wrap:wrap;gap:6px;align-items:flex-end;min-height:70px}
.pl-garden svg{width:58px;height:70px}
.pl-cando{display:flex;flex-wrap:wrap;gap:8px;margin:8px 0 0;padding:0;list-style:none}
.pl-cando li{background:var(--pl-leaf-soft);border-radius:var(--pl-r-pill);padding:4px 12px;font-size:.95rem}

/* ouderscherm */
.pl-parent{position:fixed;inset:0;background:rgba(43,37,64,.45);display:grid;place-items:center;padding:16px;z-index:20;overflow:auto}
.pl-parent .pl-card{max-width:760px;width:100%;max-height:calc(100vh - 32px);overflow:auto}
.pl-table-wrap{overflow-x:auto}
.pl-table{border-collapse:collapse;width:100%;font-size:.9rem;font-variant-numeric:tabular-nums}
.pl-table th,.pl-table td{text-align:left;padding:6px 8px;border-bottom:1px solid var(--pl-line);white-space:nowrap}
.pl-table th{font-weight:500;color:var(--pl-ink-soft)}
.pl-parent pre{white-space:pre-wrap;background:var(--pl-paper);border-radius:12px;padding:12px;font-size:.85rem;max-height:220px;overflow:auto}
.pl-parent textarea{width:100%;min-height:70px;border:2px solid var(--pl-line);border-radius:12px;padding:8px;font:.85rem ui-monospace,Menlo,monospace;background:var(--pl-paper)}
.pl-h3{font-family:var(--pl-display);font-weight:600;font-size:1.15rem;margin:4px 0 0}
.pl-foot{margin-top:auto;font-size:.75rem;color:var(--pl-ink-soft);text-align:right;user-select:none}

/* keypad (rekenen) */
.pl-keypad{display:grid;grid-template-columns:repeat(5,minmax(48px,1fr));gap:8px;max-width:420px}
.pl-key{min-height:52px;border-radius:14px;border:2px solid var(--pl-line);background:var(--pl-surface);font-family:var(--pl-display);font-weight:600;font-size:1.4rem;cursor:pointer}
.pl-key:hover{border-color:var(--pl-violet)}
.pl-key.wide{grid-column:span 2;font-size:1.1rem}
.pl-key.go{background:var(--pl-violet);border-color:var(--pl-violet);color:#fff}

@media (max-width:560px){.pl-card{padding:16px}.pl-btn.big{width:100%}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

/* v0.2: home */
.pl-hero{position:relative;background:var(--pl-violet-soft);border-radius:26px;padding:22px;min-height:150px;display:flex;align-items:center;overflow:hidden}
.pl-hero-text{max-width:60%;display:grid;gap:6px}
.pl-hero-img{position:absolute;right:-6px;bottom:-10px;height:170px;border-radius:50% 50% 0 0}
.pl-today{display:grid;gap:10px}
.pl-eyebrow{font-size:.875rem;font-weight:500;letter-spacing:.04em;text-transform:uppercase;color:var(--pl-ink-soft)}
.pl-list{display:grid;gap:10px}
.pl-listrow{display:flex;align-items:center;gap:12px;background:var(--pl-surface);border:1.5px solid var(--pl-line);border-radius:18px;padding:10px 12px;cursor:pointer;text-align:left;color:var(--pl-ink)}
.pl-listrow:hover{border-color:var(--pl-violet)}
.pl-badge{width:40px;height:40px;border-radius:12px;display:flex;align-items:center;justify-content:center;font-family:var(--pl-display);font-weight:600;color:var(--pl-violet-deep);flex:none}
.pl-listtext{flex:1;display:flex;flex-direction:column;min-width:0}
.pl-listtext b{font-weight:500}.pl-listtext span{font-size:.85rem;color:var(--pl-ink-soft)}
.pl-chev{width:10px;height:10px;border-right:2px solid var(--pl-ink-soft);border-bottom:2px solid var(--pl-ink-soft);transform:rotate(-45deg);margin-right:6px}
/* v0.2: rekenmuur modellen */
.rk-model{display:grid;gap:8px;transition:opacity .4s;min-height:0}
.rk-model.gone{opacity:0}
.rk-line{width:min(100%,320px);height:auto;display:block}
.rk-grid{display:grid;gap:4px;width:max-content;max-width:100%}
.rk-grid .rk-cell{width:16px}
.rk-skip{display:flex;gap:6px;flex-wrap:wrap}
.rk-skip span{background:var(--pl-violet-soft);border-radius:999px;padding:2px 10px;font-size:.85rem;font-variant-numeric:tabular-nums}
/* v0.2: eigen ronde */
.pl-make{display:flex;align-items:center;gap:12px;border:2px dashed var(--pl-lilac);background:var(--pl-surface);border-radius:22px;padding:14px 16px;cursor:pointer;text-align:left;color:var(--pl-ink)}
.pl-make:hover{border-color:var(--pl-violet)}
.pl-make .pl-listtext b{font-family:var(--pl-display);font-weight:600;font-size:1.1rem}
.pl-plus{width:40px;height:40px;border-radius:999px;background:var(--pl-violet);position:relative;flex:none}
.pl-plus::before,.pl-plus::after{content:"";position:absolute;left:50%;top:50%;background:#fff;border-radius:2px;transform:translate(-50%,-50%)}
.pl-plus::before{width:16px;height:2.5px}.pl-plus::after{width:2.5px;height:16px}
.pl-btn[aria-pressed="true"]{border-color:var(--pl-violet);background:var(--pl-violet-soft)}
@media (max-width:560px){.pl-garden-btn{padding:8px 12px;font-size:.95rem}.pl-title h1{font-size:1.35rem}}
/* v0.3: zinnen en werkwoorden */
.gr-board{display:grid;gap:12px}
.gr-zin{margin:0;font-family:var(--pl-display);font-weight:500;font-size:1.5rem;line-height:1.9;display:flex;flex-wrap:wrap;gap:4px 6px;align-items:baseline}
.gr-w{font:inherit;border:2px solid transparent;background:var(--pl-paper);border-radius:10px;padding:2px 8px;cursor:pointer;color:var(--pl-ink)}
.gr-w:hover:not([disabled]){border-color:var(--pl-lilac)}
.gr-w.on{background:var(--pl-violet-soft);border-color:var(--pl-violet);color:var(--pl-violet-deep)}
.gr-w[disabled]{cursor:default;color:var(--pl-ink)}
.gr-w[disabled]:not(.on){background:transparent}
.gr-punt{font-size:1.5rem}
.gr-opt.gr-long{font-size:1rem;white-space:normal;text-align:left;line-height:1.3}
.gr-step:empty{display:none}
.ww-board{display:grid;gap:12px}
.ww-zin{margin:0;font-family:var(--pl-display);font-weight:500;font-size:1.6rem;line-height:1.4}
.ww-steps{display:flex;flex-wrap:wrap;gap:8px}
.ww-steps:empty{display:none}
.ww-steps span{background:var(--pl-paper);border-radius:999px;padding:2px 12px;font-size:.95rem;color:var(--pl-ink-soft)}
.rk-bar{position:relative;width:min(100%,300px);height:28px;border:2px solid var(--pl-line);border-radius:999px;overflow:hidden;background:var(--pl-surface)}
.rk-bar span{position:absolute;left:0;top:0;bottom:0;background:var(--pl-lilac)}
.rk-bar b{position:absolute;left:10px;top:3px;font-family:var(--pl-display);font-weight:600}
.pl-form.locked{opacity:.55;cursor:default;border-style:dashed}
/* v0.4: ronde verlaten, compacte stenenkeuze, knop in beeld */
.pl-confirm{display:flex;flex-wrap:wrap;gap:10px;align-items:center;background:var(--pl-violet-soft);border-radius:var(--pl-r-card);padding:12px 16px}
.pl-stones{grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px;margin-top:0}
.pl-stones .pl-form{padding:10px 12px}
.pl-stones .pl-form b{font-size:.95rem}
.pl-stones .pl-form span{font-size:.85rem}
.pl-sticky{position:sticky;bottom:0;background:var(--pl-paper);padding:10px 0 6px;z-index:2}

.rk-board{display:grid;gap:12px;justify-items:start}
.rk-trail{display:flex;flex-wrap:wrap;gap:8px;min-height:1.6em}
.rk-trail span{background:var(--pl-paper);border-radius:var(--pl-r-pill);padding:2px 12px;font-size:.95rem;color:var(--pl-ink-soft);font-variant-numeric:tabular-nums}
.rk-sum{font-family:var(--pl-display);font-weight:600;font-size:clamp(2.2rem,8vw,3.4rem);line-height:1.1;font-variant-numeric:tabular-nums}
.rk-slot{display:inline-block;min-width:1.6em;border-bottom:4px solid var(--pl-violet);text-align:center;color:var(--pl-violet-deep)}
.rk-frames{display:grid;gap:8px;transition:opacity .4s}
.rk-frames.gone{opacity:0}
.rk-strip{display:grid;grid-template-columns:repeat(10,minmax(22px,34px));gap:4px;border:2px solid var(--pl-line);border-radius:12px;padding:6px;background:var(--pl-surface)}
.rk-cell{aspect-ratio:1;border-radius:50%;border:2px dashed var(--pl-line);max-width:100%}
.rk-cell.v{background:var(--pl-violet);border-color:var(--pl-violet)}
.rk-cell.l{background:var(--pl-lilac);border-color:var(--pl-lilac)}
.rk-cell.x{background:transparent;border:2px solid var(--pl-lilac)}

.sp-board{display:grid;gap:14px}
.sp-frame{font-family:var(--pl-display);font-weight:600;font-size:clamp(1.8rem,6vw,2.6rem);margin:0;line-height:1.15}
.sp-frame b{color:var(--pl-leaf)}
.sp-gap{color:var(--pl-lilac)}
.sp-choice{font-size:1.5rem;min-width:9ch}
.sp-in{font:600 1.5rem var(--pl-display);border:2px solid var(--pl-line);border-radius:14px;padding:8px 14px;min-width:0;width:min(100%,14ch);background:var(--pl-paper)}
.sp-step{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.sp-step:empty{display:none}
.sp-grepen{display:flex;align-items:center;gap:10px;font-family:var(--pl-display);font-weight:600;font-size:2rem}
.sp-grepen span:not(.sp-bar){background:var(--pl-violet-soft);border-radius:12px;padding:4px 14px}
.sp-bar{width:3px;height:1.4em;background:var(--pl-honey);border-radius:2px}



.eu-stage{border-radius:var(--pl-r-card);overflow:hidden;background:var(--pl-sea);height:min(60vh,560px);border:1px solid var(--pl-line)}
#eu-map{width:100%;height:100%;display:block;touch-action:manipulation;user-select:none;-webkit-user-select:none}
.eu-sea{fill:var(--pl-sea)}
.eu-bg{fill:#E3DDEF;stroke:#C9C1DD;stroke-width:.6;vector-effect:non-scaling-stroke}
.eu-land{fill:#E3DDEF;stroke:#B4ABCC;stroke-width:.8;vector-effect:non-scaling-stroke;cursor:pointer;transition:fill .25s}
.eu-land.eu-in{fill:var(--pl-surface)}
.eu-land.eu-ok,.eu-dot.eu-ok{fill:var(--pl-leaf)}
.eu-land.eu-target,.eu-dot.eu-target{fill:var(--pl-violet)}
.eu-land.eu-buur,.eu-dot.eu-buur{fill:var(--pl-honey-soft);stroke:var(--pl-honey);stroke-width:2.5}
.eu-land.eu-mis,.eu-dot.eu-mis{fill:var(--pl-mist)}
.eu-pulse{stroke:var(--pl-violet)!important;stroke-width:4!important;animation:eu-p 1s ease-in-out infinite}
@keyframes eu-p{50%{stroke-opacity:.2}}
.eu-dot{fill:var(--pl-surface);stroke:var(--pl-ink);stroke-width:1.4;vector-effect:non-scaling-stroke;cursor:pointer}
.eu-lbl{font-family:var(--pl-display);font-weight:600;fill:var(--pl-ink);stroke:#fff;stroke-width:4px;stroke-linejoin:round;paint-order:stroke;pointer-events:none;text-anchor:middle;dominant-baseline:middle}
.eu-lbl.mis{fill:var(--pl-ink-soft)}
.eu-lbl.buur{fill:var(--pl-honey)}
#eu-opts:empty{display:none}

</style>
</head>

<script>
/* PhiLearn kern v0.4
   Eén motor voor alle trainingen. Trainingen leveren alleen stenen (generatoren) en een werkvlak.
   De kern regelt: startscherm, rondes, stille diagnose, twee verborgen hefbomen (moeilijkheid, herhaling),
   faden van het model, feedback, uitleg-moment, tuin, ouderscherm, materiaalpakketten en het logboek. */
(function(){
"use strict";
const PL = window.PL = {};
PL.VERSION = "v0.4";
const $ = id => document.getElementById(id);
const esc = s => String(s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const shuffle = a => { a = a.slice(); for (let i = a.length - 1; i > 0; i--){ const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
const pick = a => a[Math.floor(Math.random() * a.length)];
const rnd = (a, b) => a + Math.floor(Math.random() * (b - a + 1));
const sleep = ms => new Promise(r => setTimeout(r, ms));
const today = () => new Date().toISOString().slice(0, 10);
const dayNum = iso => Math.floor(Date.parse(iso + "T12:00:00Z") / 864e5);
function weekKey(iso){ const d = new Date(iso + "T12:00:00"); const day = (d.getDay() + 6) % 7; d.setDate(d.getDate() - day); return d.toISOString().slice(0, 10); }
const median = a => { if (!a.length) return null; const s = a.slice().sort((x, y) => x - y); const m = s.length >> 1; return s.length % 2 ? s[m] : (s[m - 1] + s[m]) / 2; };
const noEmoji = s => String(s || "").replace(/[\p{Extended_Pictographic}\u{FE0F}]/gu, "").replace(/\s+/g, " ").trim();
Object.assign(PL, {$, esc, shuffle, pick, rnd, sleep, today, median});

/* ---------- parameters uit het onderzoek (zie kennis/06) ---------- */
const P = {
  roundSize: 6, warm: 2,                 // 2 opwarmers uit groene stof, 4 uit de huidige steen
  fluentMs: 3000,                        // vlot = goed in één keer binnen 3 s (na typ-correctie)
  powerWindow: 5, powerNeed: 4,          // beheersing: 4 van de laatste 5 goed in één keer
  speedWindow: 6,                        // tempo: mediaan van de laatste 6 goede antwoorden ≤ fluentMs
  promoteFirst: 5,                       // ronde met ≥5/6 in één keer → stapje verder (als steen groen is)
  demoteSteps: 3,                        // ronde met ≥3 tussenstappen → stapje terug
  cooldownRounds: 1,                     // na een stap eerst één ronde rust
  holdRounds: 2,                         // na een stapje terug slaat de stille diagnose 2 rondes niets over (anders is de stap meteen ongedaan)
  review: [2, 5, 12, 30],                // herhaalchecks in dagen
  requeueAfter: 3,                       // na een tussenstap komt het item 3 vragen later terug
  wheel: 10,                             // 10 vragen zonder 3 goed op rij → stap terug
  sessionMin: 15,
  maxEvents: 3000
};
PL.P = P;

/* ---------- het merkteken ---------- */
PL.flower = function(petals, opts){
  opts = opts || {}; const n = 5, on = Math.max(0, Math.min(n, petals));
  let s = `<svg viewBox="0 0 58 70" aria-hidden="true">`;
  if (opts.stem !== false) s += `<path d="M29 40 V68" stroke="#2F8F5E" stroke-width="3" stroke-linecap="round"/><path d="M29 58 C 36 52, 44 54, 46 50 C 40 49, 33 51, 29 56" fill="#2F8F5E"/>`;
  for (let i = 0; i < n; i++){
    const a = (i / n) * Math.PI * 2 - Math.PI / 2, cx = 29 + Math.cos(a) * 11, cy = 24 + Math.sin(a) * 11;
    s += `<ellipse cx="${cx.toFixed(1)}" cy="${cy.toFixed(1)}" rx="8" ry="11" transform="rotate(${(a * 180 / Math.PI + 90).toFixed(0)} ${cx.toFixed(1)} ${cy.toFixed(1)})" fill="${i < on ? "#B9A8F2" : "#E4DEF3"}"/>`;
  }
  return s + `<circle cx="29" cy="24" r="6.5" fill="#6F55D9"/></svg>`;
};

/* ---------- opslag ---------- */
async function makeStore(){
  try {
    if (window.storage && typeof window.storage.get === "function" && typeof window.storage.set === "function"){
      return { kind: "Claude-opslag (chat)", persist: true,
        async load(k){ try { const r = await window.storage.get(k); const v = r && typeof r === "object" ? r.value : r; return v ? JSON.parse(v) : null; } catch(e){ return null; } },
        async save(k, obj){ await window.storage.set(k, JSON.stringify(obj)); } };
    }
  } catch(e){}
  try {
    if (window.claude && typeof window.claude.use === "function"){
      const [db, user] = await Promise.all([window.claude.use("db"), window.claude.use("user")]);
      const uid = db && user && typeof user.id === "function" ? await user.id() : null;
      if (db && uid) return { kind: "Claude-opslag (gepubliceerd)", persist: true,
        async load(k){ try { const s = await db.doc(`data/users/${uid}/${k}`).get(); return s.exists ? JSON.parse(s.data().json) : null; } catch(e){ return null; } },
        async save(k, obj){ await db.doc(`data/users/${uid}/${k}`).set({json: JSON.stringify(obj)}); } };
    }
  } catch(e){}
  try {
    localStorage.setItem("pl-test", "1"); localStorage.removeItem("pl-test");
    return { kind: "browser (alleen dit apparaat)", persist: true,
      async load(k){ try { return JSON.parse(localStorage.getItem(k)); } catch(e){ return null; } },
      async save(k, obj){ try { localStorage.setItem(k, JSON.stringify(obj)); } catch(e){} } };
  } catch(e){}
  const mem = {};
  return { kind: "alleen deze sessie", persist: false, async load(k){ return mem[k] || null; }, async save(k, obj){ mem[k] = JSON.parse(JSON.stringify(obj)); } };
}

/* ---------- Claude aanroepen (alleen bemoediging; nooit rekenen) ---------- */
let aiFn = null, aiKind = "niet beschikbaar", aiOff = false;
async function detectAI(){
  try {
    const c = window.claude;
    if (c && typeof c.complete === "function"){ aiKind = "Claude (chat)"; aiFn = async p => { const r = await c.complete(p); return typeof r === "string" ? r : (r && (r.text || r.completion)) || ""; }; return; }
    if (c && typeof c.use === "function"){ const s = await c.use("sample"); if (s){ aiKind = "Claude (gepubliceerd)"; aiFn = async p => (await s(p, {modelTier: "quick", cache: false})).text; } }
  } catch(e){}
}
const FORBIDDEN = /\b(niveau|groep \d|groep|cijfer|score|punten|makkelijk|simpel|slim|dom|zwak|slecht|beter dan|sneller dan|leeftijd|jaar oud)\b/i;
PL.ai = async function(prompt){
  if (!aiFn || aiOff) return null;
  try { const t = noEmoji(await aiFn(prompt)); if (!t || FORBIDDEN.test(t)) return null; return t.slice(0, 320); }
  catch(e){ const code = e && e.code; if (["not_granted", "sampling_disabled", "not_declared", "capability_disabled"].includes(code)){ aiOff = true; aiKind = "uitgezet door de kijker"; } return null; }
};

PL.canSay = (() => { try { return "speechSynthesis" in window; } catch(e){ return false; } })();
PL.say = function(text){
  if (!PL.canSay) return;
  try { speechSynthesis.cancel(); const u = new SpeechSynthesisUtterance(text); u.lang = "nl-NL"; u.rate = 0.85;
    const v = speechSynthesis.getVoices().find(v => v.lang && v.lang.toLowerCase().startsWith("nl")); if (v) u.voice = v; speechSynthesis.speak(u); } catch(e){}
};

const AGAIN = ["Nog een keer: zo leer je het echt.", "Goed plan. Elke ronde maakt het steviger.", "Daar gaan we weer. Nieuwe ronde, zelfde training.", "Herhalen is trainen. Net als bij ballet."];

/* ---------- registratie en start ---------- */
const trainings = [];
PL.register = T => { trainings.push(T); };
let store = null, content = null, saving = Promise.resolve();
const CONTENT_KEY = "philearn-content";

PL.boot = async function(){
  const app = $("pl-app");
  app.innerHTML = `<div class="pl-card"><p class="pl-lead">Even laden…</p></div>`;
  [store] = await Promise.all([makeStore(), detectAI()]);
  content = (await store.load(CONTENT_KEY)) || {packs: []};
  const want = (location.hash || "").slice(1);
  const T = trainings.find(t => t.id === want) || (trainings.length === 1 ? trainings[0] : null);
  if (T) PL.start(T); else PL.home();
};

/* ---------- startscherm met alle trainingen ---------- */
PL.home = async function(){
  const app = $("pl-app");
  const states = {};
  for (const T of trainings) states[T.id] = (await store.load("philearn-" + T.id)) || null;
  const dn = dayNum(today());
  const dueCount = T => { const it = (states[T.id] && states[T.id].items) || {}; return Object.keys(it).filter(k => it[k] && it[k].due != null && it[k].due <= dn && it[k].last === "ok").length; };
  const lastPlayed = T => (states[T.id] && states[T.id].lastPlayed) || "";
  // "Vandaag": eerst wat volgens het herhaalschema aan de beurt is, anders de laatst gespeelde training
  const last = trainings.slice().sort((a, b) => dueCount(b) - dueCount(a) || lastPlayed(b).localeCompare(lastPlayed(a)))[0] || trainings[0];
  const sessions = trainings.flatMap(T => (states[T.id] && states[T.id].sessions) || []).sort((a, b) => a.d.localeCompare(b.d)).slice(-24);
  app.innerHTML = `
  <header class="pl-top">
    <button class="pl-logo" id="pl-logo" type="button" aria-label="PhiLearn">${PL.flower(5, {stem: false})}</button>
    <div class="pl-title"><h1>Leeratelier</h1><p class="pl-helps">Trainingen voor Natalia</p></div>
  </header>
  <section class="pl-screen">
    <div class="pl-hero">
      <div class="pl-hero-text"><h2 class="pl-h2">${sessions.length ? "Welkom terug" : "Hoi Natalia"}</h2><p class="pl-lead">Zin in een kwartiertje trainen? We beginnen met iets wat vorige keer lukte.</p></div>
      ${PL.face ? `<img class="pl-hero-img" src="${PL.face}" alt="">` : ""}
    </div>
    <div class="pl-card pl-today">
      <div class="pl-row" style="justify-content:space-between"><span class="pl-eyebrow">Vandaag</span><span class="pl-note">${P.sessionMin} min</span></div>
      <h2 class="pl-h2" style="margin:0">${esc(last.title)}</h2>
      <p class="pl-lead">${dueCount(last) ? "Er staat iets klaar om te herhalen. " : ""}${esc(last.helps)}</p>
      <button class="pl-btn big" type="button" data-start="${esc(last.id)}">Start training</button>
    </div>
    <span class="pl-eyebrow">Mijn trainingen</span>
    <div class="pl-list">${trainings.map(T => `<button type="button" class="pl-listrow" data-start="${esc(T.id)}"><span class="pl-badge" style="background:${T.tint || "#ECE7FC"}">${T.glyph || ""}</span><span class="pl-listtext"><b>${esc(T.title)}</b><span>${esc(T.subject || "")}${states[T.id] && states[T.id].sessions && states[T.id].sessions.length ? " · " + states[T.id].sessions.length + "× getraind" : ""}</span></span><span class="pl-chev"></span></button>`).join("")}</div>
    <button type="button" class="pl-make" id="pl-make"><span class="pl-listtext"><b>Maak zelf een ronde</b><span>Jij kiest wat je traint, hoe, en hoeveel vragen</span></span><span class="pl-plus" aria-hidden="true"></span></button>
    <div class="pl-card" style="display:grid;gap:8px"><span class="pl-eyebrow">Mijn tuin</span><div class="pl-garden">${sessions.length ? sessions.map(s => PL.flower(Math.min(5, s.rounds || 0))).join("") : `<span class="pl-note">Na je eerste ronde groeit hier een bloem.</span>`}</div></div>
  </section>
  <div class="pl-foot" id="pl-foot">PhiLearn ${PL.VERSION}</div>
  <div class="pl-parent" id="pl-parent" hidden></div>`;
  app.querySelectorAll("[data-start]").forEach(b => b.addEventListener("click", () => { location.hash = b.dataset.start; PL.start(trainings.find(t => t.id === b.dataset.start)); }));
  $("pl-make").addEventListener("click", () => {
    if (trainings.length === 1){ PL.start(trainings[0], {make: true}); return; }
    const sec = app.querySelector(".pl-screen");
    sec.innerHTML = `<div class="pl-card" style="display:grid;gap:12px"><h2 class="pl-h2">Maak zelf een ronde</h2><p class="pl-lead">Wat wil je trainen?</p>
      <div class="pl-list">${trainings.map(T => `<button type="button" class="pl-listrow" data-make="${esc(T.id)}"><span class="pl-badge" style="background:${T.tint || "#ECE7FC"}">${T.glyph || ""}</span><span class="pl-listtext"><b>${esc(T.title)}</b><span>${esc(T.subject || "")}</span></span><span class="pl-chev"></span></button>`).join("")}</div></div>
      <div class="pl-row"><button class="pl-btn quiet" id="pl-make-back" type="button">Terug</button></div>`;
    sec.querySelectorAll("[data-make]").forEach(b => b.addEventListener("click", () => { location.hash = b.dataset.make; PL.start(trainings.find(t => t.id === b.dataset.make), {make: true}); }));
    $("pl-make-back").addEventListener("click", () => PL.home());
  });
  wireParent(null, states);
};

/* ---------- één training ---------- */
PL.start = async function(T, opts){
  opts = opts || {};
  const app = $("pl-app");
  app.innerHTML = `
  <header class="pl-top">
    <button class="pl-logo" id="pl-logo" type="button" aria-label="PhiLearn">${PL.flower(5, {stem: false})}</button>
    <div class="pl-title"><h1>${esc(T.title)}</h1><p class="pl-helps">Helpt bij: ${esc(T.helps)}</p></div>
    ${trainings.length > 1 ? `<button class="pl-garden-btn" id="pl-home-btn" type="button">Home</button>` : ""}
    <button class="pl-garden-btn" id="pl-garden-btn" type="button">Laat zien</button>
  </header>
  <section class="pl-screen" id="pl-screen"></section>
  <div class="pl-foot" id="pl-foot">${esc(T.title)} ${esc(T.version)} · PhiLearn ${PL.VERSION}</div>
  <div class="pl-parent" id="pl-parent" hidden></div>`;
  const screen = $("pl-screen");
  const KEY = "philearn-" + T.id;
  const base = {v: 2, stage: 1, items: {}, stones: {}, sessions: [], events: [], forms: {A: {rounds: 0, again: 0}, B: {rounds: 0, again: 0}}, lastForm: "A", cooldown: 0, hold: 0, lastPlayed: ""};
  const data = Object.assign(base, (await store.load(KEY)) || {});
  data.forms = Object.assign({A: {rounds: 0, again: 0}, B: {rounds: 0, again: 0}}, data.forms || {});
  data.stones = data.stones || {}; data.events = data.events || [];
  if (T.loadContent) T.loadContent(content.packs.filter(p => p.training === T.id));
  const S = {d: today(), t0: Date.now(), min: 0, rounds: 0, again: 0, steps: 0, first: 0, items: 0, forms: [], react: {leuk: 0, pittig: 0}};
  let sessionAdded = false, form = data.lastForm || "A", lastRound = null, factShown = false, wheelRun = 0, wheelCount = 0, custom = null;
  let runId = 0, inRound = false;   // een ronde die verlaten wordt, krijgt een nieuw runId; de oude lus stopt dan vanzelf

  function save(){
    S.min = Math.max(1, Math.round((Date.now() - S.t0) / 60000));
    if (!sessionAdded){ data.sessions.push(S); sessionAdded = true; }
    if (data.sessions.length > 200) data.sessions = data.sessions.slice(-200);
    if (data.events.length > P.maxEvents) data.events = data.events.slice(-P.maxEvents);
    data.lastPlayed = new Date().toISOString();
    saving = saving.then(() => store.save(KEY, data)).catch(() => {});
    return saving;
  }
  const log = ev => { data.events.push(Object.assign({t: new Date().toISOString().slice(0, 19), tr: T.id}, ev)); };

  /* --- stenen: beheersing (power) en tempo (speed) per steen --- */
  const stone = id => data.stones[id] || (data.stones[id] = {hist: [], rts: [], power: false, speed: false, n: 0});
  function updateStone(id, first, rt){
    const s = stone(id); s.n++;
    s.hist.push(first ? 1 : 0); if (s.hist.length > P.powerWindow) s.hist.shift();
    if (first && rt != null){ s.rts.push(rt); if (s.rts.length > P.speedWindow) s.rts.shift(); } else if (s.rts.length) s.rts.shift();
    const okCount = s.hist.reduce((a, b) => a + b, 0);
    s.power = s.hist.length >= P.powerWindow && okCount >= P.powerNeed;
    s.speed = s.power && s.rts.length >= P.speedWindow && median(s.rts) <= P.fluentMs;
  }
  const green = id => stone(id).power && stone(id).speed;

  /* --- items: vlotheid en herhaalschema --- */
  const rec = key => data.items[key] || {n: 0, ok1: 0, st: 0, fl: 0, iv: 0, rts: []};
  function updateItem(key, first, step, rt){
    const r = data.items[key] || (data.items[key] = {n: 0, ok1: 0, st: 0, fl: 0, iv: 0, rts: []});
    r.n++; if (first) r.ok1++; if (step) r.st++;
    r.rts = (r.rts || []).concat(rt != null ? [rt] : []).slice(-5);
    const fluent = first && rt != null && rt <= P.fluentMs;
    r.last = first ? "ok" : "step"; r.d = today();
    if (fluent){ r.fl++; r.iv = Math.min(P.review.length - 1, (r.iv || 0) + (r.fl >= 2 ? 1 : 0)); r.due = dayNum(today()) + P.review[r.iv]; }
    else if (!first){ r.fl = 0; r.iv = Math.max(0, (r.iv || 0) - 1); r.due = dayNum(today()) + 1; }
    return fluent;
  }
  const known = key => { const r = data.items[key]; return !!r && r.fl >= 2 && r.last === "ok"; };
  const due = key => { const r = data.items[key]; return !!r && r.due != null && r.due <= dayNum(today()); };

  const ctx = {
    T, data, P, sleep, shuffle, pick, rnd, esc, say: PL.say, canSay: PL.canSay, log,
    get form(){ return form; }, get stage(){ return data.stage; },
    rec, known, due, stone, green,
    // steunniveau van het model: vol (geen beheersing), flits (beheersing, nog geen tempo), opvraag (tempo)
    support(id){ const s = stone(id); return !s.power ? "vol" : !s.speed ? "flits" : "opvraag"; },
    setAsk(lead, main){ $("pl-ask-lead").textContent = lead || ""; $("pl-ask-main").textContent = main || ""; },
    fb: {
      ok(text){ $("pl-fb").innerHTML = `<div class="pl-ok"><b>Gelukt</b>${esc(text)}</div>`; },
      step(text){ $("pl-fb").innerHTML = `<div class="pl-step"><b>Tussenstap</b>${esc(text)}</div>`; },
      note(text){ $("pl-fb").innerHTML = `<p class="pl-note">${esc(text)}</p>`; },
      clear(){ $("pl-fb").innerHTML = ""; }
    }
  };
  PL.ctx = ctx;

  function showStart(){
    screen.innerHTML = `
      <div class="pl-card">
        <h2 class="pl-h2">${data.sessions.length ? "Welkom terug" : "Hallo Natalia"}</h2>
        <p class="pl-lead">${esc(T.startText(ctx))}</p>
        <div class="pl-forms" role="group" aria-label="Kies hoe je traint">
          ${["A", "B"].map(f => `<button type="button" class="pl-form" data-form="${f}" aria-pressed="${f === form}"><b>${esc(T.forms[f].name)}</b><span>${esc(T.forms[f].desc)}</span></button>`).join("")}
        </div>
      </div>
      <div class="pl-row"><button class="pl-btn big" id="pl-go" type="button">Start</button><button class="pl-btn quiet" id="pl-make2" type="button">Zelf samenstellen</button></div>`;
    screen.querySelectorAll(".pl-form").forEach(b => b.addEventListener("click", () => { form = b.dataset.form; screen.querySelectorAll(".pl-form").forEach(x => x.setAttribute("aria-pressed", String(x === b))); }));
    $("pl-go").addEventListener("click", () => { custom = null; playRound(false); });
    $("pl-make2").addEventListener("click", showMake);
  }

  /* --- eigen ronde: Natalia kiest de steen, de vorm en het aantal; de motor kiest de vragen --- */
  function showMake(){
    const sel = custom || {stoneId: T.stones[data.stage - 1].id, form, n: 6};
    screen.innerHTML = `
      <div class="pl-card" style="display:grid;gap:14px">
        <div><h2 class="pl-h2">Maak zelf een ronde</h2><p class="pl-lead">Jij kiest. De vragen komen vanzelf.</p></div>
        <div style="display:grid;gap:8px"><span class="pl-eyebrow">Wat wil je trainen?</span>
          <div class="pl-forms pl-stones" role="group" aria-label="Kies een onderdeel">${T.stones.map((st, i) => { const g = ctx.green(st.id), seen = (data.stones[st.id] || {}).n > 0; const open = i <= data.stage - 1 || (st.requires || []).every(r => ctx.green(r)); const eerst = (st.requires || []).filter(r => !ctx.green(r)).map(r => (T.stones.find(x => x.id === r) || {}).name).filter(Boolean); return `<button type="button" class="pl-form${open ? "" : " locked"}" data-stone="${esc(st.id)}" aria-pressed="${st.id === sel.stoneId}" ${open ? "" : "disabled"}><b>${esc(st.name.charAt(0).toUpperCase() + st.name.slice(1))}</b><span>${g ? "gaat al vanzelf" : seen ? "ben je mee bezig" : open ? "nog nieuw" : "komt na: " + esc(eerst.join(", "))}</span></button>`; }).join("")}</div>
          <p class="pl-note">Als iets vanzelf gaat, komt het volgende stuk vrij.</p></div>
        <div style="display:grid;gap:8px"><span class="pl-eyebrow">Hoe?</span>
          <div class="pl-forms" role="group" aria-label="Kies hoe je traint">${["A", "B"].map(f => `<button type="button" class="pl-form" data-mform="${f}" aria-pressed="${f === sel.form}"><b>${esc(T.forms[f].name)}</b><span>${esc(T.forms[f].desc)}</span></button>`).join("")}</div></div>
        <div style="display:grid;gap:8px"><span class="pl-eyebrow">Hoeveel vragen?</span>
          <div class="pl-row">${[6, 10].map(n => `<button type="button" class="pl-btn quiet" data-n="${n}" aria-pressed="${n === sel.n}">${n} vragen</button>`).join("")}</div></div>
      </div>
      <div class="pl-row pl-sticky"><button class="pl-btn big" id="pl-make-go" type="button">Start mijn ronde</button><button class="pl-btn quiet" id="pl-make-cancel" type="button">Terug</button></div>`;
    const press = (selector, attr, key) => screen.querySelectorAll(selector).forEach(b => b.addEventListener("click", () => { sel[key] = attr === "n" ? +b.dataset[attr] : b.dataset[attr]; screen.querySelectorAll(selector).forEach(x => x.setAttribute("aria-pressed", String(x === b))); }));
    press("[data-stone]:not([disabled])", "stone", "stoneId"); press("[data-mform]", "mform", "form"); press("[data-n]", "n", "n");
    $("pl-make-go").addEventListener("click", () => { custom = sel; form = sel.form; log({make: 1, st: sel.stoneId, f: sel.form, n: sel.n}); playRound(false); });
    $("pl-make-cancel").addEventListener("click", showStart);
  }

  /* --- ronde samenstellen: 2 opwarmers (eerst wat aan herhaling toe is), 4 uit de huidige steen --- */
  function composeRound(){
    const stones = T.stones;
    if (custom){
      const st = stones.find(x => x.id === custom.stoneId) || stones[0];
      const items = []; let guard = 0;
      while (items.length < custom.n && guard++ < 120){ const it = st.gen(ctx, "main"); if (it && !items.some(x => x.key === it.key)) items.push(Object.assign(it, {stone: st.id})); }
      return items;
    }
    if (data.hold > 0) data.hold--;                                                            // na een stapje terug: eerst oefenen, nog niet overslaan
    else while (data.stage < stones.length && green(stones[data.stage - 1].id)) data.stage++;   // stille diagnose
    const cur = stones[data.stage - 1];
    const earlier = stones.slice(0, data.stage - 1);
    const items = [];
    const dueKeys = Object.keys(data.items).filter(k => due(k) && data.items[k].last === "ok");
    for (const k of shuffle(dueKeys).slice(0, P.warm)){ const it = T.fromKey(k, ctx); if (it) items.push(Object.assign(it, {warm: true, stone: T.stoneOf(k, ctx)})); }
    let guard = 0;
    while (items.length < P.warm && guard++ < 30){
      const src = earlier.length ? pick(earlier) : cur;
      const it = src.gen(ctx, "warm"); if (!it) break;
      if (!items.some(x => x.key === it.key)) items.push(Object.assign(it, {warm: true, stone: src.id}));
    }
    guard = 0;
    while (items.length < P.roundSize && guard++ < 60){
      const it = cur.gen(ctx, "main");
      if (it && !items.some(x => x.key === it.key)) items.push(Object.assign(it, {stone: cur.id}));
    }
    return items;
  }

  async function playRound(again){
    const run = ++runId; inRound = true;
    data.lastForm = form;
    screen.innerHTML = `
      <div class="pl-ask" aria-live="polite"><span class="pl-ask-lead" id="pl-ask-lead"></span><span class="pl-ask-main" id="pl-ask-main"></span></div>
      <div class="pl-dots" id="pl-dots" aria-hidden="true"></div>
      <div class="pl-fb" id="pl-fb" aria-live="polite"></div>
      <div id="pl-work"></div>`;
    ctx.work = $("pl-work");
    T.setup(ctx);
    if (again) ctx.fb.note(pick(AGAIN));
    const queue = composeRound();
    const cur = custom ? (T.stones.find(x => x.id === custom.stoneId) || T.stones[0]) : T.stones[data.stage - 1];
    const res = {items: [], first: 0, steps: 0, fluent: 0, stoneId: cur.id, stageAtStart: data.stage};
    const total = queue.length;
    $("pl-dots").innerHTML = queue.map(() => `<span class="pl-dot"></span>`).join("");
    let i = 0;
    while (queue.length){
      const item = queue.shift();
      const dots = $("pl-dots").children;
      for (let k = 0; k < dots.length; k++) dots[k].className = "pl-dot" + (k < i ? " done" : k === i ? " now" : "");
      const t0 = performance.now();
      let r;
      try { r = await T.ask(item, ctx); } catch(e){ if (run !== runId) return; console.error(e); r = {first: false, step: false}; }
      if (run !== runId) return;   // de ronde is verlaten
      const rt = Math.max(0, Math.round(performance.now() - t0 - (r.typingMs || 0)));
      const fluent = updateItem(item.key, r.first, r.step, r.first ? rt : null);
      updateStone(item.stone, r.first, r.first ? rt : null);
      log({k: item.key, st: item.stone, f: form, ok1: r.first ? 1 : 0, step: r.step ? 1 : 0, rt, warm: item.warm ? 1 : 0, sup: r.support || ""});
      res.items.push({label: item.label, first: r.first, step: r.step, item, rt, requeue: !!item.requeue});
      if (!item.requeue){ if (r.first) res.first++; if (r.step) res.steps++; if (fluent) res.fluent++; }
      if (!custom){ wheelRun = r.first ? wheelRun + 1 : 0; wheelCount = wheelRun >= 3 ? 0 : wheelCount + 1; }
      if (!r.first && !item.requeue && queue.length){ queue.splice(Math.min(P.requeueAfter, queue.length), 0, Object.assign({}, item, {requeue: true})); $("pl-dots").insertAdjacentHTML("beforeend", `<span class="pl-dot"></span>`); }
      i++;
      save();
      await sleep(900);
      if (run !== runId) return;
      ctx.fb.clear();
    }
    inRound = false;
    // twee verborgen hefbomen: moeilijkheid (stap) en herhaling (spacing, in updateItem)
    let moved = 0;
    if (custom){ /* een eigen ronde telt mee voor beheersing en tempo, maar schuift de trainingsstap niet */ }
    else if (data.cooldown > 0) data.cooldown--;
    else if (res.first >= P.promoteFirst && green(cur.id) && data.stage < T.stones.length){ data.stage++; moved = 1; data.cooldown = P.cooldownRounds; }
    else if (res.steps >= P.demoteSteps && data.stage > 1){ data.stage--; moved = -1; data.cooldown = P.cooldownRounds; }
    if (!custom && wheelCount >= P.wheel && data.stage > 1 && moved === 0){ data.stage--; moved = -1; data.cooldown = P.cooldownRounds; log({wheel: 1, st: cur.id}); }
    if (moved !== 0){ wheelCount = 0; wheelRun = 0; }
    if (moved < 0) data.hold = P.holdRounds;
    S.rounds++; S.first += res.first; S.steps += res.steps; S.items += total;
    if (!S.forms.includes(form)) S.forms.push(form);
    data.forms[form].rounds++;
    log({round: 1, st: cur.id, f: form, first: res.first, steps: res.steps, fluent: res.fluent, moved, again: again ? 1 : 0, make: custom ? 1 : 0});
    lastRound = {res, moved, again};
    await save();
    showEnd(true);
  }

  function fallbackCheer(res, again){
    const stepItem = res.items.find(x => x.step && !x.requeue);
    let s = stepItem ? `Bij ${stepItem.label} nam je een tussenstap, en daarna vond je het zelf. Zo werkt trainen.` : `Je deed ${res.items.length} ${T.noun} achter elkaar zelf, tot en met ${res.items[res.items.length - 1].label}.`;
    if (res.fluent >= 4 && !stepItem) s = `${res.fluent} ${T.noun} wist je meteen, zonder te hoeven denken. Dat is wat trainen doet.`;
    if (again) s += " En je koos zelf voor nog een keer.";
    return s;
  }
  function showEnd(fresh){
    const {res, moved, again} = lastRound;
    const tooLong = (Date.now() - S.t0) > P.sessionMin * 60000;
    let fact = "";
    if (!factShown && T.aiFact){ factShown = true; fact = `<p class="pl-fact"><b>Weetje over AI.</b> ${esc(T.aiFact)}</p>`; }
    screen.innerHTML = `
      <div class="pl-card" style="display:grid;gap:14px">
        <h2 class="pl-h2">Ronde klaar</h2>
        <div class="pl-cheer" id="pl-cheer" aria-live="polite">${esc(lastRound.cheer || fallbackCheer(res, again))}</div>
        ${moved > 0 ? `<p class="pl-note">De volgende ronde gaat een klein stapje verder.</p>` : ""}
        ${tooLong ? `<p class="pl-note">Je traint al een kwartier. Stoppen is prima, nog een keer ook.</p>` : ""}
        <div class="pl-row" aria-label="Hoe ging het?"><span class="pl-note">Hoe ging het?</span>
          <button class="pl-btn quiet" type="button" data-react="leuk" aria-pressed="${lastRound.reacted === "leuk"}">Leuk</button>
          <button class="pl-btn quiet" type="button" data-react="pittig" aria-pressed="${lastRound.reacted === "pittig"}">Pittig</button></div>
        ${fact}
      </div>
      <div class="pl-row">
        <button class="pl-btn big" id="pl-again" type="button">Nog een keer</button>
        ${custom ? `<button class="pl-btn quiet" id="pl-make3" type="button">Iets anders kiezen</button>` : ""}
        <button class="pl-btn quiet" id="pl-show" type="button">Laat zien</button>
        <button class="pl-btn quiet" id="pl-stop" type="button">Stoppen voor nu</button>
      </div>`;
    screen.querySelectorAll("[data-react]").forEach(b => b.addEventListener("click", () => {
      if (lastRound.reacted) return; lastRound.reacted = b.dataset.react; S.react[b.dataset.react]++; log({react: b.dataset.react, st: res.stoneId, f: form}); save();
      screen.querySelectorAll("[data-react]").forEach(x => { x.disabled = x !== b; x.setAttribute("aria-pressed", String(x === b)); });
    }));
    if (lastRound.reacted) screen.querySelectorAll("[data-react]").forEach(x => { x.disabled = x.dataset.react !== lastRound.reacted; });
    $("pl-again").addEventListener("click", () => { S.again++; data.forms[form].again++; save(); playRound(true); });
    const mk = $("pl-make3"); if (mk) mk.addEventListener("click", showMake);
    $("pl-show").addEventListener("click", () => showGarden(showEnd));
    $("pl-stop").addEventListener("click", showBye);
    $("pl-again").focus();
    if (fresh && !lastRound.cheer){
      const facts = res.items.map(x => `${x.label}: ${x.first ? "zelf in één keer" : "via een tussenstap"}`).join("; ");
      PL.ai(`Je bent het rustige oefenmaatje in PhiLearn, een oefenspel voor een kind. Schrijf één of twee korte zinnen in het Nederlands, direct tegen Natalia.
Regels: benoem concreet iets wat ze in deze ronde deed. Noem geen cijfers, scores, niveaus, groepen of leeftijd. Zeg niet "makkelijk" en niet "slim". Geen emoji. Geen overdreven lof. Een tussenstap nemen is goed; benoem dat zo als het gebeurde.${again ? " Ze koos zelf voor nog een keer; beloon dat kort." : ""}
Training: ${T.title}. Vorm: ${T.forms[form].name}.
Wat er gebeurde: ${facts}.
Antwoord alleen met de zinnen.`).then(t => { if (t){ lastRound.cheer = t; const el = $("pl-cheer"); if (el) el.textContent = t; } });
    }
  }

  function showGarden(back){
    const sess = data.sessions.slice(-24), can = T.canDo(ctx);
    screen.innerHTML = `
      <div class="pl-card" style="display:grid;gap:12px">
        <h2 class="pl-h2">Mijn tuin</h2>
        <p class="pl-lead">Elke bloem is een keer trainen. Elk blaadje is een ronde.</p>
        <div class="pl-garden">${sess.length ? sess.map(s => PL.flower(Math.min(5, s.rounds || 0))).join("") : `<span class="pl-note">Na je eerste ronde groeit hier een bloem.</span>`}</div>
        <div><h3 class="pl-h2" style="font-size:1.2rem">${esc(T.canTitle)}</h3>${can.length ? `<ul class="pl-cando">${can.map(c => `<li>${esc(c)}</li>`).join("")}</ul>` : `<p class="pl-note">Dit lijstje groeit vanzelf als je traint.</p>`}</div>
      </div>
      <div class="pl-row"><button class="pl-btn" id="pl-back" type="button">Terug</button></div>`;
    $("pl-back").addEventListener("click", () => (back ? back(false) : showStart()));
  }
  /* --- een ronde verlaten: eerst vragen, dan de lopende ronde netjes afbreken --- */
  function leaveGuard(go){
    if (!inRound) return go();
    const fb = $("pl-fb"); if (!fb) return go();
    if ($("pl-leave")) return;
    fb.insertAdjacentHTML("beforebegin", `<div class="pl-confirm" id="pl-confirm" role="group" aria-label="Ronde stoppen?"><span>Je zit midden in een ronde.</span><button class="pl-btn" id="pl-stay" type="button">Doorgaan</button><button class="pl-btn quiet" id="pl-leave" type="button">Toch stoppen</button></div>`);
    $("pl-stay").addEventListener("click", () => { const c = $("pl-confirm"); if (c) c.remove(); });
    $("pl-leave").addEventListener("click", () => { runId++; inRound = false; log({leave: 1, st: custom ? custom.stoneId : T.stones[data.stage - 1].id, f: form}); if (T.teardown) T.teardown(ctx); save(); go(); });
    $("pl-stay").focus();
  }
  $("pl-garden-btn").addEventListener("click", () => { const wasIn = inRound; leaveGuard(() => showGarden(wasIn || !lastRound ? showStart : showEnd)); });
  const hb = $("pl-home-btn"); if (hb) hb.addEventListener("click", () => leaveGuard(() => { location.hash = ""; PL.home(); }));

  function showBye(){
    screen.innerHTML = `<div class="pl-card" style="display:grid;gap:12px"><h2 class="pl-h2">Tot de volgende keer</h2>
      <p class="pl-lead">Je bloem van vandaag staat in je tuin. De volgende keer beginnen we met iets wat vandaag lukte.</p>
      <div class="pl-garden">${PL.flower(Math.min(5, S.rounds))}</div></div>
      <div class="pl-row"><button class="pl-btn quiet" id="pl-restart" type="button">Toch nog een ronde</button>${trainings.length > 1 ? `<button class="pl-btn quiet" id="pl-bye-home" type="button">Naar home</button>` : ""}</div>`;
    save();
    $("pl-restart").addEventListener("click", () => playRound(true));
    const h = $("pl-bye-home"); if (h) h.addEventListener("click", () => { location.hash = ""; PL.home(); });
  }

  wireParent(T, null, {data, resetSession(){ if (sessionAdded){ data.sessions = data.sessions.filter(x => x !== S); sessionAdded = false; } }, showStart, setLastRound(v){ lastRound = v; }});
  if (opts.make) showMake(); else showStart();
};

/* ---------- ouderscherm ---------- */
function wireParent(T, states, H){
  let pressT = null; const logo = $("pl-logo");
  logo.addEventListener("pointerdown", () => { clearTimeout(pressT); pressT = setTimeout(openParent, 800); });
  ["pointerup", "pointerleave", "pointercancel"].forEach(ev => logo.addEventListener(ev, () => clearTimeout(pressT)));
  logo.addEventListener("contextmenu", e => e.preventDefault());
  $("pl-foot").addEventListener("dblclick", openParent);
  document.addEventListener("keydown", e => { if (e.key === "Escape" && $("pl-parent") && !$("pl-parent").hidden) $("pl-parent").hidden = true; });

  async function openParent(){
    clearTimeout(pressT);
    const P_ = $("pl-parent");
    const all = T ? {[T.id]: H.data} : states;
    const ids = Object.keys(all).filter(k => all[k]);
    const weekly = PL.weekly(all, trainings);
    const text = PL.weeklyText(weekly);
    const stoneRows = T ? T.stones.map(s => { const st = H.data.stones[s.id] || {}; return `<tr><td>${esc(s.name)}</td><td>${st.power ? "beheerst" : st.n ? "oefent" : "nog niet gezien"}</td><td>${st.speed ? "vlot" : st.power ? "nog niet vlot" : ""}</td><td>${st.n || 0}</td></tr>`; }).join("") : "";
    P_.innerHTML = `<div class="pl-card" role="dialog" aria-label="Ouderscherm" style="display:grid;gap:12px">
      <h2 class="pl-h2">Ouderscherm</h2>
      <p class="pl-note">Alleen voor jou. Patronen, geen conclusies.${T ? ` Trainingsstap nu: ${H.data.stage} van ${T.stones.length} (${esc(T.stones[H.data.stage - 1].name)}).` : ""}</p>
      ${T ? `<div class="pl-table-wrap"><table class="pl-table"><thead><tr><th>Steen</th><th>Beheersing</th><th>Tempo</th><th>Vragen</th></tr></thead><tbody>${stoneRows}</tbody></table></div>` : ""}
      <div class="pl-table-wrap"><table class="pl-table"><thead><tr><th>Week van</th><th>Training</th><th>Sessies</th><th>Min</th><th>Rondes</th><th>Nog een keer</th><th>In één keer</th><th>Vlot</th><th>Tussenstappen</th><th>Mediaan s</th><th>Leuk / pittig</th></tr></thead>
        <tbody>${weekly.rows.length ? weekly.rows.map(w => `<tr><td>${w.week}</td><td>${esc(w.training)}</td><td>${w.sessions}</td><td>${w.min}</td><td>${w.rounds}</td><td>${w.again}</td><td>${w.first}/${w.items}</td><td>${w.fluent}</td><td>${w.steps}</td><td>${w.medianRt != null ? (w.medianRt / 1000).toFixed(1) : ""}</td><td>${w.leuk} / ${w.pittig}</td></tr>`).join("") : `<tr><td colspan="11">Nog geen sessies.</td></tr>`}</tbody></table></div>
      <p class="pl-note"><b>Per vorm:</b> ${esc(weekly.formsText || "nog niets")}</p>
      <p class="pl-note"><b>Vaakst een tussenstap:</b> ${esc(weekly.hardText || "nog niets")}</p>
      <p class="pl-note"><b>Techniek:</b> opslag = ${esc(store.kind)}; Claude = ${esc(aiKind)}; materiaalpakketten = ${content.packs.length}${content.packs.length ? " (" + content.packs.map(p => p.name).join(", ") + ")" : ""}.</p>
      <h3 class="pl-h3">Weekoverzicht (voor de chat met Claude)</h3>
      <pre id="pl-sum">${esc(text)}</pre>
      <div class="pl-row"><button class="pl-btn" id="pl-copy" type="button">Kopieer weekoverzicht</button><button class="pl-btn quiet" id="pl-copy-log" type="button">Kopieer logboek (JSONL)</button><span class="pl-note" id="pl-copied" aria-live="polite"></span></div>
      <h3 class="pl-h3">Stand bewaren, terugzetten en materiaal toevoegen</h3>
      <p class="pl-note">${store.persist ? "Deze omgeving bewaart de stand zelf. Een kopie in GitHub (map stand/) kan altijd." : "Deze omgeving onthoudt niets tussen sessies. Kopieer na het trainen de stand, bewaar hem in GitHub (map stand/) en zet hem de volgende keer hier terug."}</p>
      <div class="pl-row"><button class="pl-btn quiet" id="pl-export" type="button">Kopieer stand</button><span class="pl-note" id="pl-exported" aria-live="polite"></span></div>
      <label class="pl-note" for="pl-import">Plak hier een bewaarde stand of een materiaalpakket (JSON uit content/)</label>
      <textarea id="pl-import" spellcheck="false"></textarea>
      <div class="pl-row"><button class="pl-btn quiet" id="pl-import-btn" type="button">Verwerk</button><span class="pl-note" id="pl-imported" aria-live="polite"></span></div>
      <div class="pl-row"><button class="pl-btn quiet" id="pl-close" type="button">Sluiten</button></div>
    </div>`;
    P_.hidden = false;
    const copy = (t, okEl, label) => { const done = () => { $(okEl).textContent = label + " gekopieerd."; }; const fb = () => { $("pl-import").value = t; $("pl-import").select(); $(okEl).textContent = "Staat in het vak hieronder, geselecteerd. Kopieer met Ctrl+C of Cmd+C."; }; try { navigator.clipboard.writeText(t).then(done, fb); } catch(e){ fb(); } };
    $("pl-close").addEventListener("click", () => { P_.hidden = true; });
    $("pl-copy").addEventListener("click", () => copy(text, "pl-copied", "Weekoverzicht"));
    $("pl-copy-log").addEventListener("click", () => copy(ids.flatMap(id => (all[id].events || []).map(e => JSON.stringify(e))).join("\n"), "pl-copied", "Logboek"));
    $("pl-export").addEventListener("click", () => copy(`PHILEARN-STAND v2\n` + JSON.stringify({trainings: all, content}), "pl-exported", "Stand"));
    $("pl-import-btn").addEventListener("click", async () => {
      const raw = $("pl-import").value.trim(); const out = $("pl-imported");
      const m = raw.match(/^PHILEARN-STAND(?: (\S+))? v([12])\s*([\s\S]+)$/);
      if (m){
        let obj; try { obj = JSON.parse(m[3]); } catch(e){ out.textContent = "De stand is niet compleet gekopieerd."; return; }
        if (m[2] === "1"){ const id = m[1]; if (!id || !trainings.find(t => t.id === id)){ out.textContent = `Onbekende training in deze stand: ${id || "?"}.`; return; } delete obj.explanations; obj.v = 2; obj.stones = obj.stones || {}; obj.events = obj.events || []; obj = {trainings: {[id]: obj}}; }
        for (const id of Object.keys(obj.trainings || {})){
          if (!obj.trainings[id]) continue;
          if (T && id === T.id){ H.resetSession(); for (const k of Object.keys(H.data)) delete H.data[k]; Object.assign(H.data, obj.trainings[id]); H.data.forms = Object.assign({A: {rounds: 0, again: 0}, B: {rounds: 0, again: 0}}, H.data.forms || {}); saving = saving.then(() => store.save("philearn-" + id, H.data)); }
          else await store.save("philearn-" + id, obj.trainings[id]);
        }
        if (obj.content){ content = obj.content; await store.save(CONTENT_KEY, content); }
        if (T) H.setLastRound(null);
        out.textContent = `Stand teruggezet voor: ${Object.keys(obj.trainings || {}).join(", ")}.`;
        setTimeout(() => { P_.hidden = true; T ? H.showStart() : PL.home(); }, 900);
        return;
      }
      let obj; try { obj = JSON.parse(raw); } catch(e){ out.textContent = "Dit is geen stand en geen pakket. Een pakket is JSON met \"training\" en \"items\"."; return; }
      if (obj.training && Array.isArray(obj.items)){
        const tr = trainings.find(t => t.id === obj.training);
        if (!tr){ out.textContent = `Onbekende training: ${obj.training}.`; return; }
        const check = tr.checkPack ? tr.checkPack(obj) : {ok: obj.items.length, bad: []};
        const name = obj.name || ("pakket-" + today());
        content.packs = content.packs.filter(p => p.name !== name).concat([{name, training: obj.training, items: obj.items, added: today()}]);
        await store.save(CONTENT_KEY, content);
        if (T && T.id === obj.training && T.loadContent) T.loadContent(content.packs.filter(p => p.training === T.id));
        out.textContent = `Pakket "${name}" toegevoegd: ${check.ok} items${check.bad.length ? `, ${check.bad.length} overgeslagen (${check.bad.slice(0, 3).join(", ")})` : ""}.`;
        return;
      }
      out.textContent = "Dit is geen stand en geen pakket. Een pakket is JSON met \"training\" en \"items\".";
    });
    $("pl-close").focus();
  }
}

/* ---------- weekoverzicht: het enige dat naar de chat gaat ---------- */
PL.weekly = function(all, trainingsList){
  const rows = [], byForm = {}, hard = {};
  for (const id of Object.keys(all)){
    const d = all[id]; if (!d) continue;
    const T = trainingsList.find(t => t.id === id); const name = T ? T.title : id;
    const weeks = {};
    for (const s of d.sessions || []){
      const w = weeks[weekKey(s.d)] || (weeks[weekKey(s.d)] = {week: weekKey(s.d), training: name, sessions: 0, min: 0, rounds: 0, again: 0, steps: 0, first: 0, items: 0, fluent: 0, leuk: 0, pittig: 0, rts: []});
      w.sessions++; w.min += s.min || 0; w.rounds += s.rounds || 0; w.again += s.again || 0; w.steps += s.steps || 0; w.first += s.first || 0; w.items += s.items || 0;
      w.leuk += (s.react && s.react.leuk) || 0; w.pittig += (s.react && s.react.pittig) || 0;
    }
    for (const e of d.events || []){
      if (e.k == null) continue;
      const w = weeks[weekKey(e.t.slice(0, 10))]; if (!w) continue;
      if (e.ok1 && e.rt != null){ w.rts.push(e.rt); if (e.rt <= P.fluentMs) w.fluent++; }
      const fk = name + " / vorm " + e.f; const f = byForm[fk] || (byForm[fk] = {n: 0, ok: 0, rts: []});
      f.n++; if (e.ok1){ f.ok++; f.rts.push(e.rt); }
    }
    for (const w of Object.values(weeks)){ w.medianRt = median(w.rts); delete w.rts; rows.push(w); }
    for (const [k, r] of Object.entries(d.items || {})) if (r.st > 0) hard[name + ": " + (T && T.keyLabel ? T.keyLabel(k) : k)] = r;
  }
  rows.sort((a, b) => b.week.localeCompare(a.week) || a.training.localeCompare(b.training));
  const formsText = Object.entries(byForm).map(([k, f]) => `${k}: ${f.n} vragen, ${Math.round(100 * f.ok / Math.max(1, f.n))}% in één keer, mediaan ${f.rts.length ? (median(f.rts) / 1000).toFixed(1) : "-"} s`).join("; ");
  const hardText = Object.entries(hard).sort((a, b) => b[1].st - a[1].st).slice(0, 8).map(([k, r]) => `${k} (${r.st}x tussenstap, ${r.ok1}x in één keer)`).join("; ");
  return {rows, formsText, hardText, byForm};
};
PL.weeklyText = function(w){
  return [`PhiLearn weekoverzicht (${today()})`,
    ...w.rows.map(r => `Week van ${r.week}, ${r.training}: ${r.sessions} sessies, ${r.min} min, ${r.rounds} rondes, ${r.again}x nog een keer, ${r.first}/${r.items} in één keer, ${r.fluent} vlot (binnen 3 s), ${r.steps} tussenstappen, mediaan ${r.medianRt != null ? (r.medianRt / 1000).toFixed(1) : "-"} s, reactie leuk ${r.leuk} / pittig ${r.pittig}`),
    `Per vorm: ${w.formsText || "nog niets"}`,
    `Vaakst een tussenstap: ${w.hardText || "nog niets"}`,
    `Regels voor de lezer: alleen patronen over meerdere weken benoemen; geen niveau, groep, cijfer of leeftijd; technische problemen apart van observaties.`].join("\n");
};

window.addEventListener("DOMContentLoaded", () => { if (window.__plFace) PL.face = window.__plFace; PL.boot(); });
})();

</script>
<script>
/* Training: De rekenmuur v0.4 — elf stenen, elk met een generator (oneindig materiaal)
   D1 splitsen en samen 10 · D2 sprongen van 10 tot 100 · D3 brug over 10 · D4 brug over een tiental tot 100 · D5a tafels 1-5 en 10 · D5b tafels 6-9 */
(function(){
const MIN = "−";
const {rnd, pick} = PL;

/* ---------- items: key ↔ som ---------- */
// key: "<type>:<a>:<b>"  types: m (a+?=10), s (n=a+?), g (a+b over 10), t (c-b terug over 10), j (sprong +/-10-tallen), h (brug tot 100 +), k (brug tot 100 -), x (keer), d (deel)
const key = it => `${it.type}:${it.a}:${it.b}`;
function fromKey(k){ const [type, a, b] = k.split(":"); return mk(type, +a, +b); }
function mk(type, a, b, swap){
  // bij keer-sommen is a altijd de tafel (sleutel x:<tafel>:<n>); swap toont de som als n × tafel
  const it = {type, a, b};
  switch (type){
    case "m": it.ans = 10 - a; it.eq = `${a} + ? = 10`; it.label = `${a} + ? = 10`; break;
    case "s": it.ans = a - b; it.eq = `${a} = ${b} + ?`; it.label = `${a} = ${b} + ?`; break;
    case "g": it.ans = a + b; it.eq = `${a} + ${b} = ?`; it.label = `${a} + ${b}`; break;
    case "t": it.ans = a - b; it.eq = `${a} ${MIN} ${b} = ?`; it.label = `${a} ${MIN} ${b}`; break;
    case "j": it.ans = a + b; it.eq = b >= 0 ? `${a} + ${b} = ?` : `${a} ${MIN} ${-b} = ?`; it.label = b >= 0 ? `${a} + ${b}` : `${a} ${MIN} ${-b}`; break;
    case "h": it.ans = a + b; it.eq = `${a} + ${b} = ?`; it.label = `${a} + ${b}`; break;
    case "k": it.ans = a - b; it.eq = `${a} ${MIN} ${b} = ?`; it.label = `${a} ${MIN} ${b}`; break;
    case "x": it.ans = a * b; it.eq = swap ? `${b} × ${a} = ?` : `${a} × ${b} = ?`; it.label = it.eq.replace(" = ?", ""); break;
    case "d": it.ans = a / b; it.eq = `${a} : ${b} = ?`; it.label = `${a} : ${b}`; break;
    case "H": it.ans = a + b; it.eq = b >= 0 ? `${a} + ${b} = ?` : `${a} ${MIN} ${-b} = ?`; it.label = it.eq.replace(" = ?", ""); break;                       // sprongen over een honderdtal
    case "c": it.ans = dec(a + b); it.eq = b >= 0 ? `${dec(a)} + ${dec(b)} = ?` : `${dec(a)} ${MIN} ${dec(-b)} = ?`; it.label = it.eq.replace(" = ?", ""); break;   // tienden over de 1 (a, b in tienden)
    case "p": it.ans = a * b / 100; it.eq = `${a}% van ${b} = ?`; it.label = it.eq.replace(" = ?", ""); break;
    case "b": { const n = Math.floor(a / 100), teller = a % 100; it.ans = b / n * teller; it.eq = `${teller}/${n} van ${b} = ?`; it.label = it.eq.replace(" = ?", ""); break; }  // a = teller + 100·noemer
    case "v": { const [x, y, z] = [Math.floor(a / 100), a % 100, b]; const vorm = z >= 1000 ? 2 : z >= 500 ? 1 : 0; const c = z % 500 % 1000; it.v = [x, y, c, vorm];
      if (vorm === 0){ it.ans = x + y * c; it.eq = `${x} + ${y} × ${c} = ?`; } else if (vorm === 1){ it.ans = (x + y) * c; it.eq = `(${x} + ${y}) × ${c} = ?`; } else { it.ans = x * y - c; it.eq = `${x} × ${y} ${MIN} ${c} = ?`; }
      it.label = it.eq.replace(" = ?", ""); break; }
  }
  it.key = key(it);
  return it;
}
const dec = t => (t < 0 ? "-" : "") + Math.floor(Math.abs(t) / 10) + "," + Math.abs(t) % 10;    // tienden → "1,3"
const norm = v => String(v).trim().replace(".", ",").replace(/^(\d+),0$/, "$1");
const fact = it => it.eq.replace("?", String(it.ans)).replace(" = ?", "");
const STONE_OF = {m: "D1", s: "D1", j: "D2", g: "D3", t: "D3", h: "D4", k: "D4", x: "D5", d: "D5", H: "D6", c: "D7", p: "D8", b: "D9", v: "D10"};
function stoneOf(k){ const it = fromKey(k); if (it.type === "x") return it.a >= 6 && it.a <= 9 ? "D5b" : "D5a"; if (it.type === "d") return it.b >= 6 && it.b <= 9 ? "D5b" : "D5a"; return STONE_OF[it.type]; }

/* ---------- generatoren: kiezen bij voorkeur wat nog niet vlot is ---------- */
function choose(ctx, cands){
  // laagste score eerst: onbekend of met tussenstap vóór bekend; wat aan herhaling toe is, altijd eerst
  const score = it => { const r = ctx.rec(it.key); return (ctx.due(it.key) ? -20 : 0) + (ctx.known(it.key) ? 10 : 0) + (r.st > 0 && r.last === "step" ? -5 : 0) + Math.random() * 6; };
  return cands.map(it => [score(it), it]).sort((a, b) => a[0] - b[0])[0][1];
}
const STONES = [
  {id: "D1", name: "splitsen en samen 10", short: "Samen 10", gen(ctx){
    const c = []; for (let a = 1; a <= 9; a++) c.push(mk("m", a, 0)); for (let n = 3; n <= 9; n++) for (let a = 1; a < n; a++) c.push(mk("s", n, a)); return choose(ctx, c); }},
  {id: "D2", name: "sprongen van 10 tot 100", short: "Sprongen", gen(ctx){
    const c = []; for (let i = 0; i < 14; i++){ const a = rnd(11, 89), plus = Math.random() < .6; const step = 10 * rnd(1, 4); if (plus && a + step <= 100) c.push(mk("j", a, step)); else if (!plus && a - step >= 0) c.push(mk("j", a, -step)); } return c.length ? choose(ctx, c) : mk("j", 34, 10); }},
  {id: "D3", name: "de brug over 10", short: "Brug over 10", gen(ctx){
    const c = []; for (let a = 6; a <= 9; a++) for (let b = 2; b <= 9; b++) if (a + b > 10) c.push(mk("g", a, b)); for (let s = 11; s <= 18; s++) for (let b = 2; b <= 9; b++) if (s - b < 10 && s - b >= 1) c.push(mk("t", s, b)); return choose(ctx, c); }},
  {id: "D4", name: "de brug over een tiental tot 100", short: "Brug tot 100", gen(ctx){
    const c = []; for (let i = 0; i < 14; i++){ if (Math.random() < .55){ const a = rnd(12, 88); const u = a % 10; const b = rnd(10 - u + 1, 9); if (b >= 2 && b <= 9 && a + b <= 100 && u > 0) c.push(mk("h", a, b)); } else { const a = rnd(21, 99); const u = a % 10; const b = rnd(u + 1, 9); if (u < 9 && b >= 2 && a - b >= 1) c.push(mk("k", a, b)); } } return c.length ? choose(ctx, c) : mk("h", 57, 8); }},
  {id: "D5a", name: "tafels van 1 tot 5 en 10", short: "Tafels 1-5, 10", gen(ctx){
    const c = []; for (const t of [2, 3, 4, 5, 10]) for (let n = 1; n <= 10; n++){ c.push(mk("x", t, n, Math.random() < .5)); c.push(mk("d", t * n, t)); } return choose(ctx, c); }},
