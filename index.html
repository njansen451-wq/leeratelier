/* ---------- drie uitlegvormen voor de tussenstap ----------
   rooster: de rijen stippen, met de bekende rijen gekleurd; sprongen: tel in sprongen van de tafel; woorden: de som in stukjes,
   zonder plaatje. Het rekenen is in elke vorm hetzelfde (uit code); alleen de weg ernaartoe verschilt. */
const MODES = ["rooster", "sprongen", "woorden"];
const MODE_NAMES = {rooster: "het rooster", sprongen: "de sprongen", woorden: "de som in stukjes"};
/* het plan voor Kaarten: per tafel een strategie in deelsommen; per vorm wat je ziet en wat je hoort */
function plan(it, mode){
  const t = it.t, n = it.n, S = STRAT[t] || {kind: "dubbel"};
  const hop = {say: n > 1 ? `${t} × ${n} is ${n} sprongen van ${t}. De sprongen tot ${(n - 1) * t} staan er al; nog één erbij.` : `${t} × 1 is één sprong van ${t}.`, model: jumps(t, n - 1, true),
    steps: [{eq: `${(n - 1) * t} + ${t} = ?`, ans: t * n, help: () => `Van ${(n - 1) * t} nog ${t} erbij.`}]};
  if (mode === "sprongen") return hop;
  if (it.omkeer) return {say: mode === "rooster" ? `${t} × ${n} is hetzelfde als ${n} × ${t}. Draai het rooster maar om.` : `${t} × ${n} is hetzelfde als ${n} × ${t}. Die kleine tafel ken je al.`,
    model: mode === "rooster" ? rooster(t, n) : chain([`${t} × ${n}`, `= ${n} × ${t}`]), turn: mode === "rooster" ? rooster(n, t) : null,
    steps: [{eq: `${n} × ${t} = ?`, ans: it.ans, help: () => `Tel de rijen van ${t}: ${range(1, n).map(i => i * t).join(", ")}.`}]};
  const rowsOf = (a, b, extra) => { const r = {}; range(1, a).forEach(i => r[i] = "a"); range(a + 1, b).forEach(i => r[i] = extra); return r; };
  const K = S.kind, o = S.of;
  const P_ = {
    dubbel: {say: [`2 × ${n} is ${n} en nog eens ${n}.`, `2 × ${n} is ${n} + ${n}.`], rows: {1: "a", 2: "b"}, r: 2, parts: [`2 × ${n}`, `= ${n} + ${n}`],
      steps: [{eq: `${n} + ${n} = ?`, ans: 2 * n, help: () => `${n} erbij ${n}. Tel de twee rijen.`}]},
    tien: {say: [`10 × ${n}: dat zijn ${n} tientallen.`, `10 × ${n} is ${n} tientallen.`], rows: {}, r: 10, parts: [`10 × ${n}`, `= ${n} tientallen`],
      steps: [{eq: `${n} tientallen = ?`, ans: 10 * n, help: () => `${n} tientallen is ${n} met een 0 erachter.`}]},
    helft10: {say: [`5 × ${n} is de helft van 10 × ${n}.`, `5 × ${n} is de helft van 10 × ${n}. Eerst 10 × ${n}, dan de helft.`], rows: rowsOf(5, 10, "x"), r: 10, parts: [`5 × ${n}`, `= 10 × ${n} : 2`],
      steps: [{eq: `10 × ${n} = ?`, ans: 10 * n, help: () => `${n} tientallen.`}, {eq: `${10 * n} : 2 = ?`, ans: 5 * n, help: () => mode === "rooster" ? `De helft van ${10 * n}. Kijk naar de paarse rijen.` : `De helft van ${10 * n}.`}]},
    dubbelvan: {say: [`${t} × ${n} is het dubbele van ${o} × ${n}.`, `${t} × ${n} is twee keer ${o} × ${n}.`], rows: rowsOf(o, t, "b"), r: t, parts: [`${t} × ${n}`, `= ${o} × ${n}`, `+ ${o} × ${n}`],
      steps: [{eq: `${o} × ${n} = ?`, ans: o * n, help: () => mode === "rooster" ? `Kijk naar de paarse rijen: ${o} rijen van ${n}.` : `${o} keer ${n}.`}, {eq: `2 × ${o * n} = ?`, ans: t * n, help: () => `${o * n} en nog eens ${o * n}.`}]},
    eenmeer: {say: [`${t} × ${n} is ${o} × ${n} en nog één rij van ${n}.`, `${t} × ${n} is ${o} × ${n} + ${n}.`], rows: Object.assign(rowsOf(o, o, ""), {[t]: "b"}), r: t, parts: [`${t} × ${n}`, `= ${o} × ${n}`, `+ ${n}`],
      steps: [{eq: `${o} × ${n} = ?`, ans: o * n, help: () => mode === "rooster" ? `De paarse rijen: ${o} rijen van ${n}.` : `${o} keer ${n}.`}, {eq: `${o * n} + ${n} = ?`, ans: t * n, help: () => `Nog één keer ${n} erbij.`}]},
    eenminder: {say: [`9 × ${n} is 10 × ${n} min één rij van ${n}.`, `9 × ${n} is 10 × ${n} ${MIN} ${n}.`], rows: rowsOf(9, 10, "x"), r: 10, parts: [`9 × ${n}`, `= 10 × ${n}`, `${MIN} ${n}`],
      steps: [{eq: `10 × ${n} = ?`, ans: 10 * n, help: () => `${n} tientallen.`}, {eq: `${10 * n} ${MIN} ${n} = ?`, ans: 9 * n, help: () => mode === "rooster" ? `Haal de open rij van ${n} eraf.` : `Haal ${n} eraf.`}]},
    splits: {say: [`7 × ${n} is 5 × ${n} en 2 × ${n}.`, `7 × ${n} is 5 × ${n} + 2 × ${n}.`], rows: rowsOf(5, 7, "b"), r: 7, parts: [`7 × ${n}`, `= 5 × ${n}`, `+ 2 × ${n}`],
      steps: [{eq: `5 × ${n} = ?`, ans: 5 * n, help: () => mode === "rooster" ? `De paarse rijen: 5 rijen van ${n}.` : `De helft van 10 × ${n}.`}, {eq: `2 × ${n} = ?`, ans: 2 * n, help: () => mode === "rooster" ? `De lila rijen: ${n} en ${n}.` : `${n} en ${n}.`}, {eq: `${5 * n} + ${2 * n} = ?`, ans: 7 * n, help: () => mode === "rooster" ? `Paars en lila samen.` : `Tel de twee stukjes op.`}]}
  }[K];
  if (n === 1 && K !== "tien") return hop;
  return {say: mode === "rooster" ? P_.say[0] : P_.say[1], model: mode === "rooster" ? rooster(P_.r, n, P_.rows) : chain(P_.parts), steps: P_.steps};
}
/* Kaarten: de strategie als tussenstap, in de gekozen vorm. Geeft {mode, switches}. */
async function strategie(ctx, it){
  let mode = ctx.explainMode(it.stone), switches = 0;
  const anders = document.getElementById("tf-anders");
  while (true){
    const p = plan(it, mode);
    ctx.fb.step(p.say); show(p.model); anders.hidden = false;
    let switched = false;
    anders.onclick = () => { switched = true; switches++; mode = ctx.explainSwitch(it.stone, mode); cancelRead(); };
    try {
      if (p.turn){ await sleep(900); const r = document.querySelector(".tf-rooster"); if (r) r.classList.add("draai"); await sleep(900); if (!switched) show(p.turn); }
      for (const s of p.steps){
        if (switched) throw SWITCH;
        await solve(ctx, s.eq, s.ans, async () => ctx.fb.step(s.help()));
        ctx.fb.clear();
      }
      anders.hidden = true; anders.onclick = null; hero("", "");
      return {mode, switches};
    } catch(e){
      if (e !== SWITCH) throw e;
      ctx.fb.clear(); continue;            // opnieuw met de nieuwe vorm
    }
  }
}

function np(role, pool, opts){  // naamwoordgroep: lidwoord (+ bn) + zn, of voornaamwoord, of telwoord + meervoud
  opts = opts || {};
  const n = pick(pool);
  const kind = opts.kind || pick(["lw", "lw", "lw", "bn", "bn", "bez", "aanw", "tw"]);
  if (kind === "pron" || (opts.pron && Math.random() < .5)){ const p = pick(opts.subject ? PVNW : [["hem","3"],["haar","3"],["ons","p"]]); return {toks: [tok(p[0], "vnw", role)], num: p[1] === "p" ? "pl" : "sg", pers: p[1], head: p[0]}; }
  if (kind === "tw"){ const t = pick(TW); return {toks: [tok(t[0], "tw", role), tok(n[2], "zn", role)], num: "pl", pers: "3", head: n[2]}; }
  if (kind === "bez"){ return {toks: [tok(pick(BVNW), "vnw", role), tok(n[1], "zn", role)], num: "sg", pers: "3", head: n[1]}; }
  if (kind === "aanw"){ const a = n[0] === "het" ? pick(["dit", "dat"]) : pick(["deze", "die"]); return {toks: [tok(a, "vnw", role), tok(n[1], "zn", role)], num: "sg", pers: "3", head: n[1]}; }
  const lw = opts.indef ? "een" : n[0];
  const toks = [tok(lw, "lw", role)]; if (kind === "bn"){ const b = pick(pool === PERS ? BN_P : BN_D); toks.push(tok(lw === "een" && n[0] === "het" ? b[0] : b[1], "bn", role)); } toks.push(tok(n[1], "zn", role));
  return {toks, num: "sg", pers: "3", head: n[1]};
}
function bwb(kind, tense){
  kind = kind || pick(["tijd", "plek", "hoe"]);
  if (kind === "tijd"){ const t = pick(TIJD[tense || "tt"]); return t === "elke dag" ? [tokx("elke", "vnw", "BWB"), tokx("dag", "zn", "BWB")] : [tokx(t, "zn", "BWB")]; }
  if (kind === "plek"){ const p = pick(PLEK); return [tok(pick(p[3]), "vz", "BWB"), tok(p[0], "lw", "BWB"), tok(p[1], "zn", "BWB")]; }
  return [tokx(pick(HOE), "bn", "BWB")];   // bijwoord; in groep 8 wordt 'snel' bij de bijvoeglijke naamwoorden/bijwoorden gerekend; we vragen er nooit de woordsoort van
}
function pvForm(v, num, tense, pers){ if (tense === "vt") return num === "pl" ? v[4] : v[3]; if (num === "pl") return v[2]; return pers === "1" ? v[7] : v[1]; }
function sentence(opts){
  opts = opts || {};
  const tense = opts.tense || pick(["tt", "tt", "vt"]);
  const vpool = opts.vsoort ? WW.filter(v => v[6] === opts.vsoort) : WW;
  const v = pick(vpool);
  const S = np("O", PERS, {subject: true, pron: opts.pron, kind: opts.skind});
  const parts = [];
  const pv = pvForm(v, S.num, tense, S.pers);
  const pvToks = pv.split(" ").map((w, i) => tok(w, "ww", i === 0 ? "PV" : "WG"));
  let obj = null, mv = null;
  const opool = (OBJ[v[0]] || []).map(byName).filter(Boolean);
  if (v[6] === "t") obj = np("LV", opool, {indef: Math.random() < .4, kind: opts.okind});
  if (v[6] === "m"){ mv = np("MV", PERS, {kind: pick(["lw", "bez", "aanw"])}); obj = np("LV", opool, {indef: true, kind: "lw"}); }
  const bw = opts.bwb === false ? [] : bwb(opts.bwbKind, tense);
  const front = opts.front != null ? opts.front : (bw.length && bw[0].d === "BWB" && bw[0].s !== "bn" && Math.random() < .35);
  // volgorde: [BWB] PV O ... | O PV ...
  if (front && bw.length){ parts.push(...bw, ...pvToks.slice(0, 1), ...S.toks); }
  else parts.push(...S.toks, ...pvToks.slice(0, 1));
  if (mv) parts.push(...mv.toks);
  if (obj) parts.push(...obj.toks);
  if (!front && bw.length) parts.push(...bw);
  if (pvToks.length > 1) parts.push(...pvToks.slice(1));
  return {toks: parts, v, S, obj, mv, tense, num: S.num};
}
function render(toks){ return toks.map((t, i) => i === 0 ? cap(t.w) : t.w).join(" ") + "."; }
function withBijzin(){
  const hz = sentence({vsoort: "i", bwb: false, front: false, pron: false});
  const bz = sentence({bwb: false, front: false, pron: false});
  // bijzin: voegwoord + onderwerp + (voorwerpen) + werkwoord(en) achteraan
  const vw = tok(pick(VGW_BIJ), "vw", null);
  const bzToks = [vw, ...bz.S.toks];
  if (bz.mv) bzToks.push(...bz.mv.toks); if (bz.obj) bzToks.push(...bz.obj.toks);
  const pvs = pvForm(bz.v, bz.num, bz.tense, bz.S.pers).split(" ");
  bzToks.push(...pvs.map((w, i) => tok(w, "ww", i === 0 ? "PV" : "WG")));
  const toks = hz.toks.map(t => Object.assign({}, t, {z: "hz"})).concat(bzToks.map(t => Object.assign({}, t, {z: "bz"})));
  return {toks, hz, bz, vw: vw.w};
}
function withNevens(){
  const tense = pick(["tt", "vt"]); const a = sentence({vsoort: "i", bwb: false, front: false, tense}), b = sentence({vsoort: "i", bwb: false, front: false, tense});
  const vw = tok(pick(VGW_NEV), "vw", null);
  return {toks: a.toks.map(t => Object.assign({}, t, {z: "hz"})).concat([Object.assign({}, vw, {z: "vw"})], b.toks.map(t => Object.assign({}, t, {z: "hz2"})))};
}
function lijdend(){  // bedrijvend: O pv LV → lijdend: LV wordt door O vd
  const s = sentence({vsoort: "t", bwb: false, front: false, pron: false, okind: "lw", skind: "lw"});
  const bedr = render(s.toks);
  const hulp = s.tense === "vt" ? (s.obj.num === "pl" ? "werden" : "werd") : (s.obj.num === "pl" ? "worden" : "wordt");
  const lijd = cap(s.obj.toks.map(t => t.w).join(" ")) + ` ${hulp} door ` + s.S.toks.map(t => t.w).join(" ") + ` ${s.v[5]}.`;
  return {bedr, lijd, s};
}

}

const T = {

  const f = {...vb}, t0 = performance.now();
  const step = now => { let k = Math.min(1, (now - t0) / 600); k = k < .5 ? 2 * k * k : 1 - Math.pow(-2 * k + 2, 2) / 2;
    setVB({x: f.x + (t.x - f.x) * k, y: f.y + (t.y - f.y) * k, w: f.w + (t.w - f.w) * k, h: f.h + (t.h - f.h) * k}); if (k < 1) requestAnimationFrame(step); };
  requestAnimationFrame(step);
}
function boxFor(ids, minW){
  let x0 = Infinity, y0 = Infinity, x1 = -Infinity, y1 = -Infinity;
  for (const id of ids){ const b = C[id].b; x0 = Math.min(x0, b[0]); y0 = Math.min(y0, b[1]); x1 = Math.max(x1, b[2]); y1 = Math.max(y1, b[3]); }
  x0 = Math.max(x0, 0); y0 = Math.max(y0, 0); x1 = Math.min(x1, G.W); y1 = Math.min(y1, G.H);
  let w = x1 - x0, h = y1 - y0; minW = minW || 260;
  if (w < minW){ x0 -= (minW - w) / 2; w = minW; } if (h < minW * .7){ y0 -= (minW * .7 - h) / 2; h = minW * .7; }
  // houd de verhouding van het kaartvlak aan, zodat er niets wegvalt
  const ar = G.W / G.H; if (w / h < ar){ const nw = h * ar; x0 -= (nw - w) / 2; w = nw; } else { const nh = w / ar; y0 -= (nh - h) / 2; h = nh; }
  const p = .12; return {x: x0 - w * p, y: y0 - h * p, w: w * (1 + 2 * p), h: h * (1 + 2 * p)};
}
function cls(id, name, on){ C[id].el.classList.toggle(name, on); if (C[id].dot) C[id].dot.classList.toggle(name, on); }
function label(id, kind){
  const t = document.createElementNS(NS, "text");
  t.setAttribute("class", "eu-lbl" + (kind ? " " + kind : ""));
  t.setAttribute("x", C[id].c[0]); t.setAttribute("y", C[id].c[1] - (C[id].dot ? Math.max(vb.w, vb.h) / 34 : 0));
  t.setAttribute("font-size", Math.max(vb.w, vb.h) / 40); t.textContent = nl(id);
  svg.querySelector("#eu-labels").appendChild(t); return t;
}
const waitClick = () => new Promise(res => { clickFn = id => { clickFn = null; res(id); }; });
function bestBuur(ctx, id, not){
  return (C[id].n || []).filter(n => C[n] && n !== not).sort((a, b) => (ctx.known("c:" + b) - ctx.known("c:" + a)) || (C[b].area - C[a].area))[0];
}

function choose(ctx, ids){
  const score = id => { const r = ctx.rec("c:" + id); return (ctx.due("c:" + id) ? -20 : 0) + (ctx.known("c:" + id) ? 10 : 0) + (r.st > 0 && r.last === "step" ? -5 : 0) + (r.n === 0 ? -2 : 0) + Math.random() * 6; };
  const id = ids.map(id => [score(id), id]).sort((a, b) => a[0] - b[0])[0][1];
  return {key: "c:" + id, id, label: nl(id)};
}
const STONE_LIST = STAGES.map((s, i) => ({id: "E" + (i + 1), name: s.name, ids: s.ids, requires: i ? ["E" + i] : [], gen: ctx => choose(ctx, s.ids)}));
const stoneOf = k => { const id = k.slice(2); const i = STAGES.findIndex(s => s.ids.includes(id)); return "E" + (i < 0 ? 1 : i + 1); };
const T = {
  id: "europa", title: "Landen van Europa", version: "v0.5", noun: "landen", subject: "Topografie", glyph: "EU", tint: "#E2F3E9",
  stones: STONE_LIST, stoneOf, fromKey: k => C[k.slice(2)] ? {key: k, id: k.slice(2), label: nl(k.slice(2))} : null,
  practices: "landen van Europa vinden op de kaart en benoemen",
  helps: "aardrijkskunde, het nieuws volgen en kaartlezen",
  forms: {
    A: {name: "Zoek op de kaart", desc: "Je ziet een naam en tikt het land aan."},
    B: {name: "Welk land is dit?", desc: "Een land kleurt paars en jij kiest de naam."}
  },
  aiFact: "AI kan een kaart van Europa niet precies uit zijn hoofd tekenen; de grenzen kloppen dan vaak niet. Daarom is deze kaart gemaakt met echte kaartgegevens.",
  canTitle: "Deze landen vind ik zonder hulp",
  startText(ctx){ return ctx.data.sessions.length ? `We beginnen met landen die je al kent. Daarna: ${STAGES[ctx.stage - 1].name}.` : "Je ziet de naam van een land en zoekt het op de kaart. We beginnen met de grote landen."; },
  keyLabel: k => nl(k.slice(2)),
  canDo(ctx){ return Object.keys(ctx.data.items).filter(k => ctx.known(k)).map(k => nl(k.slice(2))).sort((a, b) => a.localeCompare(b, "nl")); },

  setup(ctx){
    ctx.work.innerHTML = `<div class="eu-stage"><svg id="eu-map" preserveAspectRatio="xMidYMid meet" role="img" aria-label="Kaart van Europa">
      <rect class="eu-sea" x="-2000" y="-2000" width="6000" height="6000"></rect><path class="eu-bg" d="${G.bg}"></path>
      <g id="eu-c"></g><g id="eu-dots"></g><g id="eu-labels"></g></svg></div><div class="pl-row" id="eu-opts"></div>`;
    svg = document.getElementById("eu-map");
    const gC = svg.querySelector("#eu-c"), gD = svg.querySelector("#eu-dots");
    for (const c of G.countries){
      const p = document.createElementNS(NS, "path"); p.setAttribute("d", c.d); p.setAttribute("class", "eu-land"); p.dataset.id = c.id;
      gC.appendChild(p); c.el = p; c.dot = null;
    }
    for (const id of SMALL){
      const d = document.createElementNS(NS, "circle"); d.setAttribute("cx", C[id].c[0]); d.setAttribute("cy", C[id].c[1]); d.setAttribute("class", "eu-dot"); d.dataset.id = id;
      gD.appendChild(d); C[id].dot = d;
    }
    svg.addEventListener("click", e => { const t = e.target.closest("[data-id]"); if (t && clickFn) clickFn(t.dataset.id); });
    for (let s = 0; s < ctx.stage; s++) for (const id of STAGES[s].ids) cls(id, "eu-in", true);
    roundBox = ctx.stage === 1 ? {x: 0, y: 0, w: G.W, h: G.H} : boxFor(STAGES.slice(0, ctx.stage).flatMap(x => x.ids), 300);
    for (const k of Object.keys(ctx.data.items)) if (ctx.known(k)) cls(k.slice(2), "eu-known", true);
    setVB({x: 0, y: 0, w: G.W, h: G.H});
  },

  async ask(item, ctx){
    const id = item.id;
    svg.querySelector("#eu-labels").innerHTML = "";
    document.getElementById("eu-opts").innerHTML = "";
    cls(id, "eu-in", true);
    document.querySelector(".eu-stage").classList.toggle("b", ctx.form === "B");
    const r = await (ctx.form === "B" ? askB(id, ctx) : askA(id, ctx));
    r.support = ctx.support(item.stone);
    return r;
  }
};

async function askA(id, ctx){
  zoomTo(roundBox);
  ctx.setAsk("Waar ligt", nl(id));
  let got = await waitClick();
  if (got === id){ cls(id, "eu-ok", true); label(id); ctx.fb.ok(`Dat is ${nl(id)}.`); return {first: true, step: false}; }
  // tussenstap: via een buurland dat ze (meestal) al kent
  const other = got; cls(other, "eu-mis", true); const t1 = label(other, "mis");
  setTimeout(() => { cls(other, "eu-mis", false); t1.remove(); }, 1600);
  const buur = bestBuur(ctx, id, other) || bestBuur(ctx, id);
  let revealedA = false;
  ctx.fb.step(`Dat is ${nl(other)}. ${nl(id)} ligt naast ${nl(buur)}. Tik eerst ${nl(buur)} aan.`);
  let tries = 0;
  while (true){
    got = await waitClick();
    if (got === id) break;
    if (got === buur){
      cls(buur, "eu-buur", true); label(buur, "buur");
      ctx.fb.step(`Ja, dat is ${nl(buur)}. ${nl(id)} ligt ernaast. Waar is ${nl(id)}?`);
      let t2 = 0;
      while (true){
        got = await waitClick(); if (got === id) break;
        if (++t2 >= 1){ revealedA = true; cls(id, "eu-pulse", true); ctx.fb.step(`Kijk, ${nl(id)} knippert, naast ${nl(buur)}. Tik hem aan.`); }
      }
      break;
    }
    if (++tries >= 1){ cls(buur, "eu-pulse", true); ctx.fb.step(`${nl(buur)} knippert. Tik ${nl(buur)} aan, dan zoeken we ${nl(id)} ernaast.`); }
  }
  cls(id, "eu-pulse", false); cls(buur, "eu-pulse", false); cls(buur, "eu-buur", false);
  cls(id, "eu-ok", true); label(id);
  ctx.fb.ok(`Dat is ${nl(id)}. Gevonden via ${nl(buur)}.`);
  return {first: false, step: true, revealed: revealedA};
}

async function askB(id, ctx){
  zoomTo(boxFor([id].concat(C[id].n || []), 240));
  cls(id, "eu-target", true);
  ctx.setAsk("Welk land is", "het paarse land?");
  const stageIds = STAGES.slice(0, ctx.stage).flatMap(s => s.ids);
  let distract = (C[id].n || []).filter(n => C[n]).slice();
  distract = ctx.shuffle(distract).slice(0, 2);
  while (distract.length < 2){ const x = ctx.pick(stageIds); if (x !== id && !distract.includes(x)) distract.push(x); }
  const opts = ctx.shuffle([id].concat(distract));
  const box = document.getElementById("eu-opts");
  box.innerHTML = opts.map(o => `<button type="button" class="pl-btn quiet" data-o="${o}">${ctx.esc(nl(o))}</button>`).join("");
  const waitOpt = () => new Promise(res => box.querySelectorAll("button:not([disabled])").forEach(b => { b.onclick = () => res(b.dataset.o); }));
  let got = await waitOpt(), step = false, revealed = false;
  // tussenstap-regel (v0.7): de aanwijzing noemt nooit een land dat ook als antwoord klaarstaat. Eerst een buurland dat geen
  // keuze is; heeft het land geen andere buren, dan het dichtstbijzijnde land dat geen keuze is ("vlakbij").
  const hintLand = () => {
    const free = (C[id].n || []).filter(n => C[n] && !opts.includes(n)).sort((a, b) => (ctx.known("c:" + b) - ctx.known("c:" + a)) || (C[b].area - C[a].area));
    if (free.length) return [free[0], "ernaast"];
    const d = n => Math.hypot(C[n].c[0] - C[id].c[0], C[n].c[1] - C[id].c[1]);
    const near = G.countries.map(c => c.id).filter(n => n !== id && !opts.includes(n) && C[n].c).sort((a, b) => d(a) - d(b))[0];
    return [near, "er vlakbij"];
  };
  while (got !== id){
    step = true; ctx.fb.tried(nl(got));
    box.querySelector(`[data-o="${CSS.escape(got)}"]`).disabled = true;
    if (box.querySelectorAll("button:not([disabled])").length <= 1) revealed = true;   // nog maar één keuze over: dat is het antwoord tonen
    const [buur, waar] = hintLand();
    if (buur){ G.countries.forEach(c => cls(c.id, "eu-buur", false)); cls(buur, "eu-buur", true); svg.querySelector("#eu-labels").innerHTML = ""; label(buur, "buur"); zoomTo(boxFor([id, buur].concat(C[id].n || []), 240)); }
    ctx.fb.step(buur ? `Het land met de gele rand is ${nl(buur)}. Het paarse land ligt ${waar}. Welk land is het?` : `Kijk waar het paarse land ligt. Welk land is het?`);
    got = await waitOpt();
  }
  box.querySelectorAll("button").forEach(b => { b.disabled = b.dataset.o !== id; });
  G.countries.forEach(c => cls(c.id, "eu-buur", false));
  cls(id, "eu-target", false); cls(id, "eu-ok", true); svg.querySelector("#eu-labels").innerHTML = ""; label(id);
  ctx.fb.ok(`Dat is ${nl(id)}.`);
  return {first: !step, step, revealed};
}

PL.register(T);
})();

</script>
