/* Leeratelier huisstijl v0.6 — één visuele taal voor alle trainingen.
   Lichte, rustige ondergrond; violet is het merk; groen = gelukt; honing = tussenstap. Geen rood. */
:root{
  --pl-paper:#F7F5FD;      /* achtergrond: licht lavendelwit */
  --pl-surface:#FFFFFF;    /* kaarten en panelen */
  --pl-ink:#2B2540;        /* tekst: diep aubergine */
  --pl-ink-soft:#5E5876;   /* rustige tekst */
  --pl-line:#E4DEF3;       /* lijnen en randen */
  --pl-mist:#D9D3EA;       /* neutraal: 'dit is een ander land' */
  --pl-violet:#6F55D9;     /* merk, knoppen, focus */
  --pl-violet-deep:#5640B8;
  --pl-violet-soft:#ECE7FC;
  --pl-lilac:#B9A8F2;      /* bloemblad, tweede kleur in de tienstrook */
  --pl-leaf:#2F8F5E;       /* gelukt */
  --pl-leaf-soft:#E2F3E9;
  --pl-honey:#B9790F;      /* tussenstap */
  --pl-honey-soft:#FBF1DC;
  --pl-sea:#DCE6F4;        /* zee op de kaart */
  --pl-land:#EFEBF7;       /* land buiten de training */
  --pl-display:"Fredoka","Trebuchet MS",system-ui,sans-serif;
  --pl-body:"Lexend",system-ui,-apple-system,"Segoe UI",sans-serif;
  --pl-r-card:18px; --pl-r-pill:999px;
  color-scheme:light;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%}
body{margin:0;background:var(--pl-paper);color:var(--pl-ink);font-family:var(--pl-body);font-size:17px;line-height:1.5}
button{font:inherit;color:inherit}
button:focus-visible,input:focus-visible,textarea:focus-visible{outline:3px solid var(--pl-violet);outline-offset:2px}
.pl-app{min-height:100%;max-width:980px;margin:0 auto;padding-inline:16px;padding-block:14px 28px;display:flex;flex-direction:column;gap:14px}

/* kop */
.pl-top{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.pl-logo{width:44px;height:44px;border:0;background:none;padding:0;cursor:default;flex:none;-webkit-touch-callout:none;user-select:none;-webkit-user-select:none}
.pl-title{min-width:0;flex:1 1 200px}
.pl-title h1{font-family:var(--pl-display);font-weight:600;font-size:1.6rem;line-height:1.1;margin:0}
.pl-helps{margin:2px 0 0;font-size:.85rem;color:var(--pl-ink-soft)}
.pl-garden-btn{border:1.5px solid var(--pl-line);background:var(--pl-surface);border-radius:var(--pl-r-pill);min-height:44px;padding:8px 16px;font-weight:500;cursor:pointer}
.pl-garden-btn:hover{border-color:var(--pl-violet)}

/* schermen */
.pl-screen{display:flex;flex-direction:column;gap:14px}
.pl-card{background:var(--pl-surface);border-radius:var(--pl-r-card);padding:20px;border:1px solid var(--pl-line)}
.pl-h2{font-family:var(--pl-display);font-weight:600;font-size:1.5rem;line-height:1.15;margin:0 0 6px;text-wrap:balance}
.pl-lead{margin:0;color:var(--pl-ink-soft);max-width:60ch}
.pl-forms{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px;margin-top:14px}
.pl-form{text-align:left;border:2px solid var(--pl-line);background:var(--pl-paper);border-radius:var(--pl-r-card);padding:14px 16px;cursor:pointer;display:grid;gap:4px}
.pl-form b{font-family:var(--pl-display);font-weight:600;font-size:1.15rem}
.pl-form span{font-size:.9rem;color:var(--pl-ink-soft)}
.pl-form[aria-pressed="true"]{border-color:var(--pl-violet);background:var(--pl-violet-soft)}
.pl-row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}

/* knoppen: één vorm per rol */
.pl-btn{border:0;border-radius:var(--pl-r-pill);padding:12px 22px;min-height:48px;font-family:var(--pl-display);font-weight:600;font-size:1.15rem;cursor:pointer;background:var(--pl-violet);color:#fff}
.pl-btn:hover{background:var(--pl-violet-deep)}
.pl-btn.big{font-size:1.35rem;padding:14px 30px}
.pl-btn.quiet{background:var(--pl-surface);color:var(--pl-ink);border:2px solid var(--pl-line)}
.pl-btn.quiet:hover{border-color:var(--pl-violet)}
.pl-btn[disabled]{opacity:.5;cursor:default}

/* vraag */
.pl-ask{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.pl-ask-lead{font-family:var(--pl-display);font-size:1.15rem;color:var(--pl-ink-soft)}
.pl-ask-main{font-family:var(--pl-display);font-weight:600;font-size:clamp(1.8rem,5vw,2.5rem);line-height:1.05}
.pl-dots{display:flex;gap:6px;align-items:center}
/* stippen: nog = open rondje, nu = gevuld met ring, gedaan = gevuld (vorm én kleur) */
.pl-dot{width:12px;height:12px;border-radius:50%;background:var(--pl-surface);border:2px solid var(--pl-ink-soft);box-sizing:border-box}
.pl-dot.done{background:var(--pl-violet);border-color:var(--pl-violet)}
.pl-dot.now{background:var(--pl-violet);border-color:var(--pl-violet);box-shadow:0 0 0 3px var(--pl-surface),0 0 0 5px var(--pl-violet)}

/* feedback: drie vaste vormen */
.pl-fb{min-height:0}
.pl-fb:empty{display:none}
.pl-ok{background:var(--pl-leaf-soft);border:2px solid var(--pl-leaf);border-radius:var(--pl-r-card);padding:12px 16px;color:var(--pl-ink)}
.pl-ok b{color:#1F6B45;font-family:var(--pl-display);font-weight:600;margin-right:6px}
.pl-step{background:var(--pl-honey-soft);border:2px dashed var(--pl-honey);border-radius:var(--pl-r-card);padding:12px 16px;color:var(--pl-ink)}
.pl-step b{color:#8A5A0B;font-family:var(--pl-display);font-weight:600;margin-right:6px}
.pl-cheer{background:var(--pl-violet-soft);border-radius:var(--pl-r-card);padding:16px 18px;font-family:var(--pl-display);font-size:1.25rem;line-height:1.35}
.pl-note{font-size:.9rem;color:var(--pl-ink-soft)}
.pl-fact{border-top:1px solid var(--pl-line);padding-top:12px;font-size:.95rem;color:var(--pl-ink-soft)}
.pl-fact b{color:var(--pl-ink)}

/* tuin (laat zien) */
.pl-garden{display:flex;flex-wrap:wrap;gap:6px;align-items:flex-end;min-height:70px}
.pl-garden svg{width:58px;height:70px}
.pl-cando{display:flex;flex-wrap:wrap;gap:8px;margin:8px 0 0;padding:0;list-style:none}
.pl-cando li{background:var(--pl-leaf-soft);border-radius:var(--pl-r-pill);padding:4px 12px;font-size:.95rem}

/* ouderscherm */
.pl-parent{position:fixed;inset:0;background:rgba(43,37,64,.45);display:grid;place-items:center;padding:16px;z-index:20;overflow:auto}
.pl-parent .pl-card{max-width:760px;width:100%;max-height:calc(100vh - 32px);overflow:auto}
.pl-table-wrap{overflow-x:auto}
.pl-table{border-collapse:collapse;width:100%;font-size:.9rem;font-variant-numeric:tabular-nums}
.pl-table th,.pl-table td{text-align:left;padding:6px 8px;border-bottom:1px solid var(--pl-line);white-space:nowrap}
.pl-table th{font-weight:500;color:var(--pl-ink-soft)}
.pl-parent pre{white-space:pre-wrap;background:var(--pl-paper);border-radius:12px;padding:12px;font-size:.85rem;max-height:220px;overflow:auto}
.pl-parent textarea{width:100%;min-height:70px;border:2px solid var(--pl-line);border-radius:12px;padding:8px;font:.85rem ui-monospace,Menlo,monospace;background:var(--pl-paper)}
.pl-h3{font-family:var(--pl-display);font-weight:600;font-size:1.15rem;margin:4px 0 0}
.pl-foot{margin-top:auto;font-size:.75rem;color:var(--pl-ink-soft);text-align:right;user-select:none}

/* keypad (rekenen) */
.pl-keypad{display:grid;grid-template-columns:repeat(5,minmax(48px,1fr));gap:8px;max-width:420px}
.pl-key{min-height:52px;border-radius:14px;border:2px solid var(--pl-line);background:var(--pl-surface);font-family:var(--pl-display);font-weight:600;font-size:1.4rem;cursor:pointer}
.pl-key:hover{border-color:var(--pl-violet)}
.pl-key.wide{grid-column:span 2;font-size:1.1rem}
.pl-key.go{background:var(--pl-violet);border-color:var(--pl-violet);color:#fff}

@media (max-width:560px){.pl-card{padding:16px}.pl-btn.big{width:100%}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

/* v0.2: home */
.pl-hero{position:relative;background:var(--pl-violet-soft);border-radius:26px;padding:22px;min-height:150px;display:flex;align-items:center;overflow:hidden}
.pl-hero-text{max-width:60%;display:grid;gap:6px}
.pl-hero-img{position:absolute;right:-6px;bottom:-10px;height:170px;border-radius:50% 50% 0 0}
.pl-today{display:grid;gap:10px}
.pl-eyebrow{font-size:.875rem;font-weight:500;letter-spacing:.04em;text-transform:uppercase;color:var(--pl-ink-soft)}
.pl-list{display:grid;gap:10px}
.pl-listrow{display:flex;align-items:center;gap:12px;background:var(--pl-surface);border:1.5px solid var(--pl-line);border-radius:18px;padding:10px 12px;cursor:pointer;text-align:left;color:var(--pl-ink)}
.pl-listrow:hover{border-color:var(--pl-violet)}
.pl-badge{width:40px;height:40px;border-radius:12px;display:flex;align-items:center;justify-content:center;font-family:var(--pl-display);font-weight:600;color:var(--pl-violet-deep);flex:none}
.pl-listtext{flex:1;display:flex;flex-direction:column;min-width:0}
.pl-listtext b{font-weight:500}.pl-listtext span{font-size:.85rem;color:var(--pl-ink-soft)}
.pl-chev{width:10px;height:10px;border-right:2px solid var(--pl-ink-soft);border-bottom:2px solid var(--pl-ink-soft);transform:rotate(-45deg);margin-right:6px}
/* v0.2: rekenmuur modellen */
.rk-model{display:grid;gap:8px;transition:opacity .4s;min-height:0}
.rk-model.gone{opacity:0}
.rk-line{width:min(100%,320px);height:auto;display:block}
.rk-grid{display:grid;gap:4px;width:max-content;max-width:100%}
.rk-grid .rk-cell{width:16px}
.rk-skip{display:flex;gap:6px;flex-wrap:wrap}
.rk-skip span{background:var(--pl-violet-soft);border-radius:999px;padding:2px 10px;font-size:.85rem;font-variant-numeric:tabular-nums}
/* v0.2: eigen ronde */
.pl-make{display:flex;align-items:center;gap:12px;border:2px dashed var(--pl-lilac);background:var(--pl-surface);border-radius:22px;padding:14px 16px;cursor:pointer;text-align:left;color:var(--pl-ink)}
.pl-make:hover{border-color:var(--pl-violet)}
.pl-make .pl-listtext b{font-family:var(--pl-display);font-weight:600;font-size:1.1rem}
.pl-plus{width:44px;height:44px;border-radius:999px;background:var(--pl-violet);position:relative;flex:none}
.pl-plus::before,.pl-plus::after{content:"";position:absolute;left:50%;top:50%;background:#fff;border-radius:2px;transform:translate(-50%,-50%)}
.pl-plus::before{width:16px;height:2.5px}.pl-plus::after{width:2.5px;height:16px}
.pl-btn[aria-pressed="true"]{border-color:var(--pl-violet);background:var(--pl-violet-soft)}
@media (max-width:560px){.pl-garden-btn{padding:8px 12px;font-size:.95rem}.pl-title h1{font-size:1.35rem}}
/* v0.3: zinnen en werkwoorden */
.gr-board{display:grid;gap:12px}
.gr-zin{margin:0;font-family:var(--pl-display);font-weight:500;font-size:1.5rem;line-height:1.9;display:flex;flex-wrap:wrap;gap:4px 6px;align-items:baseline}
.gr-w{font:inherit;border:2px solid transparent;background:var(--pl-paper);border-radius:10px;padding:2px 8px;cursor:pointer;color:var(--pl-ink)}
.gr-w:hover:not([disabled]){border-color:var(--pl-lilac)}
.gr-w.on{background:var(--pl-violet-soft);border-color:var(--pl-violet);color:var(--pl-violet-deep)}
.gr-w[disabled]{cursor:default;color:var(--pl-ink)}
.gr-w[disabled]:not(.on){background:transparent}
.gr-punt{font-size:1.5rem}
.gr-opt.gr-long{font-size:1rem;white-space:normal;text-align:left;line-height:1.3}
.gr-step:empty{display:none}
.ww-board{display:grid;gap:12px}
.ww-zin{margin:0;font-family:var(--pl-display);font-weight:500;font-size:1.6rem;line-height:1.4}
.ww-steps{display:flex;flex-wrap:wrap;gap:8px}
.ww-steps:empty{display:none}
.ww-steps span{background:var(--pl-paper);border-radius:999px;padding:2px 12px;font-size:.95rem;color:var(--pl-ink-soft)}
.rk-bar{position:relative;width:min(100%,300px);height:28px;border:2px solid var(--pl-line);border-radius:999px;overflow:hidden;background:var(--pl-surface)}
.rk-bar span{position:absolute;left:0;top:0;bottom:0;background:var(--pl-lilac)}
.rk-bar b{position:absolute;left:10px;top:3px;font-family:var(--pl-display);font-weight:600}
.pl-form.locked{opacity:.55;cursor:default;border-style:dashed}
/* v0.4: ronde verlaten, compacte stenenkeuze, knop in beeld */
.pl-confirm{display:flex;flex-wrap:wrap;gap:10px;align-items:center;background:var(--pl-violet-soft);border-radius:var(--pl-r-card);padding:12px 16px}
.pl-stones{grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px;margin-top:0}
.pl-stones .pl-form{padding:10px 12px}
.pl-stones .pl-form b{font-size:.95rem}
.pl-stones .pl-form span{font-size:.85rem}
.pl-sticky{position:sticky;bottom:0;background:var(--pl-paper);padding:10px 0 6px;z-index:2}
/* v0.5: Bedenk je ronde (gesprek in bouwstenen) */
.pl-chat{display:grid;gap:10px}
.pl-bub{max-width:88%;padding:10px 14px;border-radius:18px;line-height:1.4}
.pl-bub.ik{background:var(--pl-violet-soft);border-bottom-left-radius:6px;justify-self:start;font-family:var(--pl-display);font-size:1.1rem}
.pl-bub.jij{background:var(--pl-surface);border:1.5px solid var(--pl-line);border-bottom-right-radius:6px;justify-self:end}
.pl-chips{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px;padding-left:4px}
.pl-chip{text-align:left;border:2px solid var(--pl-line);background:var(--pl-paper);border-radius:14px;padding:10px 12px;cursor:pointer;display:grid;gap:2px;min-height:48px;color:var(--pl-ink)}
.pl-chip b{font-family:var(--pl-display);font-weight:600}
.pl-chip span{font-size:.85rem;color:var(--pl-ink-soft)}
.pl-chip:hover{border-color:var(--pl-violet)}
.pl-chip.off{opacity:.55;border-style:dashed;cursor:default}
.pl-plan{display:grid;gap:10px;border-top:1px solid var(--pl-line);padding-top:12px}
.pl-vraag{margin:0;padding:12px 16px;border-left:4px solid var(--pl-violet);background:var(--pl-surface);border-radius:0 14px 14px 0;font-family:var(--pl-display);font-size:1.1rem;line-height:1.4}
.pl-denk{margin:0;display:grid;gap:6px}
.pl-denk dt{font-size:.875rem;font-weight:500;letter-spacing:.04em;text-transform:uppercase;color:var(--pl-ink-soft)}
.pl-denk dd{margin:0 0 4px;line-height:1.45}

/* v0.6: reactie met reden, begroeting */
.pl-react{display:grid;gap:10px}
.pl-react .pl-btn[aria-pressed="true"]{border-color:var(--pl-violet);background:var(--pl-violet-soft)}
.pl-chips.pl-why{grid-template-columns:repeat(auto-fill,minmax(170px,1fr))}
.pl-why .pl-chip b{font-weight:500}
#pl-why .pl-note b{color:var(--pl-ink);font-weight:500}
.pl-greet{margin:8px 0 0;max-width:60ch}

/* v0.7: één schermindeling voor een ronde (B1, B2, B6) en tekst die bij de stand hoort */
.pl-top{flex-wrap:nowrap}
.pl-title{flex:1 1 auto}
.pl-helps{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pl-topbtns{display:flex;gap:8px;flex:none}
.pl-round{width:100%;max-width:600px;margin-inline:auto;display:flex;flex-direction:column;gap:14px}
.pl-round .pl-keypad{margin-inline:auto;width:100%;max-width:420px;position:sticky;bottom:0;z-index:5;background:var(--pl-paper);padding:8px 0 calc(8px + env(safe-area-inset-bottom,0px));box-shadow:0 -10px 14px -12px rgba(43,37,64,.35)}
.pl-tried{display:block;font-size:.9rem;color:var(--pl-ink-soft);margin-bottom:4px}
.pl-next{margin:0;background:var(--pl-paper);border-radius:var(--pl-r-card);padding:12px 16px;line-height:1.45}
.pl-next b{font-family:var(--pl-display);font-weight:600;margin-right:4px}
/* hulpknop: geen antwoordvorm (B4). Tekst in violet, geen pil, wel 44 px hoog */
.pl-help{border:0;background:none;color:var(--pl-violet-deep);font:500 .95rem var(--pl-body);min-height:44px;padding:8px 6px;cursor:pointer;text-decoration:underline;text-underline-offset:3px}
.pl-help:hover{color:var(--pl-violet)}
.pl-startrow{margin-top:14px}
.pl-daarna{margin:10px 0 0}
.pl-why-today{margin:0}
/* Bedenk je ronde: wat dicht is, is geen knop (C2) */
.pl-locked{list-style:none;margin:0;padding:0 0 0 4px;display:grid;gap:2px;font-size:.85rem;color:var(--pl-ink-soft)}
.pl-locked b{font-weight:500;color:var(--pl-ink-soft)}
@media (max-width:560px){.pl-topbtns .pl-garden-btn{padding:8px 12px}.pl-title h1{font-size:1.25rem}}
@media (max-width:480px){.pl-top .pl-helps{display:none}}

.rk-board{display:grid;gap:12px;justify-items:start}
.rk-trail{display:flex;flex-wrap:wrap;gap:8px;min-height:1.6em}
.rk-trail span{background:var(--pl-paper);border-radius:var(--pl-r-pill);padding:2px 12px;font-size:.95rem;color:var(--pl-ink-soft);font-variant-numeric:tabular-nums}
.rk-sum{font-family:var(--pl-display);font-weight:600;font-size:clamp(2.2rem,8vw,3.4rem);line-height:1.1;font-variant-numeric:tabular-nums}
.rk-slot{display:inline-block;min-width:1.6em;border-bottom:4px solid var(--pl-violet);text-align:center;color:var(--pl-violet-deep)}
.rk-frames{display:grid;gap:8px;transition:opacity .4s}
.rk-frames.gone{opacity:0}
.rk-strip{display:grid;grid-template-columns:repeat(10,minmax(22px,34px));gap:4px;border:2px solid var(--pl-line);border-radius:12px;padding:6px;background:var(--pl-surface)}
.rk-cell{aspect-ratio:1;border-radius:50%;border:2px dashed var(--pl-line);max-width:100%}
.rk-cell.v{background:var(--pl-violet);border-color:var(--pl-violet)}
.rk-cell.l{background:var(--pl-lilac);border-color:var(--pl-lilac)}
.rk-cell.x{background:transparent;border:2px solid var(--pl-lilac)}

/* Tafelreis v0.6: het lichtpad. Een pad van stapstenen loopt door het bos naar een open plek met warm zonlicht.
   Licht van boven en in het midden; donkerder aan de randen (daar staan de bomen). Drie lagen diepte: verre bomen, het pad,
   bomen dichtbij; gras op de voorgrond, iets onscherp. Elke goede sprong brengt je dichterbij (--reis: de lagen schalen vanuit
   het licht, het licht groeit). Weinig losse deeltjes: een paar stofjes in de lichtbundels.
   Alles wat gelezen moet worden staat op licht: het bordje, de stenen (inkt op kalksteen), de panelen. Contrast ruim boven 4,5 : 1.
   Alleen transform- en opacity-animaties; bij 'minder beweging' staat alles stil (core.css). */
:root{
  --tf-ink:#1E2A24; --tf-bark:#3B2A20; --tf-bark2:#6B4634; --tf-moss:#4CA64B; --tf-leaf-deep:#24503A;
  --tf-light:#FFF6DA; --tf-glow:#FFE9A3; --tf-amber:#E8A33D; --tf-sand:#E3D3A4; --tf-stone:#F3EFE2;
}
.tf-world{--reis:0;position:relative;overflow:hidden;border-radius:26px;min-height:min(76vh,600px);background:var(--tf-leaf-deep);isolation:isolate;box-shadow:inset 0 0 0 1px rgba(255,255,255,.1),0 10px 30px -18px rgba(20,50,35,.7)}
.tf-world > *{position:absolute}

/* licht: van boven, warm, met een open plek aan het eind van het pad */
.tf-sky{inset:0;background:
  radial-gradient(ellipse 60% 48% at 50% 30%,#FFF6DA 0,#FBE9AE 18%,#D8E59C 36%,rgba(127,184,106,.0) 62%),
  linear-gradient(180deg,#9CC97A 0%,#6FA863 36%,#3F7F4E 62%,#24503A 100%)}
.tf-sky::after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,rgba(18,40,28,.62) 0,rgba(18,40,28,0) 30%,rgba(18,40,28,0) 70%,rgba(18,40,28,.62) 100%)}
.tf-sun{left:50%;top:44%;width:44%;aspect-ratio:1;border-radius:50%;background:radial-gradient(circle,rgba(255,250,228,.95) 0,rgba(255,236,170,.55) 30%,rgba(255,236,170,0) 68%);
  transform:translate(-50%,-50%) scale(calc(1 + var(--reis) * .045));transition:transform 1s cubic-bezier(.4,0,.2,1);will-change:transform}
.tf-rays{inset:0;overflow:hidden;mix-blend-mode:screen;pointer-events:none}
.tf-rays i{position:absolute;top:-12%;left:50%;width:12%;height:120%;transform-origin:50% 0;background:linear-gradient(180deg,rgba(255,244,205,.55),rgba(255,244,205,0) 78%);filter:blur(6px);animation:tf-ray 10s ease-in-out infinite alternate}
.tf-rays i:nth-child(1){transform:translateX(-50%) rotate(26deg);animation-delay:-2s}
.tf-rays i:nth-child(2){transform:translateX(-50%) rotate(9deg);width:9%;animation-delay:-5s}
.tf-rays i:nth-child(3){transform:translateX(-50%) rotate(-8deg);width:14%;animation-delay:-7s}
.tf-rays i:nth-child(4){transform:translateX(-50%) rotate(-24deg);width:8%}
@keyframes tf-ray{from{opacity:.35}to{opacity:.8}}
.tf-canopy{inset:-12% -6% auto -6%;height:42%;background:
  radial-gradient(ellipse 34% 70% at 6% 10%,#1C3F2C 0,#1C3F2C 45%,transparent 72%),
  radial-gradient(ellipse 34% 70% at 94% 8%,#1F4530 0,#1F4530 45%,transparent 72%),
  radial-gradient(ellipse 22% 40% at 30% 0%,#2F6B40 0,transparent 70%),radial-gradient(ellipse 22% 40% at 72% 0%,#2F6B40 0,transparent 70%);
  filter:blur(8px);opacity:.92;transform-origin:50% 0;animation:tf-adem 12s ease-in-out infinite alternate}
@keyframes tf-adem{from{transform:scale(1)}to{transform:scale(1.03) translateY(3px)}}

/* drie lagen; ze schalen vanuit het licht, zodat je naar voren loopt */
.tf-layer{inset:0;transform-origin:50% 50%;transition:transform 1s cubic-bezier(.4,0,.2,1);will-change:transform;pointer-events:none}
.tf-layer.far{transform:scale(calc(1 + var(--reis) * .015))}
.tf-layer.path{transform:scale(calc(1 + var(--reis) * .03));transform-origin:50% 54%}
.tf-layer.near{transform:scale(calc(1 + var(--reis) * .04))}
.tf-path{position:absolute;inset:0;width:100%;height:100%}
.tf-tree{position:absolute;bottom:22%;border-radius:40% 40% 14% 14% / 6% 6% 3% 3%;background:linear-gradient(90deg,#251912 0%,var(--tf-bark) 45%,#4E3527 78%,#6E5038 100%);box-shadow:8px 0 18px -10px rgba(0,0,0,.6)}
.tf-tree::after{content:"";position:absolute;top:6%;bottom:20%;width:22%;border-radius:40%;background:linear-gradient(180deg,rgba(255,236,180,.35),rgba(255,236,180,0))}
.tf-tree:nth-child(-n+3)::after{right:6%}
.tf-tree:nth-child(n+4)::after{left:6%}
.tf-tree::before{content:"";position:absolute;left:-40%;right:-40%;bottom:-8px;height:18px;border-radius:50%;background:radial-gradient(ellipse,#2F6B40,transparent 70%)}
.tf-tree.far{bottom:40%;opacity:.5;filter:blur(1.8px);background:linear-gradient(90deg,#3F6B52,#5E8A68 50%,#3B6550)}
.tf-tree.far::after,.tf-tree.far::before{display:none}
.tf-ground{left:-5%;right:-5%;bottom:-2%;height:50%;border-radius:50% 50% 0 0 / 22% 22% 0 0;background:linear-gradient(180deg,#7DBA62 0%,#4F9450 40%,#2E6B3A 100%);box-shadow:inset 0 14px 30px -14px rgba(255,246,218,.6)}
.tf-motes{inset:0;pointer-events:none}
.tf-motes b{position:absolute;width:4px;height:4px;border-radius:50%;background:var(--tf-light);opacity:0;animation:tf-mote ease-in-out infinite}
@keyframes tf-mote{0%{opacity:0;transform:translate(0,0)}20%{opacity:.75}80%{opacity:.6}100%{opacity:0;transform:translate(16px,38px)}}

/* voorgrond: gras, iets onscherp */
.tf-gras{bottom:-6px;width:44%;height:66px;z-index:3;pointer-events:none;filter:blur(.9px);opacity:.95;transform-origin:50% 100%;animation:tf-gras 5s ease-in-out infinite alternate}
.tf-gras.l{left:-4%}.tf-gras.r{right:-4%;transform:scaleX(-1);animation-name:tf-gras-r;animation-delay:-2s}
@keyframes tf-gras{from{transform:skewX(-3deg)}to{transform:skewX(3deg)}}
@keyframes tf-gras-r{from{transform:scaleX(-1) skewX(-3deg)}to{transform:scaleX(-1) skewX(3deg)}}

/* wezens: een verrassing in het bos, niet gekoppeld aan goed of fout */
.tf-wezen{position:absolute;pointer-events:none;animation:tf-wezen-in 1.2s .6s both}
.tf-wezen.uil{width:50px;top:20%;right:8%}
.tf-wezen.uil .oog{animation:tf-knipper 5s 2s infinite}
.tf-wezen.slak{width:56px;bottom:9%;right:6%}
.tf-wezen.egel{width:60px;bottom:8%;left:5%}
@keyframes tf-wezen-in{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
@keyframes tf-knipper{0%,92%,100%{transform:scaleY(1)}95%{transform:scaleY(.08)}}

/* geluid: twee knoppen, natuur en handpan, elk aan of uit */
.tf-sound{bottom:10px;right:10px;z-index:4;display:flex;gap:6px}
.tf-soundbtn{border:0;border-radius:var(--pl-r-pill);background:rgba(255,255,255,.92);color:var(--tf-ink);font:500 .9rem var(--pl-body,inherit);padding:8px 14px;min-height:44px;cursor:pointer;box-shadow:0 4px 10px -6px rgba(0,0,0,.6)}
.tf-soundbtn[aria-pressed="false"]{background:rgba(255,255,255,.6)}

/* het speelvlak */
.tf-play{position:relative;z-index:2;display:grid;gap:12px;padding:14px 14px 62px;min-height:min(76vh,600px);align-content:space-between;grid-template-rows:auto 1fr auto auto;max-width:600px;margin:0 auto;width:100%;box-sizing:border-box}
.tf-panel{background:rgba(255,255,255,.94);border-radius:18px;padding:10px 14px;box-shadow:0 6px 18px -10px rgba(0,0,0,.45);color:var(--tf-ink)}
.tf-hero{position:relative;justify-self:center;margin-top:22px;background:linear-gradient(170deg,#FFFDF5,#F5EAD0);border:4px solid var(--tf-bark2);border-radius:22px;padding:8px 26px 10px;min-width:60%;text-align:center;color:var(--tf-ink);font-family:var(--pl-display);font-weight:600;font-size:clamp(2.4rem,10vw,3.4rem);line-height:1.05;font-variant-numeric:tabular-nums;box-shadow:0 16px 26px -16px rgba(0,0,0,.6),inset 0 0 0 2px rgba(255,255,255,.7);transform-origin:50% -30px;animation:tf-sway 6s ease-in-out infinite alternate}
.tf-hero small{display:block;font-family:var(--pl-body,inherit);font-weight:500;font-size:.95rem;color:#5A3B2B;letter-spacing:.02em}
.tf-hero::before,.tf-hero::after{content:"";position:absolute;top:-30px;width:3px;height:30px;background:linear-gradient(#3A2A20,#6B4634);border-radius:2px}
.tf-hero::before{left:18%}.tf-hero::after{right:18%}
@keyframes tf-sway{from{transform:rotate(-.8deg)}to{transform:rotate(.8deg)}}
.tf-slot{display:inline-block;min-width:1.6em;border-bottom:4px solid var(--pl-violet);text-align:center;color:var(--pl-violet-deep)}
.tf-model{display:grid;gap:8px;transition:opacity .4s;justify-items:center}
.tf-model:empty{display:none}
.tf-model.gone{opacity:0;height:0;overflow:hidden;padding:0}
.tf-tools{display:flex;gap:8px;flex-wrap:wrap}
.tf-play .pl-btn.quiet{background:rgba(255,255,255,.94)}

/* rooster, sprongen en de som in stukjes: de drie uitlegvormen */
.tf-rooster{display:grid;gap:5px;width:100%;max-width:320px;transition:transform .8s cubic-bezier(.5,0,.2,1)}
.tf-rooster.draai{transform:rotate(90deg)}
.tf-dot{aspect-ratio:1;border-radius:50%;background:var(--pl-mist);animation:tf-in .35s both;box-shadow:inset -2px -3px 4px rgba(0,0,0,.12),inset 2px 2px 3px rgba(255,255,255,.6)}
.tf-dot.a{background:var(--pl-violet)}
.tf-dot.b{background:var(--pl-lilac)}
.tf-dot.x{background:transparent;border:2px solid var(--pl-violet);box-shadow:none}
@keyframes tf-in{from{transform:scale(.3);opacity:0}to{transform:scale(1);opacity:1}}
.tf-jumps{display:flex;flex-wrap:wrap;gap:6px;justify-content:center}
.tf-jumps span{min-width:2.4em;text-align:center;border-radius:var(--pl-r-pill);padding:3px 10px;background:var(--pl-violet-soft);color:var(--tf-ink);font-family:var(--pl-display);font-weight:600;font-variant-numeric:tabular-nums;animation:tf-in .35s both}
.tf-jumps span.next{background:#fff;border:2px dashed var(--pl-violet)}
.tf-chain{display:flex;flex-wrap:wrap;gap:8px;align-items:baseline;justify-content:center;font-family:var(--pl-display);font-weight:600;font-size:1.5rem;font-variant-numeric:tabular-nums;color:var(--tf-ink)}
.tf-chain span{animation:tf-in .35s both}
.tf-chain span:nth-child(2){animation-delay:.25s}.tf-chain span:nth-child(3){animation-delay:.5s}

/* Hinkelen: kalkstenen op het pad, inkt op licht */
.tf-pad-scene{display:grid;gap:16px;padding-top:34px}
.tf-scene{display:grid;align-content:end}
.tf-start{display:flex;align-items:center;gap:14px}
.tf-arrow{font-family:var(--pl-display);font-weight:600;font-size:1.3rem;color:var(--tf-ink);background:rgba(255,255,255,.94);border-radius:var(--pl-r-pill);padding:4px 14px;box-shadow:0 4px 12px -6px rgba(0,0,0,.5)}
.tf-stones{display:grid;grid-template-columns:repeat(4,minmax(0,130px));gap:14px;padding-top:8px;justify-content:center}
.tf-stone{--r:0deg;--y:0px;position:relative;min-height:84px;border:0;border-radius:46% 54% 48% 52% / 58% 52% 48% 42%;background:radial-gradient(circle at 34% 26%,#FFFFFF 0,var(--tf-stone) 30%,#E1D9C2 68%,#B9AF93 100%);box-shadow:inset 0 -8px 10px -6px rgba(90,70,40,.4),inset 0 6px 8px -4px rgba(255,255,255,.8),0 10px 14px -8px rgba(30,40,20,.6);font-family:var(--pl-display);font-weight:600;font-size:1.9rem;color:var(--tf-ink);cursor:pointer;display:flex;align-items:center;justify-content:center;transform:rotate(var(--r)) translateY(var(--y));transition:transform .18s,filter .2s}
.tf-stone::before{content:"";position:absolute;left:12%;right:52%;top:7%;height:20%;border-radius:50%;background:linear-gradient(180deg,#9BD46B,#5FA850);opacity:.7}
.tf-stone::after{content:"";position:absolute;left:8%;right:8%;bottom:-12px;height:14px;border-radius:50%;background:radial-gradient(ellipse,rgba(20,40,20,.5),transparent 70%);z-index:-1}
.tf-stone b{position:relative}
.tf-stone:active{transform:rotate(var(--r)) translateY(calc(var(--y) + 3px)) scale(.96)}
.tf-puff{position:absolute;left:50%;bottom:-4px;width:10px;height:10px;border-radius:50%;background:rgba(255,250,230,.95);opacity:0;transform:translateX(-50%)}
.tf-stone.land .tf-puff{animation:tf-puff .5s ease-out}
.tf-stone.land .tf-puff::before,.tf-stone.land .tf-puff::after{content:"";position:absolute;inset:0;border-radius:50%;background:inherit;animation:tf-puff-side .5s ease-out}
.tf-stone.land .tf-puff::after{animation-name:tf-puff-side2}
@keyframes tf-puff{0%{opacity:.9;transform:translateX(-50%) scale(.4)}100%{opacity:0;transform:translateX(-50%) scale(2.6)}}
@keyframes tf-puff-side{0%{transform:translate(0,0) scale(.6)}100%{transform:translate(-22px,-8px) scale(.2)}}
@keyframes tf-puff-side2{0%{transform:translate(0,0) scale(.6)}100%{transform:translate(22px,-8px) scale(.2)}}
.tf-stone:hover{transform:rotate(var(--r)) translateY(calc(var(--y) - 4px)) scale(1.04);filter:brightness(1.04)}
.tf-stone:focus-visible{outline:3px solid var(--pl-violet);outline-offset:3px}
.tf-stone.here{width:92px;min-height:88px;cursor:default;padding-top:22px;font-size:1.3rem;transform:none}
.tf-stone.here:hover{transform:none;filter:none}
.tf-stone.hit{box-shadow:0 0 0 4px rgba(255,246,218,.9),0 0 26px 6px rgba(255,233,163,.85),inset 0 -8px 10px -6px rgba(90,70,40,.35);animation:tf-pop .5s}
.tf-stone.wobble{animation:tf-wobble .6s}
.tf-stone[disabled]{opacity:.6;cursor:default}
@keyframes tf-wobble{0%,100%{transform:rotate(var(--r)) translateY(var(--y))}25%{transform:rotate(calc(var(--r) - 3deg)) translate(-5px,var(--y))}50%{transform:rotate(calc(var(--r) + 3deg)) translate(5px,var(--y))}75%{transform:rotate(var(--r)) translate(-3px,var(--y))}}
@keyframes tf-pop{0%{transform:rotate(var(--r)) translateY(var(--y)) scale(1)}40%{transform:rotate(var(--r)) translateY(var(--y)) scale(1.12)}100%{transform:rotate(var(--r)) translateY(var(--y)) scale(1)}}

/* de figuur: de bloem, rust-bob, dan springen met squash-and-stretch */
.tf-avatar{position:absolute;top:-34px;left:50%;width:54px;height:54px;border-radius:50%;object-fit:cover;border:3px solid #fff;box-shadow:0 8px 14px -6px rgba(0,0,0,.6),0 0 18px 2px rgba(255,236,170,.7);transform:translateX(-50%);transform-origin:50% 100%;--dx:0px;--dy:0px;animation:tf-idle 2.4s ease-in-out infinite;z-index:3}
.tf-avatar-flower{display:block;background:#fff}
.tf-avatar-flower svg{width:100%;height:100%}
@keyframes tf-idle{0%,100%{transform:translateX(-50%) scale(1,1)}50%{transform:translateX(-50%) translateY(-4px) scale(.98,1.03)}}
.tf-avatar.jump{animation:tf-jump .7s cubic-bezier(.3,0,.25,1) forwards}
@keyframes tf-jump{
  0%{transform:translate(-50%,0) scale(1,1)}
  14%{transform:translate(-50%,7px) scale(1.18,.82)}
  48%{transform:translate(calc(-50% + var(--dx) * .5),calc(var(--dy) - 96px)) scale(.88,1.18)}
  84%{transform:translate(calc(-50% + var(--dx)),calc(var(--dy) + 5px)) scale(1.16,.84)}
  100%{transform:translate(calc(-50% + var(--dx)),var(--dy)) scale(1,1)}}
.tf-trail{display:flex;flex-wrap:wrap;gap:6px;min-height:28px;opacity:0;transition:opacity .4s}
.tf-trail.on{opacity:1}
.tf-trail span{background:rgba(255,255,255,.94);border-radius:var(--pl-r-pill);padding:2px 10px;font-size:.95rem;color:var(--tf-ink);font-variant-numeric:tabular-nums;box-shadow:0 3px 8px -5px rgba(0,0,0,.5)}

/* Kaarten: houten bordje dat omdraait */
.tf-card{perspective:900px;width:min(100%,300px);height:130px;justify-self:center}
.tf-q{font-size:3rem;color:#5A3B2B}
.tf-card-inner{position:relative;width:100%;height:100%;transform-style:preserve-3d;transition:transform .6s cubic-bezier(.4,0,.2,1)}
.tf-card.flipped .tf-card-inner{transform:rotateY(180deg)}
.tf-card.wobble{animation:tf-wobble .6s}
.tf-face{position:absolute;inset:0;backface-visibility:hidden;border-radius:18px;display:grid;place-items:center;gap:8px;padding:12px;font-family:var(--pl-display);font-weight:600;font-size:2.3rem;font-variant-numeric:tabular-nums;color:var(--tf-ink);overflow:hidden}
.tf-face.front{background:linear-gradient(160deg,#FFFDF5,#F5EAD0);border:5px solid var(--tf-bark2);box-shadow:0 12px 20px -12px rgba(0,0,0,.6),inset 0 0 0 2px rgba(255,255,255,.7)}
.tf-face.front::after{content:"";position:absolute;top:-60%;left:-30%;width:40%;height:220%;background:linear-gradient(100deg,rgba(255,255,255,0),rgba(255,255,255,.55),rgba(255,255,255,0));transform:rotate(12deg);animation:tf-sheen 6s ease-in-out infinite}
@keyframes tf-sheen{0%,60%{transform:translateX(0) rotate(12deg)}100%{transform:translateX(420px) rotate(12deg)}}
.tf-face.back{transform:rotateY(180deg);background:linear-gradient(160deg,#F2FAEA,#CFEBB9);border:5px solid var(--tf-moss);font-size:1.6rem;grid-template-rows:auto 1fr;box-shadow:0 12px 20px -12px rgba(0,0,0,.6)}
.tf-face.back .tf-rooster{width:min(100%,220px);gap:3px}
.tf-face.back .tf-dot{background:#2F7F3A;animation:none;box-shadow:none}

/* de tafelkaart: een mosmuurtje waar sommen opbloeien */
.tf-kaartcard{display:grid;gap:8px}
.tf-kaartwrap{position:relative}
.tf-moss{background:linear-gradient(180deg,#2F6F4A,#1F4D38);border-radius:14px;padding:8px;max-width:300px;box-sizing:border-box;box-shadow:inset 0 2px 12px rgba(0,0,0,.35)}
.tf-kaart{display:grid;grid-template-columns:auto repeat(10,1fr);gap:3px;max-width:280px;align-items:center}
.tf-kh{font-size:.62rem;color:#DFF3DC;text-align:center;font-variant-numeric:tabular-nums}
.tf-cell{position:relative;aspect-ratio:1;border-radius:50%;background:rgba(255,255,255,.14);box-shadow:inset 0 1px 2px rgba(0,0,0,.35);transition:background .4s,box-shadow .4s}
.tf-cell i{position:absolute;inset:18%;border-radius:50%;background:transparent;transition:background .4s,transform .4s}
.tf-cell.kiem{background:rgba(143,214,75,.35)}
.tf-cell.kiem i{background:#8FD64B;inset:32%}
.tf-cell.bloem{background:rgba(255,233,163,.25);box-shadow:0 0 10px 1px rgba(255,233,163,.45)}
.tf-cell.bloem i{background:radial-gradient(circle,#FFE9A3 0 26%,var(--pl-violet) 28% 100%);inset:12%}
.tf-cell.bloem.spiegel i{background:radial-gradient(circle,#FFE9A3 0 28%,var(--pl-lilac) 30% 100%);inset:18%}
.tf-cell.bloem.cadeau{box-shadow:none;background:rgba(255,233,163,.14)}
.tf-cell.bloem.cadeau i{background:radial-gradient(circle,#FFE9A3 0 28%,#D9CFF7 30% 100%);inset:26%;opacity:.8}
.tf-cell.now{box-shadow:0 0 0 2px #1F4D38,0 0 0 4px #FFE9A3}
.tf-cell.pop i{animation:tf-bloom .9s}
@keyframes tf-bloom{0%{transform:scale(.4)}45%{transform:scale(1.9)}100%{transform:scale(1)}}
.tf-petals{position:absolute;inset:0;pointer-events:none;overflow:hidden;border-radius:18px}
.tf-petals i{position:absolute;top:-16px;width:10px;height:16px;border-radius:50%;background:var(--pl-lilac);opacity:0;animation:tf-fall 2.6s ease-in forwards}
.tf-petals i:nth-child(odd){background:#FFE9A3}
@keyframes tf-fall{0%{opacity:0;transform:translateY(0) rotate(0)}10%{opacity:.95}100%{opacity:0;transform:translateY(240px) rotate(300deg)}}
@media (max-width:560px){.tf-stones{grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;max-width:300px;width:100%;justify-self:center}.tf-stone{min-height:78px;font-size:1.8rem}.tf-card{height:120px}.tf-play{padding:12px 12px 64px}.tf-world{border-radius:20px}.tf-hero{min-width:72%}.tf-soundbtn{font-size:.85rem;padding:8px 12px}}
/* Kaarten: compactere wereld, zodat bordje, kaart en toetsen dicht bij elkaar staan */
.tf-world.kaarten,.tf-world.kaarten .tf-play{min-height:420px}
.tf-world.kaarten .tf-card{height:110px;width:min(100%,260px)}
.tf-world.kaarten .tf-q{font-size:2.6rem}

/* v0.7: legenda = de toestanden op de kaart, in de volgorde waarin ze verschijnen (B3) */
.tf-legend{display:flex;flex-wrap:wrap;gap:6px 14px;align-items:center}
.tf-legend span{display:inline-flex;align-items:center}
.tf-sw{display:inline-grid;width:24px;height:24px;padding:3px;border-radius:7px;background:#1F4D38;margin-right:6px;flex:none}
/* v0.7: tussenstap in één venster (B1). Het bos wordt een smalle strook; de stenen of de kaart wachten even; de uitleg is groot. */
.tf-world.stap,.tf-world.stap .tf-play{min-height:0}
.tf-world.stap .tf-play{padding:6px 12px 56px;gap:8px;grid-template-rows:auto auto auto}
.tf-world.stap .tf-scene{display:none}
.tf-world.stap .tf-hero{margin-top:26px;font-size:clamp(2rem,8vw,2.6rem);padding:6px 20px 8px}
.tf-world.stap .tf-rooster{max-width:230px;gap:4px}
.tf-world.stap .tf-wezen,.tf-world.stap .tf-gras{display:none}
.tf-jumps span{font-size:1.3rem;padding:4px 12px}
.tf-world.stap .tf-chain{font-size:1.6rem}

.sp-board{display:grid;gap:14px}
.sp-frame{font-family:var(--pl-display);font-weight:600;font-size:clamp(1.8rem,6vw,2.6rem);margin:0;line-height:1.15}
.sp-frame b{color:var(--pl-leaf)}
.sp-gap{color:var(--pl-lilac)}
.sp-choice{font-size:1.5rem;min-width:9ch}
.sp-in{font:600 1.5rem var(--pl-display);border:2px solid var(--pl-line);border-radius:14px;padding:8px 14px;min-width:0;width:min(100%,14ch);background:var(--pl-paper)}
.sp-step{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.sp-step:empty{display:none}
.sp-grepen{display:flex;align-items:center;gap:10px;font-family:var(--pl-display);font-weight:600;font-size:2rem}
.sp-grepen span:not(.sp-bar){background:var(--pl-violet-soft);border-radius:12px;padding:4px 14px}
.sp-bar{width:3px;height:1.4em;background:var(--pl-honey);border-radius:2px}
.sp-head{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}



.eu-stage{border-radius:var(--pl-r-card);overflow:hidden;background:var(--pl-sea);height:min(60vh,560px);border:1px solid var(--pl-line)}
#eu-map{width:100%;height:100%;display:block;touch-action:manipulation;user-select:none;-webkit-user-select:none}
.eu-sea{fill:var(--pl-sea)}
.eu-bg{fill:#E3DDEF;stroke:#C9C1DD;stroke-width:.6;vector-effect:non-scaling-stroke}
.eu-land{fill:#E3DDEF;stroke:#B4ABCC;stroke-width:.8;vector-effect:non-scaling-stroke;cursor:pointer;transition:fill .25s}
.eu-land.eu-in{fill:var(--pl-surface)}
.eu-land.eu-ok,.eu-dot.eu-ok{fill:var(--pl-leaf)}
.eu-land.eu-target,.eu-dot.eu-target{fill:var(--pl-violet)}
.eu-land.eu-buur,.eu-dot.eu-buur{fill:var(--pl-honey-soft);stroke:var(--pl-honey);stroke-width:2.5}
.eu-land.eu-mis,.eu-dot.eu-mis{fill:var(--pl-mist)}
.eu-pulse{stroke:var(--pl-violet)!important;stroke-width:4!important;animation:eu-p 1s ease-in-out infinite}
@keyframes eu-p{50%{stroke-opacity:.2}}
.eu-dot{fill:var(--pl-surface);stroke:var(--pl-ink);stroke-width:1.4;vector-effect:non-scaling-stroke;cursor:pointer}
.eu-lbl{font-family:var(--pl-display);font-weight:600;fill:var(--pl-ink);stroke:#fff;stroke-width:4px;stroke-linejoin:round;paint-order:stroke;pointer-events:none;text-anchor:middle;dominant-baseline:middle}
.eu-lbl.mis{fill:var(--pl-ink-soft)}
.eu-lbl.buur{fill:#8A5A0B}
#eu-opts:empty{display:none}
.eu-stage.b{height:min(44vh,440px)}

</style>

<script>
/* Leeratelier kern v0.6
   Eén motor voor alle trainingen. Trainingen leveren alleen stenen (generatoren) en een werkvlak.
   De kern regelt: startscherm, rondes, stille diagnose, twee verborgen hefbomen (moeilijkheid, herhaling),
   faden van het model, feedback, uitleg-moment, tuin, ouderscherm, materiaalpakketten en het logboek.
   Nieuw in v0.6: leuk/gewoon/pittig met een reden die iets verandert, uitlegvormen die gemeten worden
   (lukte de vraag na de uitleg?), en zinnen uit bouwstenen met variabelen uit de sessie.
   v0.7 (na de UX-doorloop van 14 oktober): een sessie telt pas bij een afgeronde ronde; een tussenstap toont het antwoord
   niet (anders meldt de training "revealed" en telt het niet voor de uitlegmeting); teksten volgen uit de stand; het eindscherm
   zegt wat de volgende ronde wordt en waarom; één schermindeling voor een ronde (vraag, hulp en invoer in één venster). */
(function(){
"use strict";
const PL = window.PL = {};
PL.VERSION = "v0.7";
const $ = id => document.getElementById(id);
const esc = s => String(s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const shuffle = a => { a = a.slice(); for (let i = a.length - 1; i > 0; i--){ const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
const pick = a => a[Math.floor(Math.random() * a.length)];
const rnd = (a, b) => a + Math.floor(Math.random() * (b - a + 1));
const sleep = ms => new Promise(r => setTimeout(r, ms));
const today = () => new Date().toISOString().slice(0, 10);
const dayNum = iso => Math.floor(Date.parse(iso + "T12:00:00Z") / 864e5);
function weekKey(iso){ const d = new Date(iso + "T12:00:00"); const day = (d.getDay() + 6) % 7; d.setDate(d.getDate() - day); return d.toISOString().slice(0, 10); }
const median = a => { if (!a.length) return null; const s = a.slice().sort((x, y) => x - y); const m = s.length >> 1; return s.length % 2 ? s[m] : (s[m - 1] + s[m]) / 2; };
const noEmoji = s => String(s || "").replace(/[\p{Extended_Pictographic}\u{FE0F}]/gu, "").replace(/\s+/g, " ").trim();
Object.assign(PL, {$, esc, shuffle, pick, rnd, sleep, today, median});
/* een sessie is trainen pas als er minstens één ronde is afgemaakt (A1); een gestarte en verlaten poging staat alleen in het logboek */
const realSessions = d => ((d && d.sessions) || []).filter(s => (s.rounds || 0) > 0);
PL.realSessions = realSessions;

/* ---------- parameters uit het onderzoek (zie kennis/06) ---------- */
const P = {
  roundSize: 6, warm: 2,                 // 2 opwarmers uit groene stof, 4 uit de huidige steen
  fluentMs: 3000,                        // vlot = goed in één keer binnen 3 s (na typ-correctie)
  powerWindow: 5, powerNeed: 4,          // beheersing: 4 van de laatste 5 goed in één keer
  speedWindow: 6,                        // tempo: mediaan van de laatste 6 goede antwoorden ≤ fluentMs
  promoteFirst: 5,                       // ronde met ≥5/6 in één keer → stapje verder (als steen groen is)
  demoteSteps: 3,                        // ronde met ≥3 tussenstappen → stapje terug
  cooldownRounds: 1,                     // na een stap eerst één ronde rust
  holdRounds: 2,                         // na een stapje terug slaat de stille diagnose 2 rondes niets over (anders is de stap meteen ongedaan)
  review: [2, 5, 12, 30],                // herhaalchecks in dagen
  requeueAfter: 3,                       // na een tussenstap komt het item 3 vragen later terug
  wheel: 10,                             // 10 vragen zonder 3 goed op rij → stap terug
  sessionMin: 15,
  maxEvents: 3000
};
PL.P = P;

/* ---------- het merkteken ---------- */
PL.flower = function(petals, opts){
  opts = opts || {}; const n = 5, on = Math.max(0, Math.min(n, petals));
  let s = `<svg viewBox="0 0 58 70" aria-hidden="true">`;
  if (opts.stem !== false) s += `<path d="M29 40 V68" stroke="#2F8F5E" stroke-width="3" stroke-linecap="round"/><path d="M29 58 C 36 52, 44 54, 46 50 C 40 49, 33 51, 29 56" fill="#2F8F5E"/>`;
  for (let i = 0; i < n; i++){
    const a = (i / n) * Math.PI * 2 - Math.PI / 2, cx = 29 + Math.cos(a) * 11, cy = 24 + Math.sin(a) * 11;
    s += `<ellipse cx="${cx.toFixed(1)}" cy="${cy.toFixed(1)}" rx="8" ry="11" transform="rotate(${(a * 180 / Math.PI + 90).toFixed(0)} ${cx.toFixed(1)} ${cy.toFixed(1)})" fill="${i < on ? "#B9A8F2" : "#E4DEF3"}"/>`;
  }
  return s + `<circle cx="29" cy="24" r="6.5" fill="#6F55D9"/></svg>`;
};

/* ---------- opslag ---------- */
async function makeStore(){
  try {
    if (window.storage && typeof window.storage.get === "function" && typeof window.storage.set === "function"){
      return { kind: "Claude-opslag (chat)", persist: true,
        async load(k){ try { const r = await window.storage.get(k); const v = r && typeof r === "object" ? r.value : r; return v ? JSON.parse(v) : null; } catch(e){ return null; } },
        async save(k, obj){ await window.storage.set(k, JSON.stringify(obj)); } };
    }
  } catch(e){}
  try {
    if (window.claude && typeof window.claude.use === "function"){
      const [db, user] = await Promise.all([window.claude.use("db"), window.claude.use("user")]);
      const uid = db && user && typeof user.id === "function" ? await user.id() : null;
      if (db && uid) return { kind: "Claude-opslag (gepubliceerd)", persist: true,
        async load(k){ try { const s = await db.doc(`data/users/${uid}/${k}`).get(); return s.exists ? JSON.parse(s.data().json) : null; } catch(e){ return null; } },
        async save(k, obj){ await db.doc(`data/users/${uid}/${k}`).set({json: JSON.stringify(obj)}); } };
    }
  } catch(e){}
  try {
    localStorage.setItem("pl-test", "1"); localStorage.removeItem("pl-test");
    return { kind: "browser (alleen dit apparaat)", persist: true,
      async load(k){ try { return JSON.parse(localStorage.getItem(k)); } catch(e){ return null; } },
      async save(k, obj){ try { localStorage.setItem(k, JSON.stringify(obj)); } catch(e){} } };
  } catch(e){}
  const mem = {};
  return { kind: "alleen deze sessie", persist: false, async load(k){ return mem[k] || null; }, async save(k, obj){ mem[k] = JSON.parse(JSON.stringify(obj)); } };
}

/* ---------- Claude aanroepen (alleen bemoediging; nooit rekenen) ---------- */
let aiFn = null, aiKind = "niet beschikbaar", aiOff = false;
async function detectAI(){
  try {
    const c = window.claude;
    if (c && typeof c.complete === "function"){ aiKind = "Claude (chat)"; aiFn = async p => { const r = await c.complete(p); return typeof r === "string" ? r : (r && (r.text || r.completion)) || ""; }; return; }
    if (c && typeof c.use === "function"){ const s = await c.use("sample"); if (s){ aiKind = "Claude (gepubliceerd)"; aiFn = async p => (await s(p, {modelTier: "quick", cache: false})).text; } }
  } catch(e){}
}
const FORBIDDEN = /\b(niveau|groep \d|groep|cijfer|score|punten|fout|fouten|makkelijk|moeilijk|simpel|slim|dom|zwak|slecht|beter dan|sneller dan|leeftijd|jaar oud)\b/i;
PL.FORBIDDEN = FORBIDDEN;
PL.ai = async function(prompt){
  if (!aiFn || aiOff) return null;
  try { const t = noEmoji(await aiFn(prompt)); if (!t || FORBIDDEN.test(t)) return null; return t.slice(0, 320); }
  catch(e){ const code = e && e.code; if (["not_granted", "sampling_disabled", "not_declared", "capability_disabled"].includes(code)){ aiOff = true; aiKind = "uitgezet door de kijker"; } return null; }
};

PL.canSay = (() => { try { return "speechSynthesis" in window; } catch(e){ return false; } })();
PL.say = function(text){
  if (!PL.canSay) return;
  try { speechSynthesis.cancel(); const u = new SpeechSynthesisUtterance(text); u.lang = "nl-NL"; u.rate = 0.85;
    const v = speechSynthesis.getVoices().find(v => v.lang && v.lang.toLowerCase().startsWith("nl")); if (v) u.voice = v; speechSynthesis.speak(u); } catch(e){}
};

const AGAIN = ["Nog een keer: zo leer je het echt.", "Goed plan. Elke ronde maakt het steviger.", "Daar gaan we weer. Nieuwe ronde.", "Herhalen is trainen. Net als bij ballet."];

/* ---------- de stem in code: zinnen uit bouwstenen met variabelen (kennis/08) ----------
   Na een ronde verzamelt de motor waarnemingen: wat gebeurde er precies? Elke waarneming heeft een gewicht en twee of
   drie varianten. Gekozen worden de zwaarste die niet net gebruikt zijn: hooguit twee zinnen, plus "nog een keer".
   Waarom zo: procesfeedback over wat ze deed (Mueller & Dweck 1998), concreet en specifiek (Hattie & Timperley 2007),
   en herhaling van dezelfde zin slijt. Alle zinnen gaan door de verboden-woordenfilter (tests/dialoog.js). */
const cap1 = t => t ? t.charAt(0).toUpperCase() + t.slice(1) : t;
const ORD = ["", "eerste", "tweede", "derde", "vierde", "vijfde", "zesde", "zevende", "achtste", "negende", "tiende"];
const lst = a => a.length < 2 ? (a[0] || "") : a.slice(0, -1).join(", ") + " en " + a[a.length - 1];
const OBS = {
  explHelp: {w: 10, v: [f => `Bij ${f.L} ${f.Mpl ? "hielpen" : "hielp"} ${f.M}. Even later deed je hem zelf.`, f => `${cap1(f.L)} ging eerst met ${f.M} erbij. Toen hij terugkwam, wist je hem.`]},
  reqOk:    {w: 9, v: [f => `Bij ${f.L} nam je een tussenstap. Even later deed je hem zelf.`, f => `${cap1(f.L)} ging eerst via een tussenstap. Toen hij terugkwam, wist je hem.`, f => `Bij ${f.L} hielp de tussenstap: de tweede keer deed je hem zelf.`]},
  newKnown: {w: 8, v: [f => `Nieuw: ${f.K} ${f.k > 1 ? "gaan" : "gaat"} nu vanzelf.`, f => `${cap1(f.K)} ${f.k > 1 ? "gaan" : "gaat"} sinds deze ronde vanzelf.`]},
  switch:   {w: 8, v: [() => `Je vroeg om een andere uitleg. Dat kun je aan elke AI ook vragen.`, () => `Je zei dat de uitleg niet hielp, en kreeg een andere. Zo werkt goed vragen.`]},
  dueOk:    {w: 6, v: [f => `${cap1(f.D)} kwam terug van een vorige keer, en je wist hem meteen. Zo werkt herhalen.`, f => `${cap1(f.D)} had je een tijdje niet gezien. Hij zat er nog.`]},
  step:     {w: 6, v: [f => `Bij ${f.L} nam je een tussenstap, en daarna vond je het zelf. Zo werkt trainen.`, f => `${cap1(f.L)} deed je via een tussenstap. Die weg heb je straks niet meer nodig.`]},
  adjOk:    {w: 5, v: [f => ({veel: "Met de extra opwarmers ging het rustiger.", snel: "Rustiger aan werkte: je nam de tijd die je nodig had.", lang: "Een korte ronde is ook een ronde.", uitleg: `De andere uitleg, ${f.M}, heb je gebruikt.`})[f.adj] || ""]},
  reqStill: {w: 5, v: [f => `${cap1(f.L)} kwam twee keer langs met een tussenstap. Hij komt nog eens terug; zo wordt hij van jou.`, f => `Bij ${f.L} heb je de tussenstap twee keer gezet. Volgende keer komt hij weer, met dezelfde hulp.`]},
  fluent:   {w: 5, v: [f => `${f.fl} ${f.noun} wist je meteen, zonder te hoeven denken. Dat is wat trainen doet.`, f => `De meeste ${f.noun} kwamen meteen, zonder tellen.`]},
  wise:     {w: 4, v: [f => `Ik geef je deze ${f.noun} omdat ik weet dat je ze kunt leren. Elke tussenstap laat zien dat het gebeurt.`]},
  allSelf:  {w: 3, v: [f => `Je deed ${f.n} ${f.noun} achter elkaar zelf, tot en met ${f.last}.`, f => `Alles in deze ronde deed je zelf, tot en met ${f.last}.`]},
  roundN:   {w: 2, v: [f => `Dit is al je ${ORD[f.r] || f.r + "e"} ronde vandaag.`, f => `Je ${ORD[f.r] || f.r + "e"} ronde vandaag. Je bleef erbij.`]}
};
const GROUPS = [["explHelp", "reqOk", "step", "reqStill"], ["fluent", "allSelf"]];
const AGAIN_END = ["En je koos zelf voor nog een keer.", "Nog een keer was jouw keuze. Dat is trainen.", "En deze ronde koos je zelf."];
/* f: waarnemingen van één ronde. recent: lijst "soort:variant" van de laatste eindschermen. Geeft {text, used}. */
PL.compose = function(f, recent){
  recent = recent || [];
  const recentKinds = recent.map(x => x.split(":")[0]);
  const have = Object.keys(OBS).filter(k => f.has[k]);
  const pickKinds = have.map(k => [k, OBS[k].w - (recentKinds.slice(-6).includes(k) && OBS[k].w < 8 ? 4 : 0) - (recentKinds.slice(-2).includes(k) ? 2 : 0)])
    .sort((a, b) => b[1] - a[1]).map(x => x[0]);
  const chosen = [];
  for (const k of pickKinds){
    if (chosen.length >= 2) break;
    // per groep hooguit één zin: over de tussenstap, of over "alles zelf"
    const grp = GROUPS.find(g => g.includes(k)); if (grp && chosen.some(c => grp.includes(c))) continue;
    chosen.push(k);
  }
  const used = [], parts = [];
  for (const k of chosen){
    const vs = OBS[k].v; let i = vs.findIndex((_, j) => !recent.includes(k + ":" + j)); if (i < 0) i = Math.floor(Math.random() * vs.length);
    const t = vs[i](f); if (t){ parts.push(t); used.push(k + ":" + i); }
  }
  if (f.again){ const i = (recent.filter(x => x.startsWith("again:")).length) % AGAIN_END.length; parts.push(AGAIN_END[i]); used.push("again:" + i); }
  // kort houden: hooguit vier zinnen; anders valt de tweede waarneming weg
  const sentences = a => (a.join(" ").match(/[.!?](\s|$)/g) || []).length;
  if (parts.length > 1 && sentences(parts) > 4 && !used[1].startsWith("again")){ parts.splice(1, 1); used.splice(1, 1); }
  return {text: parts.join(" "), used};
};

/* ---------- leuk, gewoon, pittig: en waarom ----------
   Een reactie zonder reden is een ijdel getal. De reden wordt afgezet tegen wat de motor zag (in één keer, tussenstappen,
   lukte de vraag na de uitleg, tempo) en verandert iets in de volgende ronde. Zij hoort wat er verandert; dat is ook AI-begrip:
   wat je vertelt, verandert wat er daarna gebeurt. Kinderen schatten zichzelf vaak te rooskleurig in (Destan & Roebers 2015;
   Knoll e.a. 2017), dus het ouderscherm zet gevoel en meting naast elkaar en trekt geen conclusie uit één keer. */
PL.REASONS = {
  leuk: {q: "Wat maakte het leuk?", opts: [["lukte", "Het lukte"], ["snapte", "Ik snapte het"], ["spel", "Het spel"], ["kiezen", "Zelf kiezen"], ["weet", "Weet ik niet"]]},
  pittig: {q: "Wat maakte het pittig?", opts: [["veel", "Veel lukte niet meteen"], ["uitleg", "Ik snapte de uitleg niet"], ["snel", "Het ging te snel"], ["lang", "Het duurde lang"], ["weet", "Weet ik niet"]]}
};
/* m: meting van de ronde {fr: aandeel in één keer, steps, reqN, reqOk, switches, mode, nextMode, modeName, nextName, hasModes, form} */
PL.reasonReply = function(react, why, m){
  const ok = m.fr >= 0.67, low = m.fr < 0.5;
  if (react === "leuk"){
    if (why === "lukte") return ok ? "Dat zag ik ook: de meeste kwamen meteen." : "Fijn dat het zo voelde. Je nam ook een paar tussenstappen; die horen erbij.";
    if (why === "snapte") return m.modeName && m.reqOk ? `Dan onthoud ik dat ${m.modeName} bij jou ${m.pl ? "werken" : "werkt"}.` : "Fijn. Snappen maakt het onthouden lichter.";
    if (why === "spel") return `Dat onthoud ik. Je kiest de vorm altijd zelf; vandaag was het ${m.form}.`;
    if (why === "kiezen") return "Zo werkt het hier ook: jij kiest wat en hoe, ik kies de volgorde.";
    return "Dat mag. Soms weet je het pas later.";
  }
  if (react === "pittig"){
    if (why === "veel") return (low ? "Dat zag ik ook." : "Er lukte toch veel meteen; pittig en lukken kan samen.") + " De volgende ronde begin ik met meer uit wat al lukt.";
    if (why === "uitleg") return m.hasModes ? `Dank je, dat helpt mij. De volgende keer leg ik het anders uit: met ${m.nextName}.` : "Dank je. Dat schrijf ik op, zodat er een andere uitleg kan komen.";
    if (why === "snel") return "Dan doe ik het rustiger: de hulp blijft langer staan en er zit meer tijd tussen de vragen.";
    if (why === "lang") return "Dan maak ik de volgende ronde korter. Kort is ook trainen.";
    return "Dat mag. Pittig is niet erg; zo voelt trainen soms.";
  }
  return "";
};
/* wat de reden verandert: een aanpassing voor de volgende ronde(s); de lat (beheersing, tempo) zakt nooit */
PL.adjustFor = function(react, why, m){
  if (react !== "pittig") return null;
  if (why === "veel") return {kind: "veel", left: 1};
  if (why === "snel") return {kind: "snel", left: 3};
  if (why === "lang") return {kind: "lang", left: 1};
  if (why === "uitleg" && m.hasModes) return {kind: "uitleg", left: 1, mode: m.nextMode};
  return null;
};
/* voor het ouderscherm: klopt het gevoel met de meting? Alleen een etiket per keer; patronen pas over weken. */
PL.classifyReact = function(e){
  const fr = e.fr == null ? null : e.fr;
  if (e.react === "gewoon") return "gewoon";
  if (!e.why) return e.react + " zonder reden";
  if (e.react === "leuk"){
    if (e.why === "lukte") return fr != null && fr >= 0.67 ? "leuk omdat het lukte (klopt met meting)" : "leuk omdat het lukte, meting: veel tussenstappen";
    return "leuk om een andere reden dan lukken (" + e.why + ")";
  }
  if (e.why === "veel") return fr != null && fr < 0.5 ? "pittig door veel tussenstappen (klopt met meting)" : "voelde pittig terwijl veel lukte (inspanning of onzekerheid)";
  if (e.why === "uitleg") return e.re > 0 ? "uitleg landde niet (na de uitleg opnieuw een tussenstap)" : e.sw > 0 ? "uitleg landde niet (vroeg om een andere)" : "uitleg niet gesnapt, meting: vraag erna lukte wel";
  if (e.why === "snel") return "tempo voelde te hoog";
  if (e.why === "lang") return "ronde voelde lang";
  return "pittig, reden onbekend";
};

/* ---------- uitlegvormen: welke uitleg helpt bij deze steen? ----------
   Begrip meten we aan gedrag, niet aan een label: een uitleg "landt" als dezelfde vraag even later in één keer lukt.
   Nog niet geprobeerde vormen eerst (in de volgorde van de training), daarna de vorm met de beste (ok+1)/(n+2), met af en toe
   een andere (15 %), zodat één slechte dag een vorm niet voorgoed wegzet. "Anders uitleggen" en "ik snapte de uitleg niet"
   tellen als niet geland. Leerstijlen bestaan hier als observatie per steen, nooit als label (Pashler e.a. 2008). */
PL.chooseExpl = function(modes, stats, avoid, rand){
  rand = rand == null ? Math.random() : rand;
  stats = stats || {};
  let cand = modes.filter(m => m !== avoid); if (!cand.length) cand = modes.slice();
  const untried = cand.filter(m => !stats[m] || !((stats[m].ok || 0) + (stats[m].no || 0)));
  if (untried.length) return untried[0];
  const sc = m => ((stats[m].ok || 0) + 1) / ((stats[m].ok || 0) + (stats[m].no || 0) + 2);
  const best = cand.slice().sort((a, b) => sc(b) - sc(a))[0];
  if (rand < 0.15 && cand.length > 1){ const others = cand.filter(m => m !== best); return others[Math.floor(rand / 0.15 * others.length) % others.length]; }
  return best;
};

/* ---------- begroeting: tijd van de dag, hoe lang geleden, wat vorige keer veranderde ---------- */
PL.greet = function(o){
  // o: {first, hour, daysSince, adjust, adjName, due}
  const title = o.first ? "Hallo Natalia" : o.hour >= 5 && o.hour < 12 ? "Goedemorgen" : o.hour >= 18 ? "Goedenavond" : "Welkom terug";
  const parts = [];
  if (o.adjust) parts.push(({veel: "Vorige keer was het pittig. Ik begin daarom met meer uit wat al lukt.", snel: "Vorige keer ging het te snel. Ik doe het nu rustiger.", lang: "Vorige keer duurde het lang. De eerste ronde is korter.", uitleg: `Vorige keer hielp de uitleg niet. Ik probeer nu ${o.adjName || "een andere manier"}.`})[o.adjust] || "");
  if (!o.first && o.daysSince != null){
    if (o.daysSince === 0) parts.push("Je trainde vandaag al. Fijn dat je terug bent.");
    else if (o.daysSince === 1) parts.push("Gisteren trainde je ook. Vaak een beetje helpt het meest.");
    else if (o.daysSince < 7) parts.push("Een paar dagen rust. We beginnen met iets wat vorige keer lukte.");
    else parts.push("Het is even geleden. De basis komt eerst terug, net als bij ballet.");
  }
  if (o.due && parts.length < 2) parts.push("Er staat iets klaar om te herhalen.");
  return {title, note: parts.filter(Boolean).slice(0, 2).join(" ")};
};
PL._cap = cap1; PL._lst = lst;

      ${PL.face ? `<img class="pl-hero-img" src="${PL.face}" alt="">` : ""}
    </div>

      <div class="pl-row" style="justify-content:space-between"><span class="pl-eyebrow">Vandaag</span><span class="pl-note">${P.sessionMin} min</span></div>
      <h2 class="pl-h2" style="margin:0">${esc(last.title)}</h2>
