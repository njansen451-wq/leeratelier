/* ---------- één training ---------- */
PL.start = async function(T, opts){
  opts = opts || {};
  const app = $("pl-app");
  app.innerHTML = `
  <header class="pl-top">
    <button class="pl-logo" id="pl-logo" type="button" aria-label="Leeratelier">${PL.flower(5, {stem: false})}</button>
    <div class="pl-title"><h1>${esc(T.title)}</h1><p class="pl-helps">Je oefent: ${esc(T.practices || T.helps)}</p></div>
    <div class="pl-topbtns">${trainings.length > 1 ? `<button class="pl-garden-btn" id="pl-home-btn" type="button">Home</button>` : ""}
    <button class="pl-garden-btn" id="pl-garden-btn" type="button">Laat zien</button></div>
  </header>
  <section class="pl-screen" id="pl-screen"></section>
  <div class="pl-foot" id="pl-foot">${esc(T.title)} ${esc(T.version)} · Leeratelier ${PL.VERSION}</div>
  <div class="pl-parent" id="pl-parent" hidden></div>`;
  const screen = $("pl-screen");
  const KEY = "philearn-" + T.id;
  const base = {v: 3, stage: 1, items: {}, stones: {}, sessions: [], events: [], forms: {A: {rounds: 0, again: 0}, B: {rounds: 0, again: 0}}, lastForm: "A", cooldown: 0, hold: 0, lastPlayed: "",
    expl: {}, explPending: {}, adjust: null, lines: []};
  const data = Object.assign(base, (await store.load(KEY)) || {});
  data.forms = Object.assign({A: {rounds: 0, again: 0}, B: {rounds: 0, again: 0}}, data.forms || {});
  data.stones = data.stones || {}; data.events = data.events || [];
  data.expl = data.expl || {}; data.explPending = data.explPending || {}; data.lines = data.lines || [];
  // v0.7-omzetting: verlaten pogingen (0 rondes) zijn geen sessies (A1); de uitlegmeting uit trainingen waarvan de tussenstap
  // het antwoord toonde (A2) wordt niet meegenomen
  data.sessions = realSessions(data);
  if ((data.v || 2) < 3){ if (["werkwoorden", "europa", "spelling-een-of-twee", "zinnen"].includes(T.id)){ data.expl = {}; data.explPending = {}; } data.v = 3; }
  const lastReal = data.sessions[data.sessions.length - 1];
  const prevPlayed = lastReal ? lastReal.d : "";
  if (T.loadContent) T.loadContent(content.packs.filter(p => p.training === T.id));
  const S = {d: today(), t0: Date.now(), min: 0, rounds: 0, again: 0, steps: 0, first: 0, items: 0, forms: [], react: {leuk: 0, gewoon: 0, pittig: 0}, why: {}};
  let sessionAdded = false, form = data.lastForm || "A", lastRound = null, factShown = false, wheelRun = 0, wheelCount = 0, custom = null;
  let wiseShown = false, aiNoteShown = false, roundAdj = null, tried = null;
  let runId = 0, inRound = false;   // een ronde die verlaten wordt, krijgt een nieuw runId; de oude lus stopt dan vanzelf

  function save(){
    S.min = Math.max(1, Math.round((Date.now() - S.t0) / 60000));
    if (!sessionAdded && S.rounds > 0){ data.sessions.push(S); sessionAdded = true; }
    if (data.sessions.length > 200) data.sessions = data.sessions.slice(-200);
    if (data.events.length > P.maxEvents) data.events = data.events.slice(-P.maxEvents);
    if (S.rounds > 0) data.lastPlayed = new Date().toISOString();
    saving = saving.then(() => store.save(KEY, data)).catch(() => {});
    return saving;
  }
  const log = ev => { data.events.push(Object.assign({t: new Date().toISOString().slice(0, 19), tr: T.id}, ev)); };

  /* --- stenen: beheersing (power) en tempo (speed) per steen --- */
  const stone = id => data.stones[id] || (data.stones[id] = {hist: [], rts: [], power: false, speed: false, n: 0});
  function updateStone(id, first, rt){
    const s = stone(id); s.n++;
    s.hist.push(first ? 1 : 0); if (s.hist.length > P.powerWindow) s.hist.shift();
    if (first && rt != null){ s.rts.push(rt); if (s.rts.length > P.speedWindow) s.rts.shift(); } else if (s.rts.length) s.rts.shift();
    const okCount = s.hist.reduce((a, b) => a + b, 0);
    s.power = s.hist.length >= P.powerWindow && okCount >= P.powerNeed;
    s.speed = s.power && s.rts.length >= P.speedWindow && median(s.rts) <= P.fluentMs;
  }
  const green = id => stone(id).power && stone(id).speed;

  /* --- items: vlotheid en herhaalschema --- */
  const rec = key => data.items[key] || {n: 0, ok1: 0, st: 0, fl: 0, iv: 0, rts: []};
  function updateItem(key, first, step, rt){
    const r = data.items[key] || (data.items[key] = {n: 0, ok1: 0, st: 0, fl: 0, iv: 0, rts: []});
    r.n++; if (first) r.ok1++; if (step) r.st++;
    r.rts = (r.rts || []).concat(rt != null ? [rt] : []).slice(-5);
    const fluent = first && rt != null && rt <= P.fluentMs;
    r.last = first ? "ok" : "step"; r.d = today();
    if (fluent){ r.fl++; r.iv = Math.min(P.review.length - 1, (r.iv || 0) + (r.fl >= 2 ? 1 : 0)); r.due = dayNum(today()) + P.review[r.iv]; }
    else if (!first){ r.fl = 0; r.iv = Math.max(0, (r.iv || 0) - 1); r.due = dayNum(today()) + 1; }
    return fluent;
  }
  const known = key => { const r = data.items[key]; return !!r && r.fl >= 2 && r.last === "ok"; };
  const due = key => { const r = data.items[key]; return !!r && r.due != null && r.due <= dayNum(today()); };

  const ctx = {
    T, data, P, sleep, shuffle, pick, rnd, esc, say: PL.say, canSay: PL.canSay, log,
    get form(){ return form; }, get stage(){ return data.stage; },
    // tempo van de hulp: "rustig" na "het ging te snel" (langer model, langere adempauze); de lat zelf zakt niet
    get pace(){ return roundAdj && roundAdj.kind === "snel" ? "rustig" : ""; },
    get flashMs(){ return roundAdj && roundAdj.kind === "snel" ? 4200 : 2500; },
    get nudgeMs(){ return roundAdj && roundAdj.kind === "snel" ? 12000 : 8000; },
    /* uitlegvormen (alleen als de training T.explainModes heeft): kies, wissel, en geef de namen */
    explainMode(stoneId){
      const modes = T.explainModes || ["standaard"]; const st = data.expl[stoneId] || {};
      const forced = roundAdj && roundAdj.kind === "uitleg" && roundAdj.st === stoneId && modes.includes(roundAdj.mode) ? roundAdj.mode : null;
      return forced || PL.chooseExpl(modes, st, st.avoid);
    },
    explainSwitch(stoneId, from){
      const modes = T.explainModes || ["standaard"]; const st = data.expl[stoneId] || (data.expl[stoneId] = {});
      const m = st[from] || (st[from] = {ok: 0, no: 0, sw: 0}); m.no++; m.sw = (m.sw || 0) + 1;
      const next = modes[(modes.indexOf(from) + 1) % modes.length];
      log({switch: 1, st: stoneId, from, to: next}); return next;
    },
    modeName: m => (T.explainNames && T.explainNames[m]) || "",
    rec, known, due, stone, green,
    // steunniveau van het model: vol (geen beheersing), flits (beheersing, nog geen tempo), opvraag (tempo)
    support(id){ const s = stone(id); return !s.power ? "vol" : !s.speed ? "flits" : "opvraag"; },
    setAsk(lead, main){ $("pl-ask-lead").textContent = lead || ""; $("pl-ask-main").textContent = main || ""; },
    /* feedback: drie vaste vormen. Tijdens een tussenstap blijft haar eigen antwoord in beeld (C3): fb.tried(waarde). */
    fb: {
      ok(text){ tried = null; $("pl-fb").innerHTML = `<div class="pl-ok"><b>Gelukt</b>${esc(text)}</div>`; },
      step(text){ $("pl-fb").innerHTML = `<div class="pl-step">${tried != null ? `<span class="pl-tried">Jouw antwoord: ${esc(tried)}</span>` : ""}<b>Tussenstap</b>${esc(text)}</div>`; },
      tried(v){ tried = v; },
      note(text){ $("pl-fb").innerHTML = `<p class="pl-note">${esc(text)}</p>`; },
      clear(){ $("pl-fb").innerHTML = ""; }
    }
  };
  PL.ctx = ctx;

  function greeting(){
    const dn = dayNum(today()), last = prevPlayed ? dayNum(prevPlayed.slice(0, 10)) : null;
    const dueN = Object.keys(data.items).filter(k => due(k) && data.items[k].last === "ok").length;
    const a = data.adjust;
    return PL.greet({first: !data.sessions.length, hour: new Date().getHours(), daysSince: last == null ? null : dn - last, adjust: a && a.kind, adjName: a && a.mode ? ctx.modeName(a.mode) : "", due: dueN > 0});
  }
  /* startscherm (C6): de laatst gekozen vorm staat klaar; Start gaat direct naar de eerste vraag; "Andere vorm" klapt de keuze open */
  function showStart(){
    const g = greeting(), chosenBefore = data.sessions.length > 0;
    screen.innerHTML = `
      <div class="pl-card pl-startcard">
        <h2 class="pl-h2">${esc(g.title)}</h2>
        <p class="pl-lead">${esc(T.startText(ctx))}</p>
        ${g.note ? `<p class="pl-note pl-greet">${esc(g.note)}</p>` : ""}
        <div class="pl-row pl-startrow"><button class="pl-btn big" id="pl-go" type="button">Start</button>
          <span class="pl-note" id="pl-formnow">Vorm: ${esc(T.forms[form].name)}</span>
          <button class="pl-help" id="pl-formtoggle" type="button" aria-expanded="${!chosenBefore}" aria-controls="pl-forms">Andere vorm</button></div>
        <div class="pl-forms" id="pl-forms" role="group" aria-label="Kies hoe je traint" ${chosenBefore ? "hidden" : ""}>
          ${["A", "B"].map(f => `<button type="button" class="pl-form" data-form="${f}" aria-pressed="${f === form}"><b>${esc(T.forms[f].name)}</b><span>${esc(T.forms[f].desc)}</span></button>`).join("")}
        </div>
        ${T.startExtra ? T.startExtra(ctx) : ""}
        ${T.practices ? `<p class="pl-note pl-daarna">Je oefent: ${esc(T.practices)}. Daarna helpt het bij: ${esc(T.helps)}.</p>` : ""}
      </div>
      <div class="pl-row"><button class="pl-btn quiet" id="pl-make2" type="button">Bedenk je ronde</button></div>`;
    screen.querySelectorAll(".pl-form").forEach(b => b.addEventListener("click", () => { form = b.dataset.form; data.lastForm = form; $("pl-formnow").textContent = "Vorm: " + T.forms[form].name; screen.querySelectorAll(".pl-form").forEach(x => x.setAttribute("aria-pressed", String(x === b))); }));
    $("pl-formtoggle").addEventListener("click", e => { const f = $("pl-forms"); f.hidden = !f.hidden; e.currentTarget.setAttribute("aria-expanded", String(!f.hidden)); });
    $("pl-go").addEventListener("click", () => { custom = null; playRound(false); });
    $("pl-make2").addEventListener("click", showMake);
  }

  /* --- eigen ronde: Natalia kiest de steen, de vorm en het aantal; de motor kiest de vragen --- */
  /* --- Bedenk je ronde: een gesprek in bouwstenen. Natalia stelt haar vraag zoals je hem aan een AI zou stellen;
         de motor laat zien wat hij begreep, wat hij kiest en waarom, en wat hij niet weet (aannames). Dan: klopt dit? --- */
  const nameOf = id => { const st = T.stones.find(x => x.id === id); return st ? st.name : id; };
  const cap = t => t.charAt(0).toUpperCase() + t.slice(1);
  function stoneState(st, i){ const g = ctx.green(st.id), seen = (data.stones[st.id] || {}).n > 0; const open = i <= data.stage - 1 || (st.requires || []).every(r => ctx.green(r)); const eerst = (st.requires || []).filter(r => !ctx.green(r)).map(nameOf); return {g, seen, open, label: g ? "gaat al vanzelf" : seen ? "ben je mee bezig" : open ? "nog nieuw" : "komt na: " + eerst.join(", ")}; }
  /* De beslisboom van het gesprek. Puur: (antwoorden tot nu toe) → volgende vraag óf het plan met drie denkregels.
     Regels die getest worden (t_tree): een vraag wordt alleen gesteld als er minstens twee antwoorden zijn; wat niet gevraagd
     wordt, staat in de denkregels; elk pad eindigt in een geldig plan (open steen, vorm A/B, 6 of 10 vragen, opwarmer ≠ steen). */
  function planTree(a){
    const stones = T.stones.map((st, i) => Object.assign({st}, stoneState(st, i)));
    const byId = id => stones.find(x => x.st.id === id);
    const idx = id => T.stones.findIndex(x => x.id === id);
    const played = stones.filter(x => x.seen);
    const skipped = [];
    // 1. wat oefenen
    if (a.stoneId == null) return {ask: {q: "Wat wil je oefenen?", key: "stoneId", opts: stones.map(x => ({v: x.st.id, t: cap(x.st.name), sub: x.label, off: !x.open})).concat([{v: "kies", t: "Kies jij maar", sub: "dan zeg ik wat ik koos en waarom"}])}};
    const guessed = a.stoneId === "kies";
    let stoneId = guessed ? T.stones[data.stage - 1].id : a.stoneId;
    let st = byId(stoneId);
    // 2a. groene steen: herhalen of verder (alleen vragen als er een open volgende steen is)
    const next = T.stones[idx(stoneId) + 1]; const nextOpen = next && byId(next.id).open;
    if (!guessed && st.g && nextOpen && a.verder == null) return {ask: {q: `${cap(nameOf(stoneId))} gaat bij jou al vanzelf. Wat wil je?`, key: "verder", opts: [{v: "herhalen", t: "Herhalen", sub: "de basis komt altijd terug"}, {v: "verder", t: "Een stapje verder", sub: cap(nameOf(next.id))}]}};
    if (a.verder === "verder"){ stoneId = next.id; st = byId(stoneId); }
    // 2b. wat gaat al goed: alleen vragen als er iets te kiezen valt (gespeelde stenen vóór deze steen)
    const warmOpts = played.filter(x => x.st.id !== stoneId && idx(x.st.id) < idx(stoneId)).slice(-4);
    if (!guessed && warmOpts.length && a.warmId == null) return {ask: {q: "Wat gaat al goed?", key: "warmId", opts: warmOpts.map(x => ({v: x.st.id, t: cap(x.st.name), sub: x.label})).concat([{v: "niets", t: "Dat weet ik niet", sub: "dan kies ik iets wat vorige keer lukte"}])}};
    if (guessed) skipped.push("goedKies"); else if (!warmOpts.length) skipped.push("goedLeeg");
    // 3. hoe, 4. hoeveel
    if (a.form == null) return {ask: {q: "Hoe wil je het doen?", key: "form", opts: ["A", "B"].map(f => ({v: f, t: T.forms[f].name, sub: T.forms[f].desc}))}};
    if (a.n == null) return {ask: {q: "Hoeveel tijd heb je?", key: "n", opts: [{v: 6, t: "Kort", sub: "6 vragen"}, {v: 10, t: "Wat langer", sub: "10 vragen"}]}};
    // het plan
    const warmId = a.warmId && a.warmId !== "niets" ? a.warmId : null;
    const n = +a.n, f = a.form;
    const autoWarm = !warmId && warmOpts.length ? warmOpts[warmOpts.length - 1].st.id : null;
    const vraag = `Ik wil ${guessed ? "oefenen, kies jij maar wat" : nameOf(stoneId) + " oefenen"}${a.verder === "verder" ? " (een stapje verder)" : a.verder === "herhalen" ? " (herhalen)" : ""}. ${warmId ? cap(nameOf(warmId)) + " gaat al goed." : a.warmId === "niets" ? "Ik weet niet wat al goed gaat." : ""} Ik wil het doen met ${T.forms[f].name.toLowerCase()}, ${n === 6 ? "kort" : "wat langer"}.`.replace(/\s+/g, " ");
    const begreep = `Je wilt ${guessed ? "oefenen en laat de keuze aan mij" : nameOf(stoneId)}. ${warmId ? `${cap(nameOf(warmId))} gaat al goed, zei je.` : a.warmId === "niets" ? "Wat al goed gaat, weet je zelf niet zeker." : ""} ${T.forms[f].name}, ${n} vragen.`.replace(/\s+/g, " ");
    const warmSrc = warmId || autoWarm;
    // elke bewering hieronder volgt uit de stand (A3): eerste steen, gespeelde stenen, afgeronde rondes
    const firstStone = idx(stoneId) === 0, anyRound = data.sessions.length > 0;
    const kies = warmSrc ? `Ik begin met twee uit ${nameOf(warmSrc)}${warmId ? "" : ", want dat lukte vorige keer"}, als opwarmer. Dan ${n - 2} uit ${nameOf(stoneId)}. Wat niet in één keer lukt, komt drie vragen later terug.`
      : `Alles komt uit ${nameOf(stoneId)}; ${firstStone ? "er is geen steen vóór deze om mee op te warmen" : "de stenen ervoor heb je hier nog niet gespeeld, dus ik warm niet op"}. Wat niet in één keer lukt, komt drie vragen later terug.`;
    const weetNiet = guessed ? `Je zei niet wát je wilt oefenen. Ik koos ${nameOf(stoneId)}, omdat dat de volgende stap is na wat al vanzelf gaat. Bedoel je iets anders, zeg het dan.`
      : skipped.includes("goedLeeg") ? (firstStone ? `Ik vroeg niet wat al goed gaat: er is geen steen vóór ${nameOf(stoneId)}.` : anyRound ? `Ik vroeg niet wat al goed gaat: de stenen vóór ${nameOf(stoneId)} heb je hier nog niet gespeeld.` : `Ik vroeg niet wat al goed gaat: je hebt hier nog geen ronde afgemaakt, dus dat weet ik nog niet.`) + (st.g ? ` ${cap(nameOf(stoneId))} gaat bij jou al vanzelf; herhalen is prima.` : !st.seen ? ` ${cap(nameOf(stoneId))} is nieuw; wat lastig is, merk ik aan je tussenstappen.` : ` Hoe het nu gaat, merk ik aan je tussenstappen.`)
      : st.g ? `${cap(nameOf(stoneId))} gaat bij jou al vanzelf. Herhalen is prima; de basis komt altijd terug.`
      : !st.seen ? `${cap(nameOf(stoneId))} is nieuw voor je. Ik weet nog niet wat daar lastig is; dat merk ik aan je tussenstappen.`
      : `Ik weet niet of je dit vandaag met of zonder hulp wilt. Ik laat de hulp staan tot het vanzelf gaat.`;
    return {plan: {stoneId, warmId: warmSrc, form: f, n, guessed}, vraag, lines: [begreep, kies, weetNiet]};
  }
  PL._planTree = planTree;

  function showMake(){
    const ans = {};
    screen.innerHTML = `
      <div class="pl-card" style="display:grid;gap:12px">
        <div><h2 class="pl-h2">Bedenk je ronde</h2><p class="pl-lead">Kies wat je wilt oefenen; ik laat zien wat ik ervan maak. Zo ziet een duidelijke vraag aan een AI eruit.</p></div>
        <div class="pl-chat" id="pl-chat" aria-live="polite"></div>
      </div>
      <div class="pl-row"><button class="pl-btn quiet" id="pl-make-cancel" type="button">Terug</button></div>`;
    $("pl-make-cancel").addEventListener("click", showStart);
    const chat = $("pl-chat");
    const bubble = (who, html) => { chat.insertAdjacentHTML("beforeend", `<div class="pl-bub ${who}">${html}</div>`); chat.lastElementChild.scrollIntoView({block: "nearest", behavior: "smooth"}); };
    function step(){
      const r = planTree(ans);
      if (r.ask){
        const S = r.ask;
        bubble("ik", esc(S.q));
        // dicht = geen knop (C2): een rustige regel met waarom
        chat.insertAdjacentHTML("beforeend", `<div class="pl-chips" role="group" aria-label="${esc(S.q)}">${S.opts.filter(o => !o.off).map(o => `<button type="button" class="pl-chip" data-v="${esc(String(o.v))}"><b>${esc(o.t)}</b>${o.sub ? `<span>${esc(o.sub)}</span>` : ""}</button>`).join("")}</div>${S.opts.some(o => o.off) ? `<ul class="pl-locked" aria-label="Nog dicht">${S.opts.filter(o => o.off).map(o => `<li><b>${esc(o.t)}</b> ${esc(o.sub || "")}</li>`).join("")}</ul>` : ""}`);
        const rows = chat.querySelectorAll(".pl-chips"), row = rows[rows.length - 1]; const lockedList = row.nextElementSibling && row.nextElementSibling.classList.contains("pl-locked") ? row.nextElementSibling : null;
        row.querySelectorAll(".pl-chip:not([disabled])").forEach(b => b.addEventListener("click", () => { const o = S.opts.find(x => String(x.v) === b.dataset.v); ans[S.key] = o.v; row.remove(); if (lockedList) lockedList.remove(); bubble("jij", esc(o.t)); step(); }));
        row.scrollIntoView({block: "nearest", behavior: "smooth"});
        return;
      }
      const {plan, vraag, lines} = r;
      chat.insertAdjacentHTML("beforeend", `
        <div class="pl-plan">
          <span class="pl-eyebrow">Zo kun je het vragen</span><blockquote class="pl-vraag" id="pl-vraag">${esc(vraag)}</blockquote>
          <span class="pl-eyebrow">Zo denk ik erover</span>
          <dl class="pl-denk" id="pl-denk"><dt>Wat ik begreep</dt><dd>${esc(lines[0])}</dd><dt>Wat ik kies, en waarom</dt><dd>${esc(lines[1])}</dd><dt>Wat ik niet weet</dt><dd>${esc(lines[2])}</dd></dl>
          <p class="pl-note">Een AI gokt als je iets niet zegt. Daarom laat ik zien wat ik aanneem, zodat jij het kunt nakijken.</p>
          <div class="pl-row"><button class="pl-btn big" id="pl-plan-go" type="button">Klopt, start</button><button class="pl-btn quiet" id="pl-plan-edit" type="button">Nee, iets aanpassen</button></div>
        </div>`);
      chat.lastElementChild.scrollIntoView({block: "nearest", behavior: "smooth"});
      $("pl-plan-go").addEventListener("click", () => { custom = plan; form = plan.form; log({make: 1, st: plan.stoneId, warm: plan.warmId || "", f: plan.form, n: plan.n, guess: plan.guessed ? 1 : 0}); playRound(false); });
      $("pl-plan-edit").addEventListener("click", () => { log({make_edit: 1}); showMake(); });
      // haak: als Claude bereikbaar is, mag hij alleen de drie denkregels herschrijven; het plan blijft uit code
      PL.ai(`Je bent het rustige oefenmaatje in het Leeratelier. Herschrijf deze drie regels voor een kind, in het Nederlands, korte zinnen, je-vorm, geen emoji, geen lof, geen cijfers of niveaus. Verander de inhoud niet. Geef precies drie regels terug, gescheiden door een regeleinde.\n1. ${lines[0]}\n2. ${lines[1]}\n3. ${lines[2]}`).then(t => {
        if (!t) return; const ls = t.split(/\n+/).map(x => x.replace(/^\d+[.)]\s*/, "").trim()).filter(Boolean); if (ls.length !== 3) return;
        const dds = document.querySelectorAll("#pl-denk dd"); if (dds.length === 3){ ls.forEach((l, i) => { dds[i].textContent = l; }); const d = $("pl-denk"); if (d) d.insertAdjacentHTML("afterend", `<p class="pl-note">Deze drie regels heeft Claude voor je herschreven; wat erin staat, komt uit de training zelf.</p>`); }
      });
    }
    step();
  }

  /* --- ronde samenstellen: 2 opwarmers (eerst wat aan herhaling toe is), 4 uit de huidige steen --- */
  function composeRound(){
    const stones = T.stones;
    if (custom){
      const st = stones.find(x => x.id === custom.stoneId) || stones[0];
      const items = []; let guard = 0;
      const warmSrc = custom.warmId ? stones.find(x => x.id === custom.warmId) : null;
      if (warmSrc && warmSrc !== st && custom.n >= 6) while (items.length < P.warm && guard++ < 40){ const it = warmSrc.gen(ctx, "warm"); if (it && !items.some(x => x.key === it.key)) items.push(Object.assign(it, {warm: true, stone: warmSrc.id})); }
      guard = 0;
      while (items.length < custom.n && guard++ < 120){ const it = st.gen(ctx, "main"); if (it && !items.some(x => x.key === it.key)) items.push(Object.assign(it, {stone: st.id})); }
      return items;
    }
    if (data.hold > 0) data.hold--;                                                            // na een stapje terug: eerst oefenen, nog niet overslaan
    else while (data.stage < stones.length && green(stones[data.stage - 1].id)) data.stage++;   // stille diagnose
    const cur = stones[data.stage - 1];
    const earlier = stones.slice(0, data.stage - 1);
    const items = [];
    // na "pittig: veel lukte niet meteen" één opwarmer meer; na "pittig: het duurde lang" een kortere ronde
    const kind = roundAdj && roundAdj.kind;
    const warmN = kind === "veel" ? P.warm + 1 : kind === "lang" ? 1 : P.warm;
    const size = kind === "lang" ? 4 : P.roundSize;
    const dueKeys = Object.keys(data.items).filter(k => due(k) && data.items[k].last === "ok");
    for (const k of shuffle(dueKeys).slice(0, warmN)){ const it = T.fromKey(k, ctx); if (it) items.push(Object.assign(it, {warm: true, due: true, stone: T.stoneOf(k, ctx)})); }
    let guard = 0;
    while (items.length < warmN && guard++ < 30){
      const src = earlier.length ? pick(earlier) : cur;
      const it = src.gen(ctx, "warm"); if (!it) break;
      if (!items.some(x => x.key === it.key)) items.push(Object.assign(it, {warm: true, stone: src.id}));
    }
    guard = 0;
    while (items.length < size && guard++ < 60){
      const it = cur.gen(ctx, "main");
      if (it && !items.some(x => x.key === it.key)) items.push(Object.assign(it, {stone: cur.id}));
    }
    return items;
  }

  async function playRound(again){
    const run = ++runId; inRound = true;
    data.lastForm = form;
    // een aanpassing uit een reden van vorige keer geldt voor deze ronde; daarna telt hij af
    roundAdj = data.adjust && data.adjust.left > 0 ? Object.assign({}, data.adjust) : null;
    if (data.adjust){ data.adjust.left--; if (data.adjust.left <= 0) data.adjust = null; }
    const knownBefore = new Set(Object.keys(data.items).filter(k => known(k)));
    // één schermindeling voor een ronde (B1/B2): een werkvlak van hooguit ~600 px in het midden; vraag, hulp en invoer samen in beeld
    screen.innerHTML = `<div class="pl-round" id="pl-round">
      <div class="pl-ask" aria-live="polite"><span class="pl-ask-lead" id="pl-ask-lead"></span><span class="pl-ask-main" id="pl-ask-main"></span></div>
      <div class="pl-dots" id="pl-dots" aria-hidden="true"></div>
      <div class="pl-fb" id="pl-fb" aria-live="polite"></div>
      <div id="pl-work"></div></div>`;
    ctx.work = $("pl-work");
    T.setup(ctx);
    const adjNote = roundAdj ? ({veel: "Ik begin met meer uit wat al lukt.", snel: "Ik doe het rustiger: de hulp blijft langer staan.", lang: "Een kortere ronde nu. Kort is ook trainen.", uitleg: `Bij een tussenstap leg ik het nu uit met ${ctx.modeName(roundAdj.mode) || "een andere manier"}.`})[roundAdj.kind] : "";
    if (again || adjNote) ctx.fb.note([again ? pick(AGAIN) : "", adjNote].filter(Boolean).join(" "));
    const queue = composeRound();
    const cur = custom ? (T.stones.find(x => x.id === custom.stoneId) || T.stones[0]) : T.stones[data.stage - 1];
    const res = {items: [], first: 0, steps: 0, fluent: 0, stoneId: cur.id, stageAtStart: data.stage, reqN: 0, reqOk: 0, hints: 0, switches: 0, modes: {}, rts: [], reqItems: [], adj: roundAdj && roundAdj.kind};
    const total = queue.length;
    $("pl-dots").innerHTML = queue.map(() => `<span class="pl-dot"></span>`).join("");
    let i = 0;
    while (queue.length){
      const item = queue.shift();
      const dots = $("pl-dots").children;
      for (let k = 0; k < dots.length; k++) dots[k].className = "pl-dot" + (k < i ? " done" : k === i ? " now" : "");
      const t0 = performance.now();
      tried = null; PL._item = item;   // alleen voor tests/ux.py (controle: noemt de tussenstap het antwoord?)
      let r;
      try { r = await T.ask(item, ctx); } catch(e){ if (run !== runId) return; console.error(e); r = {first: false, step: false}; }
      if (run !== runId) return;   // de ronde is verlaten
      const rt = Math.max(0, Math.round(performance.now() - t0 - (r.typingMs || 0)));
      const fluent = updateItem(item.key, r.first, r.step, r.first ? rt : null);
      updateStone(item.stone, r.first, r.first ? rt : null);
      log({k: item.key, st: item.stone, f: form, ok1: r.first ? 1 : 0, step: r.step ? 1 : 0, rt, warm: item.warm ? 1 : 0, sup: r.support || "", ex: r.step ? (r.expl || "standaard") : undefined, sw: r.switches || undefined, rev: r.revealed ? 1 : undefined});
      res.items.push({label: item.label, first: r.first, step: r.step, item, rt, requeue: !!item.requeue, expl: r.expl || null});
      if (r.first && rt != null) res.rts.push(rt);
      if (/\+knop|nudge/.test(r.support || "")) res.hints++;
      res.switches += r.switches || 0;
      // begrip van de uitleg: lukt dezelfde vraag even later in één keer?
      // tussenstap-regel (A2): alleen een tussenstap waarin zij het antwoord zelf vond, telt voor "landt de uitleg"
      if (r.step && !item.requeue && !r.revealed){ const m = r.expl || "standaard"; data.explPending[item.key] = {m, st: item.stone}; res.modes[m] = (res.modes[m] || 0) + 1; }
      if (r.revealed) res.revealed = (res.revealed || 0) + 1;
      if (item.requeue){
        res.reqN++; if (r.first) res.reqOk++;
        const p = data.explPending[item.key];
        if (p){ const st = data.expl[p.st] || (data.expl[p.st] = {}); const s_ = st[p.m] || (st[p.m] = {ok: 0, no: 0, sw: 0}); if (r.first) s_.ok++; else s_.no++; delete data.explPending[item.key]; log({land: r.first ? 1 : 0, st: p.st, ex: p.m, k: item.key}); }
        res.reqItems.push({label: item.label, ok: r.first, expl: p ? p.m : null});
      }
      if (!item.requeue){ if (r.first) res.first++; if (r.step) res.steps++; if (fluent) res.fluent++; }
      if (!custom){ wheelRun = r.first ? wheelRun + 1 : 0; wheelCount = wheelRun >= 3 ? 0 : wheelCount + 1; }
      if (!r.first && !item.requeue && queue.length){ queue.splice(Math.min(P.requeueAfter, queue.length), 0, Object.assign({}, item, {requeue: true})); $("pl-dots").insertAdjacentHTML("beforeend", `<span class="pl-dot"></span>`); }
      i++;
      save();
      await sleep((T.pause || 900) * (ctx.pace === "rustig" ? 1.7 : 1));
      if (run !== runId) return;
      ctx.fb.clear();
    }
    inRound = false;
    res.newKnown = [...new Set(res.items.filter(x => x.first && known(x.item.key) && !knownBefore.has(x.item.key)).map(x => x.label))];
    res.dueOk = res.items.filter(x => x.item.due && x.first).map(x => x.label);
    if (T.roundEnd) try { T.roundEnd(ctx, res); } catch(e){}
    // twee verborgen hefbomen: moeilijkheid (stap) en herhaling (spacing, in updateItem)
    let moved = 0;
    if (custom){ /* een eigen ronde telt mee voor beheersing en tempo, maar schuift de trainingsstap niet */ }
    else if (data.cooldown > 0) data.cooldown--;
    else if (res.first >= P.promoteFirst && green(cur.id) && data.stage < T.stones.length){ data.stage++; moved = 1; data.cooldown = P.cooldownRounds; }
    else if (res.steps >= P.demoteSteps && data.stage > 1){ data.stage--; moved = -1; data.cooldown = P.cooldownRounds; }
    if (!custom && wheelCount >= P.wheel && data.stage > 1 && moved === 0){ data.stage--; moved = -1; data.cooldown = P.cooldownRounds; log({wheel: 1, st: cur.id}); }
    if (moved !== 0){ wheelCount = 0; wheelRun = 0; }
    if (moved < 0) data.hold = P.holdRounds;
    S.rounds++; data.lastPlayed = new Date().toISOString(); S.first += res.first; S.steps += res.steps; S.items += total;
    if (!S.forms.includes(form)) S.forms.push(form);
    data.forms[form].rounds++;
    const nMain = res.items.filter(x => !x.requeue).length;
    res.fr = nMain ? res.first / nMain : 0;
    log({round: 1, st: cur.id, f: form, first: res.first, steps: res.steps, fluent: res.fluent, moved, again: again ? 1 : 0, make: custom ? 1 : 0, n: nMain, fr: Math.round(res.fr * 100) / 100, reqN: res.reqN, reqOk: res.reqOk, sw: res.switches, adj: res.adj || undefined});
    res.frBefore = data.lastFr;
    if (res.adj && data.lastFr != null) log({adjResult: res.adj, before: data.lastFr, after: Math.round(res.fr * 100) / 100, st: cur.id});
    data.lastFr = Math.round(res.fr * 100) / 100;
    const facts = roundFacts(res, again);
    const base = PL.compose(facts, data.lines);
    data.lines = data.lines.concat(base.used).slice(-12);
    if (facts.has.wise && base.used.some(u => u.startsWith("wise"))) wiseShown = true;
    lastRound = {res, moved, again, next: nextLine(res, moved, cur), base: base.text || `Je deed ${res.items.length} ${T.noun}, tot en met ${res.items[res.items.length - 1].label}.`};
    await save();
    showEnd(true);
  }

  /* wat de volgende ronde wordt en waarom: dezelfde regels als composeRound, zonder iets te veranderen.
     "Nog een keer" is de knop; deze regel laat zien dat de volgende ronde uit haar resultaten volgt. */
  function nextLine(res, moved, cur){
    if (custom) return `Weer jouw keuze: ${nameOf(custom.stoneId)}, met nieuwe ${T.noun}.`;
    let st = data.stage; if (!(data.hold > 0)) while (st < T.stones.length && green(T.stones[st - 1].id)) st++;
    const next = T.stones[st - 1], s_ = stone(cur.id);
    if (moved > 0) return `Bijna alles kwam meteen en ${nameOf(cur.id)} gaat nu vanzelf. Daarom gaat de volgende ronde een stapje verder: ${next.name}.`;
    if (moved < 0) return `Deze ronde vroeg veel tussenstappen. De volgende gaat eerst terug naar ${next.name}; daarna weer verder.`;
    if (next.id !== cur.id) return `${cap(nameOf(cur.id))} gaat al vanzelf. De volgende ronde gaat verder met ${next.name}.`;
    if (green(cur.id)) return `${cap(nameOf(cur.id))} gaat vanzelf. De volgende ronde houdt het vast, met nieuwe ${T.noun}.`;
    if (s_.power) return `${cap(nameOf(cur.id))} lukt bijna altijd meteen. De volgende ronde blijft hier, tot het ook vanzelf gaat.`;
    return `De volgende ronde blijft bij ${nameOf(cur.id)}, met nieuwe ${T.noun}${res.steps ? ". Wat vandaag een tussenstap nodig had, komt terug" : ""}.`;
  }
  /* waarnemingen van één ronde, voor de stem (PL.compose) en voor de AI-haak */
  function roundFacts(res, again){
    const names = m => ctx.modeName(m);
    const reqOk = res.reqItems.filter(x => x.ok), reqNo = res.reqItems.filter(x => !x.ok);
    const help = reqOk.find(x => x.expl && names(x.expl));
    const stepItem = res.items.find(x => x.step && !x.requeue);
    const last = res.items[res.items.length - 1];
    const f = {noun: T.noun, n: res.items.length, last: last ? last.label : "", fl: res.fluent, r: S.rounds, again: !!again, adj: res.adj,
      L: (help || reqOk[0] || reqNo[0] || stepItem || {}).label || "", M: help ? names(help.expl) : roundAdj && roundAdj.mode ? names(roundAdj.mode) : "",
      Mpl: !!(help && T.explainPlural && T.explainPlural[help.expl]),
      K: lst(res.newKnown.slice(0, 2)), k: Math.min(2, res.newKnown.length), D: res.dueOk[0] || "", has: {}};
    f.has.explHelp = !!help;
    f.has.reqOk = !!reqOk.length;
    f.has.reqStill = !reqOk.length && !!reqNo.length;
    if (f.has.reqStill) f.L = reqNo[0].label;
    f.has.step = !reqOk.length && !reqNo.length && !!stepItem;
    f.has.newKnown = res.newKnown.length > 0;
    f.has.switch = res.switches > 0;
    f.has.dueOk = res.dueOk.length > 0;
    f.has.adjOk = !!res.adj && (res.adj === "lang" || (res.frBefore != null && res.fr > res.frBefore)) && (res.adj !== "uitleg" || !!f.M);
    f.has.fluent = res.fluent >= 4 && !res.steps;
    f.has.wise = !wiseShown && res.steps >= 2;
    f.has.allSelf = !res.steps && res.items.every(x => x.first);
    f.has.roundN = S.rounds >= 3;
    return f;
  }
  /* meting van de ronde voor de reden-vraag (alleen intern; Natalia ziet geen cijfers) */
  function roundMeasure(res){
    const modes = T.explainModes || null;
    const used = Object.keys(res.modes).sort((x, y) => res.modes[y] - res.modes[x])[0] || null;
    const mode = used && used !== "standaard" ? used : null;
    const stats = data.expl[res.stoneId] || {};
    const nextMode = modes ? PL.chooseExpl(modes, stats, mode || modes[0], 0.99) : null;
    return {fr: res.fr, steps: res.steps, reqN: res.reqN, reqOk: res.reqOk, switches: res.switches, mode, nextMode, hasModes: !!modes,
      pl: !!(mode && T.explainPlural && T.explainPlural[mode]), modeName: mode ? ctx.modeName(mode) : "", nextName: nextMode ? ctx.modeName(nextMode) : "", form: T.forms[form].name.toLowerCase()};
  }
  function showEnd(fresh){
    const {res, moved, again} = lastRound;
    const tooLong = (Date.now() - S.t0) > P.sessionMin * 60000;
    let fact = "";
    if (!factShown && T.aiFact){ factShown = true; fact = `<p class="pl-fact"><b>Weetje over AI.</b> ${esc(T.aiFact)}</p>`; }
    const R = lastRound.reacted, W = lastRound.why;
    screen.innerHTML = `
      <div class="pl-card" style="display:grid;gap:14px">
        <h2 class="pl-h2">Ronde klaar</h2>
        <div class="pl-cheer" id="pl-cheer" aria-live="polite">${esc(lastRound.cheer || lastRound.base)}</div>
        ${T.endExtra ? T.endExtra(ctx, res) : ""}
        <p class="pl-next"><b>Volgende ronde.</b> ${esc(lastRound.next)}</p>
        ${tooLong ? `<p class="pl-note">Je traint al een kwartier. Stoppen is prima, nog een keer ook.</p>` : ""}
        <div class="pl-react" id="pl-react">
          <span class="pl-note">Hoe ging het?</span>
          <div class="pl-row" role="group" aria-label="Hoe ging het?">
            ${["leuk", "gewoon", "pittig"].map(k => `<button class="pl-btn quiet" type="button" data-react="${k}" aria-pressed="${R === k}" ${R && R !== k ? "disabled" : ""}>${cap1(k)}</button>`).join("")}</div>
          <div id="pl-why" aria-live="polite"></div>
        </div>
        ${fact}
      </div>
      <div class="pl-row">
        <button class="pl-btn big" id="pl-again" type="button">Nog een keer</button>
        ${custom ? `<button class="pl-btn quiet" id="pl-make3" type="button">Iets anders kiezen</button>` : ""}
        <button class="pl-btn quiet" id="pl-show" type="button">Laat zien</button>
        <button class="pl-btn quiet" id="pl-stop" type="button">Stoppen voor nu</button>
      </div>`;
    const whyBox = $("pl-why");
    function renderWhy(){
      const R = lastRound.reacted, W = lastRound.why;
      if (!R || R === "gewoon" || !PL.REASONS[R]){ whyBox.innerHTML = R === "gewoon" ? `<p class="pl-note">Dank je. Gewoon is ook goed om te weten.</p>` : ""; return; }
      const Q = PL.REASONS[R];
      if (W){
        whyBox.innerHTML = `<p class="pl-note"><b>${esc(Q.opts.find(o => o[0] === W)[1])}.</b> ${esc(lastRound.reply || "")}</p>${lastRound.aiNote ? `<p class="pl-note">${esc(lastRound.aiNote)}</p>` : ""}`;
        return;
      }
      whyBox.innerHTML = `<p class="pl-note">${esc(Q.q)}</p><div class="pl-chips pl-why" role="group" aria-label="${esc(Q.q)}">${Q.opts.map(([v, t]) => `<button type="button" class="pl-chip" data-why="${v}"><b>${esc(t)}</b></button>`).join("")}</div>`;
      whyBox.querySelectorAll("[data-why]").forEach(b => b.addEventListener("click", () => {
        if (lastRound.why) return;
        const why = b.dataset.why, m = roundMeasure(res);
        lastRound.why = why; S.why[R + ":" + why] = (S.why[R + ":" + why] || 0) + 1;
        lastRound.reply = PL.reasonReply(R, why, m);
        if (!aiNoteShown && why !== "weet"){ aiNoteShown = true; lastRound.aiNote = "Zo werkt het ook bij een AI: wat jij vertelt, verandert wat er daarna gebeurt."; }
        if (lastRound.ev) Object.assign(lastRound.ev, {why, mode: m.mode || undefined});
        const adj = PL.adjustFor(R, why, m);
        if (adj){ data.adjust = Object.assign(adj, {st: res.stoneId, from: today()}); log({adjust: adj.kind, st: res.stoneId, mode: adj.mode || undefined}); }
        if (R === "pittig" && why === "uitleg" && m.mode){ const st = data.expl[res.stoneId] || (data.expl[res.stoneId] = {}); st.avoid = m.mode; const x = st[m.mode] || (st[m.mode] = {ok: 0, no: 0, sw: 0}); x.no++; }
        if (R === "leuk" && why === "snapte" && m.mode){ const st = data.expl[res.stoneId] || (data.expl[res.stoneId] = {}); const x = st[m.mode] || (st[m.mode] = {ok: 0, no: 0, sw: 0}); x.ok++; if (st.avoid === m.mode) delete st.avoid; }
        save(); renderWhy();
      }));
    }
    screen.querySelectorAll("[data-react]").forEach(b => b.addEventListener("click", () => {
      if (lastRound.reacted) return; const k = b.dataset.react; lastRound.reacted = k; S.react[k] = (S.react[k] || 0) + 1;
      const ev = {react: k, st: res.stoneId, f: form, fr: Math.round(res.fr * 100) / 100, steps: res.steps, re: res.reqN - res.reqOk, sw: res.switches, rt: median(res.rts), hint: res.hints, adj: res.adj || undefined};
      log(ev); lastRound.ev = data.events[data.events.length - 1];
      save();
      screen.querySelectorAll("[data-react]").forEach(x => { x.disabled = x !== b; x.setAttribute("aria-pressed", String(x === b)); });
      renderWhy();
    }));
    renderWhy();
    $("pl-again").addEventListener("click", () => { S.again++; data.forms[form].again++; if (lastRound.ev) lastRound.ev.again = 1; if (T.onAgain) try { T.onAgain(ctx); } catch(e){} save(); playRound(true); });
    const mk = $("pl-make3"); if (mk) mk.addEventListener("click", showMake);
    $("pl-show").addEventListener("click", () => showGarden(showEnd));
    $("pl-stop").addEventListener("click", showBye);
    $("pl-again").focus();
    if (fresh && !lastRound.cheer){
      const facts = res.items.map(x => `${x.label}: ${x.first ? "zelf in één keer" : "via een tussenstap"}${x.requeue ? " (kwam terug)" : ""}`).join("; ");
      PL.ai(`Je bent het rustige oefenmaatje in Leeratelier, een oefenspel voor een kind. Herschrijf de bemoediging hieronder in één of twee korte zinnen in het Nederlands, direct tegen Natalia.
Regels: houd het concreet over wat ze deed; verander geen feiten. Noem geen cijfers, scores, niveaus, groepen of leeftijd. Zeg niet "makkelijk", "moeilijk", "fout" of "slim". Geen emoji. Geen overdreven lof. Een tussenstap nemen is goed; benoem dat zo als het gebeurde.${again ? " Ze koos zelf voor nog een keer; beloon dat kort." : ""}
Training: ${T.title}. Vorm: ${T.forms[form].name}.
Wat er gebeurde: ${facts}.
De bemoediging uit de code: ${lastRound.base}
Antwoord alleen met de zinnen.`).then(t => { if (t){ lastRound.cheer = t; const el = $("pl-cheer"); if (el) el.textContent = t; } });
    }
  }
  function showGarden(back){

        <div><h3 class="pl-h2" style="font-size:1.2rem">${esc(T.canTitle)}</h3>${can.length ? `<ul class="pl-cando">${can.map(c => `<li>${esc(c)}</li>`).join("")}</ul>` : `<p class="pl-note">Dit lijstje groeit vanzelf als je traint.</p>`}</div>

  /* --- een ronde verlaten: eerst vragen, dan de lopende ronde netjes afbreken --- */

    $("pl-stay").addEventListener("click", () => { const c = $("pl-confirm"); if (c) c.remove(); if (onStay) onStay(); });
    $("pl-leave").addEventListener("click", () => { runId++; inRound = false; log({leave: 1, st: custom ? custom.stoneId : T.stones[data.stage - 1].id, f: form}); if (T.teardown) T.teardown(ctx); save(); go(); });

  }

  PL._current = T; PL._guard = leaveGuard;
  const hb = $("pl-home-btn"); if (hb) hb.addEventListener("click", () => leaveGuard(() => { location.hash = ""; PL.home(); }));

  function showBye(){
    screen.innerHTML = `<div class="pl-card" style="display:grid;gap:12px"><h2 class="pl-h2">Tot de volgende keer</h2>
      <p class="pl-lead">Je bloem van vandaag staat in je tuin. De volgende keer beginnen we met iets wat vandaag lukte.</p>
      <div class="pl-garden">${PL.flower(Math.min(5, S.rounds))}</div></div>
      <div class="pl-row"><button class="pl-btn quiet" id="pl-restart" type="button">Toch nog een ronde</button>${trainings.length > 1 ? `<button class="pl-btn quiet" id="pl-bye-home" type="button">Naar home</button>` : ""}</div>`;
    save();
    $("pl-restart").addEventListener("click", () => playRound(true));
    const h = $("pl-bye-home"); if (h) h.addEventListener("click", () => { location.hash = ""; PL.home(); });
  }

  wireParent(T, null, {data, resetSession(){ if (sessionAdded){ data.sessions = data.sessions.filter(x => x !== S); sessionAdded = false; } }, showStart, setLastRound(v){ lastRound = v; }});
  if (opts.make) showMake(); else showStart();
};

/* ---------- ouderscherm ---------- */
function wireParent(T, states, H){

      <div class="pl-table-wrap"><table class="pl-table"><thead><tr><th>Week van</th><th>Training</th><th>Sessies</th><th>Min</th><th>Rondes</th><th>Nog een keer</th><th>In één keer</th><th>Vlot</th><th>Tussenstappen</th><th>Mediaan s</th><th>Leuk / gewoon / pittig</th></tr></thead>

      <h3 class="pl-h3">Uitleg: welke vorm landt?</h3>
      <p class="pl-note">Een uitleg "landt" als dezelfde vraag even later in één keer lukt. Observaties per steen, geen leerstijl.</p>
      <pre class="pl-pre">${esc(weekly.explText || "Nog geen tussenstappen met een terugkomende vraag.")}</pre>
      ${weekly.adjText ? `<p class="pl-note"><b>Aanpassingen na een reden:</b> ${esc(weekly.adjText)}</p>` : ""}
      <p class="pl-note"><b>Techniek:</b> opslag = ${esc(store.kind)}; Claude = ${esc(aiKind)}; materiaalpakketten = ${content.packs.length}${content.packs.length ? " (" + content.packs.map(p => p.name).join(", ") + ")" : ""}.</p>
      <h3 class="pl-h3">Weekoverzicht (voor de chat met Claude)</h3>
      <pre id="pl-sum">${esc(text)}</pre>
      <div class="pl-row"><button class="pl-btn" id="pl-copy" type="button">Kopieer weekoverzicht</button><button class="pl-btn quiet" id="pl-copy-log" type="button">Kopieer logboek (JSONL)</button><span class="pl-note" id="pl-copied" aria-live="polite"></span></div>
      <h3 class="pl-h3">Stand bewaren, terugzetten en materiaal toevoegen</h3>
      <p class="pl-note">${esc(STORE_TEXT[store.kind] || STORE_TEXT.none)}</p>
      <div class="pl-row"><button class="pl-btn quiet" id="pl-export" type="button">Kopieer stand</button><span class="pl-note" id="pl-exported" aria-live="polite"></span></div>
      <label class="pl-note" for="pl-import">Plak hier een bewaarde stand of een materiaalpakket (JSON uit content/)</label>
      <textarea id="pl-import" spellcheck="false"></textarea>
      <div class="pl-row"><button class="pl-btn quiet" id="pl-import-btn" type="button">Verwerk</button><span class="pl-note" id="pl-imported" aria-live="polite"></span></div>
      <div class="pl-row"><button class="pl-btn quiet" id="pl-close" type="button">Sluiten</button></div>
    </div>`;
    P_.hidden = false;
    const copy = (t, okEl, label) => { const done = () => { $(okEl).textContent = label + " gekopieerd."; }; const fb = () => { $("pl-import").value = t; $("pl-import").select(); $(okEl).textContent = "Staat in het vak hieronder, geselecteerd. Kopieer met Ctrl+C of Cmd+C."; }; try { navigator.clipboard.writeText(t).then(done, fb); } catch(e){ fb(); } };
    $("pl-close").addEventListener("click", () => { P_.hidden = true; });
    $("pl-copy").addEventListener("click", () => copy(text, "pl-copied", "Weekoverzicht"));
    $("pl-copy-log").addEventListener("click", () => copy(ids.flatMap(id => (all[id].events || []).map(e => JSON.stringify(e))).join("\n"), "pl-copied", "Logboek"));
    $("pl-export").addEventListener("click", () => copy(`PHILEARN-STAND v2\n` + JSON.stringify({trainings: all, content}), "pl-exported", "Stand"));
    let pendingRaw = null;
    $("pl-import").addEventListener("input", () => { if (pendingRaw){ pendingRaw = null; $("pl-import-btn").textContent = "Verwerk"; $("pl-imported").textContent = ""; } });
    $("pl-import-btn").addEventListener("click", async () => {
      const raw = $("pl-import").value.trim(); const out = $("pl-imported");
      const m = raw.match(/^PHILEARN-STAND(?: (\S+))? v([12])\s*([\s\S]+)$/);
      if (m){
        let obj; try { obj = JSON.parse(m[3]); } catch(e){ out.textContent = "De stand is niet compleet gekopieerd."; return; }
        if (m[2] === "1"){ const id = m[1]; if (!id || !trainings.find(t => t.id === id)){ out.textContent = `Onbekende training in deze stand: ${id || "?"}.`; return; } delete obj.explanations; obj.v = 2; obj.stones = obj.stones || {}; obj.events = obj.events || []; obj = {trainings: {[id]: obj}}; }
        // een stand vervangt wat er nu is: eerst bevestigen (C9)
        if (pendingRaw !== raw){
          pendingRaw = raw;
          const ids_ = Object.keys(obj.trainings || {}).filter(id => obj.trainings[id]);
          const now = ids_.map(id => { const cur = T && id === T.id ? H.data : (states && states[id]); const nm = (trainings.find(t => t.id === id) || {title: id}).title; return `${nm}: nu ${realSessions(cur).length}, in de stand ${realSessions(obj.trainings[id]).length} sessies`; });
          out.textContent = `Dit vervangt de stand van ${ids_.length} training${ids_.length === 1 ? "" : "en"} (${now.join("; ")}). Wat er nu staat, is daarna weg. Tik nog een keer op "Ja, vervang" als dat goed is.`;
          $("pl-import-btn").textContent = "Ja, vervang";
          return;
        }
        pendingRaw = null; $("pl-import-btn").textContent = "Verwerk";
        for (const id of Object.keys(obj.trainings || {})){
          if (!obj.trainings[id]) continue;
          if (T && id === T.id){ H.resetSession(); for (const k of Object.keys(H.data)) delete H.data[k]; Object.assign(H.data, obj.trainings[id]); H.data.forms = Object.assign({A: {rounds: 0, again: 0}, B: {rounds: 0, again: 0}}, H.data.forms || {}); saving = saving.then(() => store.save("philearn-" + id, H.data)); }
          else await store.save("philearn-" + id, obj.trainings[id]);
        }
        if (obj.content){ content = obj.content; await store.save(CONTENT_KEY, content); }
        if (T) H.setLastRound(null);
        out.textContent = `Stand teruggezet voor: ${Object.keys(obj.trainings || {}).join(", ")}.`;
        setTimeout(() => { P_.hidden = true; T ? H.showStart() : PL.home(); }, 900);
        return;
      }
      let obj; try { obj = JSON.parse(raw); } catch(e){ out.textContent = "Dit is geen stand en geen pakket. Een pakket is JSON met \"training\" en \"items\"."; return; }
      if (obj.training && Array.isArray(obj.items)){
        const tr = trainings.find(t => t.id === obj.training);
        if (!tr){ out.textContent = `Onbekende training: ${obj.training}.`; return; }
        const check = tr.checkPack ? tr.checkPack(obj) : {ok: obj.items.length, bad: []};
        const name = obj.name || ("pakket-" + today());
        content.packs = content.packs.filter(p => p.name !== name).concat([{name, training: obj.training, items: obj.items, added: today()}]);
        await store.save(CONTENT_KEY, content);
        if (T && T.id === obj.training && T.loadContent) T.loadContent(content.packs.filter(p => p.training === T.id));
        out.textContent = `Pakket "${name}" toegevoegd: ${check.ok} items${check.bad.length ? `, ${check.bad.length} overgeslagen (${check.bad.slice(0, 3).join(", ")})` : ""}.`;
        return;
      }
      out.textContent = "Dit is geen stand en geen pakket. Een pakket is JSON met \"training\" en \"items\".";
    });
    $("pl-close").focus();
  }
}

/* ---------- waar de stand leeft (A5): de tekst volgt uit de opslag die echt gebruikt wordt ---------- */
const STORE_TEXT = {
  "browser (alleen dit apparaat)": "De stand staat alleen in deze browser, op dit apparaat. Op een ander apparaat, in een privévenster of na het wissen van websitegegevens (Safari: Geschiedenis wissen) begint alles opnieuw: tuin, wat vanzelf gaat en het herhaalschema. Bewaar daarom af en toe een kopie (Kopieer stand, dan in GitHub in de map stand/).",
  "Claude-opslag (chat)": "De stand staat in deze Claude-chat. Op de website of in een andere chat is hij er niet. Een kopie in GitHub (map stand/) kan altijd.",
  "Claude-opslag (gepubliceerd)": "De stand staat bij deze gepubliceerde pagina, voor jouw Claude-account. Op de website is hij er niet. Een kopie in GitHub (map stand/) kan altijd.",
  "alleen deze sessie": "Deze omgeving onthoudt niets tussen sessies. Kopieer na het trainen de stand, bewaar hem in GitHub (map stand/) en zet hem de volgende keer hier terug.",
  none: "Onbekend waar de stand staat. Bewaar na het trainen een kopie (Kopieer stand)."
};
PL.STORE_TEXT = STORE_TEXT;

/* ---------- tabel per steen (A6): alleen meten, de drempels in P blijven staan ---------- */
PL.stoneTable = function(d, T){
  const ev = (d.events || []).filter(e => e.k != null && e.ok1 != null && e.land == null);
  return T.stones.map(s => {
    const es = ev.filter(e => e.st === s.id), ok = es.filter(e => e.ok1), rts = ok.map(e => e.rt).filter(x => x != null);
    const st = (d.stones || {})[s.id] || {};
    return {id: s.id, name: s.name, n: es.length, ok1: ok.length, fluent: rts.filter(x => x <= P.fluentMs).length, med: median(rts),
      state: st.power ? "beheerst" : st.n ? "oefent" : "nog niet gezien", speed: st.speed ? "vlot" : st.power ? "nog niet vlot" : "",
      stuck: !!st.power && !st.speed};
  });
};

/* ---------- weekoverzicht: het enige dat naar de chat gaat ---------- */
PL.weekly = function(all, trainingsList){
  const rows = [], byForm = {}, hard = {}, reacts = {}, expl = [], adjs = [], stoneLines = [];
  for (const id of Object.keys(all)){
    const d = all[id]; if (!d) continue;
    const T = trainingsList.find(t => t.id === id); const name = T ? T.title : id;
    const weeks = {};
    for (const s of realSessions(d)){
      const w = weeks[weekKey(s.d)] || (weeks[weekKey(s.d)] = {week: weekKey(s.d), training: name, sessions: 0, min: 0, rounds: 0, again: 0, steps: 0, first: 0, items: 0, fluent: 0, leuk: 0, gewoon: 0, pittig: 0, rts: []});
      w.sessions++; w.min += s.min || 0; w.rounds += s.rounds || 0; w.again += s.again || 0; w.steps += s.steps || 0; w.first += s.first || 0; w.items += s.items || 0;
      w.leuk += (s.react && s.react.leuk) || 0; w.pittig += (s.react && s.react.pittig) || 0; w.gewoon += (s.react && s.react.gewoon) || 0;
    }
    for (const e of d.events || []){
      if (e.react){ const key = e.react + (e.why ? " / " + e.why : ""); const r = reacts[key] || (reacts[key] = {n: 0, fr: [], again: 0, labels: {}}); r.n++; if (e.fr != null) r.fr.push(e.fr); if (e.again) r.again++; const c = PL.classifyReact(e); r.labels[c] = (r.labels[c] || 0) + 1; continue; }
      if (e.adjResult){ adjs.push(`${name}: na "${e.adjResult}" van ${Math.round(e.before * 100)}% naar ${Math.round(e.after * 100)}% in één keer`); continue; }
      if (e.k == null || e.round || e.land != null) continue;
      const w = weeks[weekKey(e.t.slice(0, 10))]; if (!w) continue;
      if (e.ok1 && e.rt != null){ w.rts.push(e.rt); if (e.rt <= P.fluentMs) w.fluent++; }
      const fk = name + " / vorm " + e.f; const f = byForm[fk] || (byForm[fk] = {n: 0, ok: 0, rts: []});
      f.n++; if (e.ok1){ f.ok++; f.rts.push(e.rt); }
    }
    for (const w of Object.values(weeks)){ w.medianRt = median(w.rts); delete w.rts; rows.push(w); }
    for (const [k, r] of Object.entries(d.items || {})) if (r.st > 0) hard[name + ": " + (T && T.keyLabel ? T.keyLabel(k) : k)] = r;
    if (T && T.stones) for (const r of PL.stoneTable(d, T)) if (r.n) stoneLines.push(`${name}, ${r.name}: ${r.n} vragen, ${r.ok1} in één keer, ${r.fluent} vlot, mediaan ${r.med != null ? (r.med / 1000).toFixed(1) : "-"} s${r.stuck ? " (beheerst, haalt vlot nog niet)" : ""}`);
    for (const [stId, modes] of Object.entries(d.expl || {})){
      const stName = T && T.stones ? ((T.stones.find(x => x.id === stId) || {}).name || stId) : stId;
      for (const [m, v] of Object.entries(modes)){ if (m === "avoid" || !v || typeof v !== "object") continue; const n = (v.ok || 0) + (v.no || 0); if (!n) continue;
        expl.push(`${name}, ${stName}, ${(T && T.explainNames && T.explainNames[m]) || (m === "standaard" ? "de tussenstap" : m)}: ${n}x uitgelegd, ${v.ok || 0}x daarna in één keer${v.sw ? `, ${v.sw}x "anders uitleggen"` : ""}${modes.avoid === m ? " (nu even overgeslagen)" : ""}`); }
    }
  }
  rows.sort((a, b) => b.week.localeCompare(a.week) || a.training.localeCompare(b.training));
  const formsText = Object.entries(byForm).map(([k, f]) => `${k}: ${f.n} vragen, ${Math.round(100 * f.ok / Math.max(1, f.n))}% in één keer, mediaan ${f.rts.length ? (median(f.rts) / 1000).toFixed(1) : "-"} s`).join("; ");
  const hardText = Object.entries(hard).sort((a, b) => b[1].st - a[1].st).slice(0, 8).map(([k, r]) => `${k} (${r.st}x tussenstap, ${r.ok1}x in één keer)`).join("; ");
  const reactText = Object.entries(reacts).sort((a, b) => b[1].n - a[1].n).map(([k, r]) => `${k}: ${r.n}x${r.fr.length ? `, in die rondes gemiddeld ${Math.round(100 * r.fr.reduce((a, b) => a + b, 0) / r.fr.length)}% in één keer` : ""}${r.again ? `, ${r.again}x daarna nog een keer` : ""} (${Object.entries(r.labels).map(([l, n]) => n > 1 ? `${l} ${n}x` : l).join("; ")})`).join("\n");
  return {rows, formsText, hardText, byForm, reactText, explText: expl.join("\n"), stoneText: stoneLines.join("\n"), adjText: adjs.slice(-8).join("; ")};
};
PL.weeklyText = function(w){
  return [`Leeratelier weekoverzicht (${today()})`,
    ...w.rows.map(r => `Week van ${r.week}, ${r.training}: ${r.sessions} sessies, ${r.min} min, ${r.rounds} rondes, ${r.again}x nog een keer, ${r.first}/${r.items} in één keer, ${r.fluent} vlot (binnen 3 s), ${r.steps} tussenstappen, mediaan ${r.medianRt != null ? (r.medianRt / 1000).toFixed(1) : "-"} s, reactie leuk ${r.leuk} / gewoon ${r.gewoon || 0} / pittig ${r.pittig}`),
    `Per vorm: ${w.formsText || "nog niets"}`,
    `Vaakst een tussenstap: ${w.hardText || "nog niets"}`,
    `Leuk/pittig met reden (naast meting):\n${w.reactText || "nog niets"}`,
    `Uitleg per steen en vorm (landt = vraag erna in één keer):\n${w.explText || "nog niets"}`,
    `Aanpassingen na een reden: ${w.adjText || "geen"}`,
    `Per steen (tempo-drempel ${P.fluentMs / 1000} s, alleen gemeten):\n${w.stoneText || "nog niets"}`,
    `Regels voor de lezer: alleen patronen over meerdere weken benoemen; geen niveau, groep, cijfer of leeftijd; technische problemen apart van observaties.`].join("\n");
};

/* diepe links (C8): #tafels of #europa in de adresbalk wisselt van training, ook als de pagina al open is; een lopende ronde vraagt eerst */
window.addEventListener("hashchange", () => {
  const want = (location.hash || "").slice(1);
  const cur = PL._current ? PL._current.id : "";
  if (want === cur || !store) return;

});
window.addEventListener("DOMContentLoaded", () => { if (window.__plFace) PL.face = window.__plFace; PL.boot(); });
})();

</script>
<script>
/* Training: De rekenmuur v0.4 — elf stenen, elk met een generator (oneindig materiaal)
   D1 splitsen en samen 10 · D2 sprongen van 10 tot 100 · D3 brug over 10 · D4 brug over een tiental tot 100 · D5a tafels 1-5 en 10 · D5b tafels 6-9 */
(function(){
const MIN = "−";
const {rnd, pick} = PL;

/* ---------- items: key ↔ som ---------- */
// key: "<type>:<a>:<b>"  types: m (a+?=10), s (n=a+?), g (a+b over 10), t (c-b terug over 10), j (sprong +/-10-tallen), h (brug tot 100 +), k (brug tot 100 -), x (keer), d (deel)
const key = it => `${it.type}:${it.a}:${it.b}`;
function fromKey(k){ const [type, a, b] = k.split(":"); return mk(type, +a, +b); }
function mk(type, a, b, swap){
  // bij keer-sommen is a altijd de tafel (sleutel x:<tafel>:<n>); swap toont de som als n × tafel
  const it = {type, a, b};
  switch (type){
    case "m": it.ans = 10 - a; it.eq = `${a} + ? = 10`; it.label = `${a} + ? = 10`; break;
    case "s": it.ans = a - b; it.eq = `${a} = ${b} + ?`; it.label = `${a} = ${b} + ?`; break;
    case "g": it.ans = a + b; it.eq = `${a} + ${b} = ?`; it.label = `${a} + ${b}`; break;
    case "t": it.ans = a - b; it.eq = `${a} ${MIN} ${b} = ?`; it.label = `${a} ${MIN} ${b}`; break;
    case "j": it.ans = a + b; it.eq = b >= 0 ? `${a} + ${b} = ?` : `${a} ${MIN} ${-b} = ?`; it.label = b >= 0 ? `${a} + ${b}` : `${a} ${MIN} ${-b}`; break;
    case "h": it.ans = a + b; it.eq = `${a} + ${b} = ?`; it.label = `${a} + ${b}`; break;
    case "k": it.ans = a - b; it.eq = `${a} ${MIN} ${b} = ?`; it.label = `${a} ${MIN} ${b}`; break;
    case "x": it.ans = a * b; it.eq = swap ? `${b} × ${a} = ?` : `${a} × ${b} = ?`; it.label = it.eq.replace(" = ?", ""); break;
    case "d": it.ans = a / b; it.eq = `${a} : ${b} = ?`; it.label = `${a} : ${b}`; break;
    case "H": it.ans = a + b; it.eq = b >= 0 ? `${a} + ${b} = ?` : `${a} ${MIN} ${-b} = ?`; it.label = it.eq.replace(" = ?", ""); break;                       // sprongen over een honderdtal
    case "c": it.ans = dec(a + b); it.eq = b >= 0 ? `${dec(a)} + ${dec(b)} = ?` : `${dec(a)} ${MIN} ${dec(-b)} = ?`; it.label = it.eq.replace(" = ?", ""); break;   // tienden over de 1 (a, b in tienden)
    case "p": it.ans = a * b / 100; it.eq = `${a}% van ${b} = ?`; it.label = it.eq.replace(" = ?", ""); break;
    case "b": { const n = Math.floor(a / 100), teller = a % 100; it.ans = b / n * teller; it.eq = `${teller}/${n} van ${b} = ?`; it.label = it.eq.replace(" = ?", ""); break; }  // a = teller + 100·noemer
    case "v": { const [x, y, z] = [Math.floor(a / 100), a % 100, b]; const vorm = z >= 1000 ? 2 : z >= 500 ? 1 : 0; const c = z % 500 % 1000; it.v = [x, y, c, vorm];
      if (vorm === 0){ it.ans = x + y * c; it.eq = `${x} + ${y} × ${c} = ?`; } else if (vorm === 1){ it.ans = (x + y) * c; it.eq = `(${x} + ${y}) × ${c} = ?`; } else { it.ans = x * y - c; it.eq = `${x} × ${y} ${MIN} ${c} = ?`; }
      it.label = it.eq.replace(" = ?", ""); break; }
  }
  it.key = key(it);
  return it;
}
const dec = t => (t < 0 ? "-" : "") + Math.floor(Math.abs(t) / 10) + "," + Math.abs(t) % 10;    // tienden → "1,3"
const norm = v => String(v).trim().replace(".", ",").replace(/^(\d+),0$/, "$1");
const fact = it => it.eq.replace("?", String(it.ans)).replace(" = ?", "");
const STONE_OF = {m: "D1", s: "D1", j: "D2", g: "D3", t: "D3", h: "D4", k: "D4", x: "D5", d: "D5", H: "D6", c: "D7", p: "D8", b: "D9", v: "D10"};
function stoneOf(k){ const it = fromKey(k); if (it.type === "x") return it.a >= 6 && it.a <= 9 ? "D5b" : "D5a"; if (it.type === "d") return it.b >= 6 && it.b <= 9 ? "D5b" : "D5a"; return STONE_OF[it.type]; }

/* ---------- generatoren: kiezen bij voorkeur wat nog niet vlot is ---------- */
function choose(ctx, cands){
  // laagste score eerst: onbekend of met tussenstap vóór bekend; wat aan herhaling toe is, altijd eerst
  const score = it => { const r = ctx.rec(it.key); return (ctx.due(it.key) ? -20 : 0) + (ctx.known(it.key) ? 10 : 0) + (r.st > 0 && r.last === "step" ? -5 : 0) + Math.random() * 6; };
  return cands.map(it => [score(it), it]).sort((a, b) => a[0] - b[0])[0][1];
}
const STONES = [
  {id: "D1", name: "splitsen en samen 10", short: "Samen 10", gen(ctx){
    const c = []; for (let a = 1; a <= 9; a++) c.push(mk("m", a, 0)); for (let n = 3; n <= 9; n++) for (let a = 1; a < n; a++) c.push(mk("s", n, a)); return choose(ctx, c); }},
  {id: "D2", name: "sprongen van 10 tot 100", short: "Sprongen", gen(ctx){
    const c = []; for (let i = 0; i < 14; i++){ const a = rnd(11, 89), plus = Math.random() < .6; const step = 10 * rnd(1, 4); if (plus && a + step <= 100) c.push(mk("j", a, step)); else if (!plus && a - step >= 0) c.push(mk("j", a, -step)); } return c.length ? choose(ctx, c) : mk("j", 34, 10); }},
  {id: "D3", name: "de brug over 10", short: "Brug over 10", gen(ctx){
    const c = []; for (let a = 6; a <= 9; a++) for (let b = 2; b <= 9; b++) if (a + b > 10) c.push(mk("g", a, b)); for (let s = 11; s <= 18; s++) for (let b = 2; b <= 9; b++) if (s - b < 10 && s - b >= 1) c.push(mk("t", s, b)); return choose(ctx, c); }},
  {id: "D4", name: "de brug over een tiental tot 100", short: "Brug tot 100", gen(ctx){
    const c = []; for (let i = 0; i < 14; i++){ if (Math.random() < .55){ const a = rnd(12, 88); const u = a % 10; const b = rnd(10 - u + 1, 9); if (b >= 2 && b <= 9 && a + b <= 100 && u > 0) c.push(mk("h", a, b)); } else { const a = rnd(21, 99); const u = a % 10; const b = rnd(u + 1, 9); if (u < 9 && b >= 2 && a - b >= 1) c.push(mk("k", a, b)); } } return c.length ? choose(ctx, c) : mk("h", 57, 8); }},
  {id: "D5a", name: "tafels van 1 tot 5 en 10", short: "Tafels 1-5, 10", gen(ctx){
    const c = []; for (const t of [2, 3, 4, 5, 10]) for (let n = 1; n <= 10; n++){ c.push(mk("x", t, n, Math.random() < .5)); c.push(mk("d", t * n, t)); } return choose(ctx, c); }},
  {id: "D5b", name: "tafels van 6 tot 9", short: "Tafels 6-9", gen(ctx){
    const c = []; for (const t of [6, 7, 8, 9]) for (let n = 1; n <= 10; n++){ c.push(mk("x", t, n, Math.random() < .5)); c.push(mk("d", t * n, t)); } return choose(ctx, c); }},

/* ---------- toetsen en lezen ---------- */
let readFn = null, typed = "", typeT0 = 0;
function slot(){ const s = document.getElementById("rk-slot"); if (s) s.textContent = typed || " "; }
function press(k){
  if (!readFn) return;
  if (k === "wis"){ typed = typed.slice(0, -1); slot(); return; }
  if (k === "klaar"){ if (typed !== "" && typed !== ","){ const v = typed.includes(",") ? typed : +typed, f = readFn; typed = ""; readFn = null; f(v); } return; }
  if (k === "," && (typed.includes(",") || !typed)) return;
  if (typed.length < 5){ if (!typed) typeT0 = performance.now(); typed += k; slot(); }
}
document.addEventListener("keydown", e => { if (!readFn) return; if (!document.getElementById("rk-sum")){ readFn = null; typed = ""; return; } const ae = document.activeElement; if (ae && /^(INPUT|TEXTAREA)$/.test(ae.tagName)) return; if (/^[0-9]$/.test(e.key)) press(e.key); else if (e.key === "," || e.key === ".") press(","); else if (e.key === "Backspace") press("wis"); else if (e.key === "Enter"){ e.preventDefault(); press("klaar"); } });
function read(eq){
  typed = ""; typeT0 = 0;
  document.getElementById("rk-sum").innerHTML = PL.esc(eq).replace("?", `<span class="rk-slot" id="rk-slot"> </span>`);
  return new Promise(res => { readFn = res; });
}
function trail(lines){ document.getElementById("rk-trail").innerHTML = lines.map(l => `<span>${PL.esc(l)}</span>`).join(""); }

/* ---------- modellen: tienstrook, getallenlijn met sprongen, tafelrooster ---------- */
function frames(groups){
  const cells = []; for (const g of groups) for (let i = 0; i < g.n; i++) cells.push(g.cls);
  const strips = Math.max(1, Math.ceil(cells.length / 10)); let h = "";
  for (let s = 0; s < Math.min(strips, 2); s++){ h += `<div class="rk-strip">`; for (let i = 0; i < 10; i++){ const c = cells[s * 10 + i]; h += `<span class="rk-cell ${c || ""}"></span>`; } h += `</div>`; }
  show(h);
}
function numberLine(from, to, jumps, mark){
  // from..to met sprongen (array van [start, delta, label]) als bogen; mark = getal dat oplicht
  const lo = Math.floor(Math.min(from, to, ...jumps.map(j => j[0] + j[1])) / 10) * 10, hi = Math.ceil(Math.max(from, to, ...jumps.map(j => j[0] + j[1])) / 10) * 10 + (lo === Math.ceil(Math.max(from, to) / 10) * 10 ? 10 : 0);
  const W = 300, x = v => 10 + (v - lo) / Math.max(1, hi - lo) * (W - 20);
  let s = `<svg class="rk-line" viewBox="0 0 ${W} 70" aria-hidden="true"><line x1="10" y1="48" x2="${W - 10}" y2="48" stroke="#B4ABCC" stroke-width="2"/>`;
  for (let v = lo; v <= hi; v += (hi - lo > 40 ? 10 : 1)){ const big = v % 10 === 0; s += `<line x1="${x(v)}" y1="${big ? 40 : 44}" x2="${x(v)}" y2="${big ? 56 : 52}" stroke="#B4ABCC" stroke-width="1.5"/>`; if (big) s += `<text x="${x(v)}" y="68" font-size="10" text-anchor="middle" fill="#5E5876">${v}</text>`; }
  for (const [a, d, lab] of jumps){ const x1 = x(a), x2 = x(a + d); const mid = (x1 + x2) / 2; s += `<path d="M${x1} 46 Q ${mid} ${8} ${x2} 46" fill="none" stroke="#6F55D9" stroke-width="2.5"/><text x="${mid}" y="20" font-size="11" text-anchor="middle" fill="#5640B8" font-weight="600">${lab}</text>`; }
  if (mark != null) s += `<circle cx="${x(mark)}" cy="48" r="5" fill="#2F8F5E"/>`;
  s += `</svg>`; show(s);
}
function tableGrid(t, n){
  let h = `<div class="rk-grid" style="grid-template-columns:repeat(${Math.min(n, 10)},1fr)">`;
  for (let i = 0; i < n * t; i++) h += `<span class="rk-cell ${Math.floor(i / n) % 2 ? "l" : "v"}"></span>`;
  show(h + `</div><div class="rk-skip">${Array.from({length: n}, (_, i) => `<span>${t * (i + 1)}</span>`).join("")}</div>`);
}
function show(html){ const el = document.getElementById("rk-model"); el.innerHTML = html; el.classList.remove("gone"); }
function hideModel(){ document.getElementById("rk-model").classList.add("gone"); }
function clearModel(){ const el = document.getElementById("rk-model"); el.innerHTML = ""; el.classList.remove("gone"); }

function modelFor(it){
  switch (it.type){
    case "m": return () => frames([{n: it.a, cls: "v"}]);
    case "s": return () => frames([{n: it.b, cls: "v"}, {n: it.a - it.b, cls: "l"}]);
    case "g": return () => frames([{n: it.a, cls: "v"}, {n: it.b, cls: "l"}]);
    case "t": return () => frames([{n: it.a - it.b, cls: "v"}, {n: it.b, cls: "x"}]);
    case "j": return () => numberLine(it.a, it.ans, [[it.a, it.b, (it.b > 0 ? "+" : MIN) + Math.abs(it.b)]], null);
    case "h": { const r1 = 10 - it.a % 10; return () => numberLine(it.a, it.ans, [[it.a, r1, "+" + r1], [it.a + r1, it.b - r1, "+" + (it.b - r1)]], null); }
    case "k": { const r1 = it.a % 10; return () => numberLine(it.ans, it.a, [[it.a, -r1, MIN + r1], [it.a - r1, -(it.b - r1), MIN + (it.b - r1)]], null); }
    case "H": { const r1 = it.b > 0 ? Math.ceil(it.a / 100) * 100 - it.a : it.a % 100; return () => numberLine(Math.min(it.a, it.ans), Math.max(it.a, it.ans), it.b > 0 ? [[it.a, r1, "+" + r1], [it.a + r1, it.b - r1, "+" + (it.b - r1)]] : [[it.a, -r1, MIN + r1], [it.a - r1, -(-it.b - r1), MIN + (-it.b - r1)]], null); }
    case "c": return () => frames(it.b > 0 ? [{n: it.a, cls: "v"}, {n: it.b, cls: "l"}] : [{n: it.a + it.b, cls: "v"}, {n: -it.b, cls: "x"}]);
    case "p": return () => { show(`<div class="rk-bar"><span style="width:${it.a}%"></span><b>${it.a}%</b></div>`); };
    case "b": { const n = Math.floor(it.a / 100), tl = it.a % 100; return () => { show(`<div class="rk-grid" style="grid-template-columns:repeat(${n},1fr)">${Array.from({length: n}, (_, i) => `<span class="rk-cell ${i < tl ? "v" : "x"}"></span>`).join("")}</div><div class="rk-skip"><span>${it.b} in ${n} stukken</span></div>`); }; }
    case "v": return () => { show(`<div class="rk-skip"><span>eerst × en :</span><span>dan + en ${MIN}</span><span>haakjes eerst</span></div>`); };
    case "x": return () => tableGrid(it.a, it.b);
    case "d": return () => tableGrid(it.b, it.ans);
  }
}

/* ---------- oplossen met tussenstap (de stap ervoor), daarna dezelfde som opnieuw ---------- */
async function solve(ctx, eq, ans, help){
  let wrong = 0;
  while (true){
    const v = await read(eq);
    if (norm(v) === norm(ans)) return wrong === 0;
    wrong++; await help(wrong);
  }
}
async function helpMaak10(ctx, a){
  frames([{n: a, cls: "v"}]); ctx.fb.step(`Kijk naar de tienstrook: ${a} vakjes zijn vol. Hoeveel zijn er leeg?`);
  while ((await read("? lege vakjes")) !== 10 - a) ctx.fb.step("Tel de lege vakjes één voor één.");
  ctx.fb.step(`Ja, ${10 - a} leeg. Dus ${a} + ${10 - a} = 10. Nu de som zelf.`);
}
async function helpSplits(ctx, n, a){
  frames([{n: a, cls: "v"}, {n: n - a, cls: "l"}]); ctx.fb.step(`Er zijn ${n} stippen. ${a} zijn paars. Hoeveel zijn er lila?`);
  while ((await read("? lila stippen")) !== n - a) ctx.fb.step("Tel alleen de lila stippen.");
  ctx.fb.step(`Ja. ${n} is ${a} en ${n - a}. Nu de som zelf.`);
}
async function stepsBrug(ctx, a, b){            // a + b over een tiental, in stappen
  const tien = Math.ceil(a / 10) * 10, r1 = tien - a, r2 = b - r1;
  trail([`${a} + ${b}`, `eerst naar ${tien}`]);
  await solve(ctx, `${a} + ? = ${tien}`, r1, async () => { tien === 10 ? await helpMaak10(ctx, a) : (numberLine(a, tien, [[a, r1, "+" + r1]], tien), ctx.fb.step(`Van ${a} naar ${tien} is een sprong van ${r1}.`)); });
  ctx.fb.clear(); clearModel(); trail([`${a} + ${b}`, `${a} + ${r1} = ${tien}`, `splits de ${b}`]);
  await solve(ctx, `${b} = ${r1} + ?`, r2, async () => helpSplits(ctx, b, r1));
  ctx.fb.clear(); clearModel(); trail([`${a} + ${b}`, `${a} + ${r1} = ${tien}`, `${b} = ${r1} + ${r2}`]);
  await solve(ctx, `${tien} + ${r2} = ?`, tien + r2, async () => { numberLine(tien, tien + r2, [[tien, r2, "+" + r2]], null); ctx.fb.step(`${tien} en ${r2} erbij.`); });
  ctx.fb.clear(); clearModel(); trail([]);
}
async function stepsTerug(ctx, c, b){           // c - b terug over een tiental
  const tien = Math.floor(c / 10) * 10, r1 = c - tien, r2 = b - r1;
  trail([`${c} ${MIN} ${b}`, `eerst terug naar ${tien}`]);
  await solve(ctx, `${c} ${MIN} ? = ${tien}`, r1, async () => { numberLine(tien, c, [[c, -r1, MIN + r1]], tien); ctx.fb.step(`${c} is ${tien} en ${r1}. Hoeveel eraf om op ${tien} te komen?`); });
  ctx.fb.clear(); clearModel(); trail([`${c} ${MIN} ${b}`, `${c} ${MIN} ${r1} = ${tien}`, `splits de ${b}`]);
  await solve(ctx, `${b} = ${r1} + ?`, r2, async () => helpSplits(ctx, b, r1));
  ctx.fb.clear(); clearModel(); trail([`${c} ${MIN} ${b}`, `${c} ${MIN} ${r1} = ${tien}`, `${b} = ${r1} + ${r2}`]);
  await solve(ctx, `${tien} ${MIN} ${r2} = ?`, tien - r2, async () => { tien === 10 ? frames([{n: 10 - r2, cls: "v"}, {n: r2, cls: "x"}]) : numberLine(tien - r2, tien, [[tien, -r2, MIN + r2]], null); ctx.fb.step(`Haal ${r2} weg van ${tien}.`); });
  ctx.fb.clear(); clearModel(); trail([]);
}
async function stepsSprong(ctx, it){
  const d = it.b, n = Math.abs(d) / 10; let cur = it.a;
  for (let i = 0; i < n; i++){
    const nxt = cur + (d > 0 ? 10 : -10);
    trail([it.label, `sprong ${i + 1} van ${n}`]); numberLine(it.a, it.ans, [[cur, d > 0 ? 10 : -10, d > 0 ? "+10" : MIN + "10"]], cur);
    await solve(ctx, `${cur} ${d > 0 ? "+" : MIN} 10 = ?`, nxt, async () => { ctx.fb.step(`Alleen het tiental verandert: ${cur} wordt ${nxt}. De ${cur % 10} blijft staan.`); });
    cur = nxt; ctx.fb.clear();
  }
  clearModel(); trail([]);
}
async function stepsTafel(ctx, it){
  // via de sprongen: t, 2t, 3t ... tot n×t; of via 5× / 10× als steun
  const t = it.type === "x" ? it.a : it.b;
  const n = it.type === "x" ? it.b : it.ans;
  const anchor = n > 5 ? 5 : 0;
  if (anchor){ trail([it.label, `eerst 5 × ${t}`]); tableGrid(t, 5); await solve(ctx, `5 × ${t} = ?`, 5 * t, async () => ctx.fb.step(`Tel in sprongen van ${t}: ${Array.from({length: 5}, (_, i) => t * (i + 1)).join(", ")}.`)); ctx.fb.clear(); }
  let cur = anchor * t;
  for (let i = anchor + 1; i <= n; i++){
    trail([it.label, `sprong ${i}: ${cur} + ${t}`]); tableGrid(t, i);
    await solve(ctx, `${cur} + ${t} = ?`, cur + t, async () => ctx.fb.step(`Nog één sprong van ${t} erbij.`));
    cur += t; ctx.fb.clear();
  }
  if (it.type === "d") ctx.fb.step(`${n} sprongen van ${t} is ${it.a}. Dus ${it.a} : ${t} = ${n}.`);
  clearModel(); trail([]);
}

async function stepsBrug100(ctx, it){
  if (it.b > 0){ const hon = Math.ceil(it.a / 100) * 100, r1 = hon - it.a, r2 = it.b - r1;
    trail([it.label, `eerst naar ${hon}`]); await solve(ctx, `${it.a} + ? = ${hon}`, r1, async () => { numberLine(it.a, hon, [[it.a, r1, "+" + r1]], hon); ctx.fb.step(`Van ${it.a} naar ${hon} is een sprong van ${r1}.`); });
    ctx.fb.clear(); clearModel(); trail([it.label, `${it.a} + ${r1} = ${hon}`, `nog ${r2} erbij`]); await solve(ctx, `${hon} + ${r2} = ?`, hon + r2, async () => ctx.fb.step(`${hon} en ${r2} erbij.`));
  } else { const hon = Math.floor(it.a / 100) * 100, r1 = it.a - hon, r2 = -it.b - r1;
    trail([it.label, `eerst terug naar ${hon}`]); await solve(ctx, `${it.a} ${MIN} ? = ${hon}`, r1, async () => { numberLine(hon, it.a, [[it.a, -r1, MIN + r1]], hon); ctx.fb.step(`${it.a} is ${hon} en ${r1}.`); });
    ctx.fb.clear(); clearModel(); trail([it.label, `${it.a} ${MIN} ${r1} = ${hon}`, `nog ${r2} eraf`]); await solve(ctx, `${hon} ${MIN} ${r2} = ?`, hon - r2, async () => ctx.fb.step(`Haal ${r2} van ${hon} af.`));
  }
  ctx.fb.clear(); clearModel(); trail([]);
}
async function stepsKomma(ctx, it){
  const a = it.a, b = it.b;
  if (b > 0){ const heel = Math.ceil(a / 10) * 10, r1 = heel - a, r2 = b - r1;
    trail([it.label, `eerst naar ${dec(heel)}`]); await solve(ctx, `${dec(a)} + ? = ${dec(heel)}`, dec(r1), async () => { frames([{n: a, cls: "v"}]); ctx.fb.step(`Elk vakje is 0,1. Hoeveel vakjes tot ${dec(heel)}?`); });
    ctx.fb.clear(); clearModel(); trail([it.label, `${dec(a)} + ${dec(r1)} = ${dec(heel)}`, `nog ${dec(r2)} erbij`]); await solve(ctx, `${dec(heel)} + ${dec(r2)} = ?`, dec(heel + r2), async () => ctx.fb.step(`${dec(heel)} en ${dec(r2)} erbij: ${dec(heel + r2)}. Typ het met een komma.`));
  } else { const heel = Math.floor(a / 10) * 10, r1 = a - heel, r2 = -b - r1;
    trail([it.label, `eerst terug naar ${dec(heel)}`]); await solve(ctx, `${dec(a)} ${MIN} ? = ${dec(heel)}`, dec(r1), async () => { frames([{n: a, cls: "v"}]); ctx.fb.step(`${dec(a)} is ${dec(heel)} en ${dec(r1)}.`); });
    ctx.fb.clear(); clearModel(); trail([it.label, `${dec(a)} ${MIN} ${dec(r1)} = ${dec(heel)}`, `nog ${dec(r2)} eraf`]); await solve(ctx, `${dec(heel)} ${MIN} ${dec(r2)} = ?`, dec(heel - r2), async () => ctx.fb.step(`Haal ${dec(r2)} van ${dec(heel)} af. Typ het met een komma.`));
  }
  ctx.fb.clear(); clearModel(); trail([]);
}
async function stepsProcent(ctx, it){
  const p = it.a, n = it.b;
  if (p === 1 || p === 5 || p === 20 || p === 10){ trail([it.label, "eerst 10%"]); await solve(ctx, `10% van ${n} = ?`, n / 10, async () => ctx.fb.step(`10% is een tiende: ${n} : 10.`)); ctx.fb.clear();
    if (p === 1){ trail([it.label, `10% = ${n / 10}`, "1% is nog eens : 10"]); await solve(ctx, `${n / 10} : 10 = ?`, n / 100, async () => ctx.fb.step(`1% is 10% gedeeld door 10.`)); }
    if (p === 5){ trail([it.label, `10% = ${n / 10}`, "5% is de helft"]); await solve(ctx, `${n / 10} : 2 = ?`, n / 20, async () => ctx.fb.step(`5% is de helft van 10%.`)); }
    if (p === 20){ trail([it.label, `10% = ${n / 10}`, "20% is twee keer"]); await solve(ctx, `2 × ${n / 10} = ?`, n / 5, async () => ctx.fb.step(`20% is twee keer 10%.`)); }
  } else if (p === 50){ trail([it.label, "50% is de helft"]); await solve(ctx, `${n} : 2 = ?`, n / 2, async () => ctx.fb.step(`De helft van ${n}.`)); }
  else { trail([it.label, "eerst 50%"]); await solve(ctx, `${n} : 2 = ?`, n / 2, async () => ctx.fb.step(`50% is de helft.`)); ctx.fb.clear(); trail([it.label, `50% = ${n / 2}`, "25% is de helft daarvan"]); await solve(ctx, `${n / 2} : 2 = ?`, n / 4, async () => ctx.fb.step(`25% is de helft van 50%.`));
    if (p === 75){ ctx.fb.clear(); trail([it.label, `25% = ${n / 4}`, "75% is drie keer"]); await solve(ctx, `3 × ${n / 4} = ?`, 3 * n / 4, async () => ctx.fb.step(`75% is drie keer 25%.`)); } }
  ctx.fb.clear(); clearModel(); trail([]);
}
async function stepsBreuk(ctx, it){
  const n = Math.floor(it.a / 100), tl = it.a % 100, deel = it.b / n;
  trail([it.label, `eerst 1/${n}`]); await solve(ctx, `${it.b} : ${n} = ?`, deel, async () => ctx.fb.step(`1/${n} van ${it.b} is ${it.b} gedeeld door ${n}. Tel in sprongen van ${n}.`));
  if (tl > 1){ ctx.fb.clear(); trail([it.label, `1/${n} = ${deel}`, `${tl}/${n} is ${tl} keer`]); await solve(ctx, `${tl} × ${deel} = ?`, tl * deel, async () => ctx.fb.step(`${tl}/${n} is ${tl} keer zo'n deel.`)); }
  ctx.fb.clear(); clearModel(); trail([]);
}
async function stepsVolgorde(ctx, it){
  const [x, y, c, vorm] = it.v;
  if (vorm === 0){ trail([it.label, "eerst keer"]); await solve(ctx, `${y} × ${c} = ?`, y * c, async () => ctx.fb.step(`Keer gaat voor plus. Eerst ${y} × ${c}.`)); ctx.fb.clear(); trail([it.label, `${y} × ${c} = ${y * c}`, "dan plus"]); await solve(ctx, `${x} + ${y * c} = ?`, x + y * c, async () => ctx.fb.step(`Nu ${x} erbij.`)); }
  else if (vorm === 1){ trail([it.label, "eerst de haakjes"]); await solve(ctx, `${x} + ${y} = ?`, x + y, async () => ctx.fb.step(`Haakjes gaan voor alles.`)); ctx.fb.clear(); trail([it.label, `(${x} + ${y}) = ${x + y}`, "dan keer"]); await solve(ctx, `${x + y} × ${c} = ?`, (x + y) * c, async () => ctx.fb.step(`Nu keer ${c}.`)); }
  else { trail([it.label, "eerst keer"]); await solve(ctx, `${x} × ${y} = ?`, x * y, async () => ctx.fb.step(`Keer gaat voor min.`)); ctx.fb.clear(); trail([it.label, `${x} × ${y} = ${x * y}`, "dan min"]); await solve(ctx, `${x * y} ${MIN} ${c} = ?`, x * y - c, async () => ctx.fb.step(`Nu ${c} eraf.`)); }
  ctx.fb.clear(); clearModel(); trail([]);
}

/* ---------- Hinkelen: stenen op het pad ---------- */
function distractors(it){
  const t = it.t, n = it.n, a = it.ans;
  const cur = t * (n - 1);
  const pool = [a + 1, a - 1, a + 2, a - 2, a + t, (t + 1) * n, (t - 1) * n, a + 10, a - 10].filter(v => v > 0 && v !== a && v !== cur && v <= 110);
  const out = []; for (const v of shuffle([...new Set(pool)])){ if (out.length < 3) out.push(v); }
  return out;
}
function hinkelScene(it){
  const cur = it.t * (it.n - 1);
  const nums = shuffle([it.ans].concat(distractors(it)));
  const tilt = () => `style="--r:${rnd(-5, 5)}deg;--y:${rnd(-6, 6)}px"`;
  return `<div class="tf-pad-scene">
    <div class="tf-start"><span class="tf-stone here" id="tf-here"><b>${cur || "start"}</b>${avatar()}</span><span class="tf-arrow">+${it.t}</span></div>
    <div class="tf-stones" role="group" aria-label="Kies de steen">${nums.map(v => `<button type="button" class="tf-stone" data-v="${v}" aria-label="steen ${v}" ${tilt()}><b>${v}</b><i class="tf-puff" aria-hidden="true"></i></button>`).join("")}</div>
    <div class="tf-trail" id="tf-trail" aria-hidden="true">${range(1, it.n - 1).map(i => `<span>${it.t * i}</span>`).join("")}</div>
  </div>`;
}
const waitStone = box => new Promise(res => box.querySelectorAll(".tf-stone[data-v]").forEach(b => { b.onclick = () => res([+b.dataset.v, b]); }));
